<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FPS 搜打撤 · 学校逃离 3D</title>
<style>
  :root{ --accent:#7c5cff; --accent2:#a88cff; --bg:#0b0e14; --panel:rgba(14,18,28,.92); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0e14; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e8f0; touch-action:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block;
      /* saltline 观感：提对比 + 压高光 + 微降饱和 + 轻微色偏。
         CSS filter 走 GPU 合成，几乎零开销，不需要 EffectComposer。 */
      filter: contrast(1.18) saturate(0.92) brightness(1.04) hue-rotate(-4deg);
    }
  /* 后处理叠加层：暗角 + 色调 + 颗粒（对应 saltline 的最终合成 pass） */
  #grade{ position:fixed; inset:0; z-index:4; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(120,170,255,.06) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 70%, rgba(255,190,120,.05) 100%);
    mix-blend-mode:normal;
  }
  /* 胶片颗粒：用 SVG 噪声做平铺，静态不闪，成本可忽略 */
  #grain{ position:fixed; inset:0; z-index:5; pointer-events:none; opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    background-size:120px 120px;
  }
  /* HUD */
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  /* 视角触摸层：覆盖全屏，位于摇杆/按钮之下 */
  #viewLayer{ position:fixed; right:0; top:0; bottom:0; width:50%; z-index:25; touch-action:none; background:transparent; }
  /* 右半屏负责转视角；左半屏只归摇杆。两者不重叠，
     否则摇杆铺满左半屏会把视角拖拽抢走（反之亦然）。 */
  /* 游戏内常驻操作提示（手机端小字条） */
  #htip{ position:absolute; left:50%; transform:translateX(-50%); bottom:58px; max-width:94vw; padding:5px 10px; border-radius:8px; background:rgba(10,14,22,.72); border:1px solid rgba(124,92,255,.35); color:#c8d0e0; font-size:10.5px; line-height:1.5; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .6s; }
  #htip.hide{ opacity:0; }
  /* 门交互提示：靠近门时出现在屏幕【中上方】。
     原来放在 bottom:96px 正中间，结果和右下的按键群、左边的摇杆
     在窄屏/横屏时叠在一起，看着像「开门键和原按键重叠」。
     现在抬到顶部 1/3 处，远离所有触摸控件，也不会挡住准星以外的视野。 */
  #doorHint{ display:none; position:fixed; left:50%; top:22%; transform:translateX(-50%);
    padding:9px 16px; border-radius:10px; background:rgba(10,14,22,.86);
    border:1px solid rgba(120,255,180,.55); color:#d8ffe8; font-size:14px; font-weight:600;
    backdrop-filter:blur(6px); cursor:pointer; z-index:70; white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.45); }
  #doorHint b{ display:inline-block; min-width:20px; padding:1px 6px; margin-right:6px;
    border-radius:5px; background:rgba(120,255,180,.22); border:1px solid rgba(120,255,180,.6);
    color:#9effc4; font-size:12px; text-align:center; }
  #doorHint:active{ background:rgba(120,255,180,.25); }
  #topbar{ position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; }
  .pill{ background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:7px 12px; font-size:13px; font-weight:600; backdrop-filter:blur(6px); }
  .pill b{ color:var(--accent2); }
  /* 射击模式徽标：全自动/半自动/栓动/泵动。
     auto 用青色高亮，跳单发的模式用橙色，一眼能看出手感差别。 */
  #fireModeTag{ margin-left:7px; font-size:10.5px; font-weight:700; letter-spacing:.04em;
    padding:1.5px 6px; border-radius:6px; background:rgba(255,255,255,.10);
    color:#9fb0c8; vertical-align:1px; }
  #fireModeTag.auto{ color:#0b1a14; background:#48d99a; }
  #fireModeTag.pump,#fireModeTag.bolt{ color:#2a1a05; background:#f0a35a; }
  #fireModeTag.semi{ color:#1a1226; background:#a78bfa; }
  #hpwrap{ flex:1; min-width:80px; }
  #hpbar{ height:8px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; margin-top:5px; }
  #hpfill{ height:100%; width:100%; background:linear-gradient(90deg,#48c774,#8ce6a0); border-radius:6px; transition:width .2s; }
  #hpfill.low{ background:linear-gradient(90deg,#e6533c,#ff8a70); }
  #crosshair{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after{ content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair::before{ left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  #hitmark{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; opacity:0; transition:opacity .1s; }
  #hitmark span{ position:absolute; width:12px; height:3px; background:#fff; border-radius:2px; }
  #hitmark .h1{ top:-1px; left:-1px; transform:rotate(45deg); } #hitmark .h2{ top:-1px; right:-1px; transform:rotate(-45deg); }
  #hitmark .h3{ bottom:-1px; left:-1px; transform:rotate(-45deg); } #hitmark .h4{ bottom:-1px; right:-1px; transform:rotate(45deg); }
  /* 消息 / 拾取提示 */
  #msg{ position:absolute; top:70px; left:50%; transform:translateX(-50%); text-align:center; font-size:15px; font-weight:600; text-shadow:0 1px 4px #000; pointer-events:none; opacity:0; transition:opacity .2s; }
  #prompt{ position:absolute; bottom:130px; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 16px; border-radius:10px; font-size:14px; border:1px solid var(--accent); opacity:0; transition:opacity .15s; }
  #toast{ position:absolute; bottom:140px; left:50%; transform:translateX(-50%); color:#7ee8a0; font-size:14px; font-weight:600; opacity:0; text-shadow:0 1px 3px #000; white-space:nowrap; }
  /* 加载/错误提示 */
  #loaderr{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff7a6a; font-size:15px; font-weight:700; text-align:center; z-index:200; background:rgba(20,8,8,.92); padding:16px 22px; border-radius:12px; border:1px solid #c2382a; display:none; max-width:80%; line-height:1.6; }
  /* 摇杆（移动端）
     【摇杆固定】原来 #joyZone 是 left:0 / width:50% / height:100% 的整块半屏，
      它会盖住左下角一大片，和右侧操作区在窄屏/横屏时直接重叠，
      视觉上就像「摇杆穿模到交互按钮里」。
       现在改成：摇杆区域 = 摇杆本体 + 一圈触摸余量的小方块，
       尺寸随 #joyBase 走，位置固定在左下角，绝不外溢到按钮区。 */
  #joyZone{ position:fixed; left:0; bottom:0; width:210px; height:210px; display:none; pointer-events:auto; z-index:60; touch-action:none; background:transparent; }
  #joyBase{ position:absolute; left:110px; top:calc(100% - 110px); width:110px; height:110px; margin:0; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(124,92,255,.5); box-shadow:0 0 0 6px rgba(124,92,255,.08); touch-action:none; transform:translate(-50%,-50%); pointer-events:none; }
  #joyStick{ position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.35); transform:translate(-50%,-50%); }
  /* 右侧操作区（移动端） */
  /* ===== 右侧按键布局（按用户示意图） =====
                                 瞄准
        摇杆              跳跃    开火
                         趴下     换弹

      换成两列三行的紧凑方阵：
        右列（贴屏幕右边缘）：开火（大）/ 换弹
        左列：跳跃（上）/ 趴下（下）
        瞄准单独浮在两列左上方

      以前是散落的 5 个按钮各自 right/bottom 定位，
      互相之间没有对齐关系，窄屏时会叠在一起。 */
  #actZone{ position:fixed; bottom:0; right:0; width:50%; height:55%;
            display:none; pointer-events:none; z-index:35; }

  /* 所有按钮统一基准尺寸，靠 CSS 变量缩放 */
  #actZone{ --bs:56px; --gap:8px; --big:84px; }

  #btnFire{ right:16px; bottom:16px;
            width:var(--big); height:var(--big);
            border-color:#ff5a4d; background:rgba(255,90,77,.18); font-size:15px; }
  #btnFire .ico{ width:36px; height:36px; }

  #btnReload{ right:16px; bottom:calc(16px + var(--big) + var(--gap));
              width:var(--bs); height:var(--bs); }
  #btnReload .ico{ width:26px; height:26px; }

  #btnJump{ right:calc(16px + var(--big) + var(--gap)); bottom:calc(16px + var(--bs) + var(--gap));
            width:var(--bs); height:var(--bs); }
  #btnJump .ico{ width:26px; height:26px; }

  #btnProne{ right:calc(16px + var(--big) + var(--gap)); bottom:16px;
             width:var(--bs); height:var(--bs); }
  #btnProne .ico{ width:26px; height:26px; }

  /* 瞄准：浮在跳跃/趴下这列的正上方，明确远离开火 */
  #btnAim{ right:calc(16px + var(--big) + var(--gap)); bottom:calc(16px + var(--big) + var(--gap)*2);
           width:64px; height:64px; border-color:#7c5cff; }
  #btnAim .ico{ width:28px; height:28px; }
  #btnAim.active{ background:rgba(124,92,255,.55); border-color:#7c5cff; }
  /* 检视按钮：放在开镜左边一格，不抢开火键的位置 */
  #btnInspect{ right:calc(16px + (var(--big) + var(--gap))*2); bottom:16px; }
  #btnInspect .ico{ width:24px; height:24px; }

  /* ==== GM 隐藏面板（主菜单连点 D 15 次）====
     浮在屏幕上层，可拖动、可收起。z-index 比遮罩(9999)略低但比
     菜单(100)/商店(210)都高，这样开着商店也能调出 GM 加钱。 */
  #gmPanel{ position:fixed; right:18px; bottom:18px; z-index:9000; width:236px;
    background:rgba(12,15,24,.96); border:1px solid rgba(124,92,255,.55);
    border-radius:14px; box-shadow:0 14px 44px rgba(0,0,0,.65),
    0 0 0 1px rgba(124,92,255,.18) inset; display:none;
    font-size:12.5px; color:#e8ecf5; backdrop-filter:blur(10px);
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #gmPanel.on{ display:block; }
  #gmPanel.min .gmb{ display:none; }
  #gmPanel.min{ width:auto; }
  /* 标题栏：拖动区 */
  #gmHead{ display:flex; align-items:center; gap:8px; padding:9px 11px;
    cursor:grab; border-bottom:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg,rgba(124,92,255,.26),rgba(124,92,255,.06));
    border-radius:13px 13px 0 0; }
  #gmPanel.min #gmHead{ border-bottom:none; border-radius:13px; }
  #gmHead:active{ cursor:grabbing; }
  #gmHead .t{ font-weight:800; letter-spacing:.06em; font-size:12px;
    color:#c9b8ff; flex:1; white-space:nowrap; }
  #gmHead .dot{ width:7px; height:7px; border-radius:50%; background:#48d99a;
    box-shadow:0 0 8px #48d99a; flex:none; }
  #gmMin{ flex:none; width:22px; height:22px; line-height:1; border:none;
    background:rgba(255,255,255,.12); color:#dfe5f0; border-radius:7px;
    font-size:14px; font-weight:700; cursor:pointer; padding:0; }
  #gmMin:active{ background:rgba(255,255,255,.26); }
  .gmb{ padding:11px; display:flex; flex-direction:column; gap:8px; }
  .gmrow{ display:flex; gap:6px; }
  .gmbtn{ flex:1; border:1px solid rgba(255,255,255,.14); border-radius:9px;
    background:rgba(255,255,255,.07); color:#e8ecf5; font-size:12px;
    font-weight:700; padding:9px 6px; cursor:pointer; transition:.12s; }
  .gmbtn:active{ transform:scale(.95); background:rgba(124,92,255,.5); }
  .gmbtn.money{ background:linear-gradient(180deg,rgba(255,213,74,.28),rgba(255,213,74,.10));
    border-color:rgba(255,213,74,.5); color:#ffe89a; }
  .gmbtn.money:active{ background:rgba(255,213,74,.55); }
  #gmCash{ font-size:19px; font-weight:800; color:#ffd54a; text-align:center;
    letter-spacing:.02em; padding:2px 0 4px; }
  #gmCash small{ font-size:10px; color:#8d97a8; font-weight:600;
    letter-spacing:.08em; display:block; margin-bottom:2px; }

  /* 交互（开门/拾取）挪到中间偏上，彻底离开右下按键群 */
  #btnInteract{ right:50%; transform:translateX(50%);
                bottom:calc(16px + var(--big) + var(--gap));
                width:58px; height:58px; }
  #btnInteract .ico{ width:26px; height:26px; }

  /* 奔跑：紧贴开火上方的斜角位，避免压住换弹 */
  #btnSprint{ right:calc(16px + var(--big) + var(--gap));
              bottom:calc(16px + var(--big) + var(--gap));
              width:52px; height:52px; }
  #btnSprint .ico{ width:22px; height:22px; }
  .actbtn{ position:absolute; width:64px; height:64px; border-radius:50%; background:var(--panel); border:2px solid rgba(255,255,255,.2); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:auto; touch-action:none; }
  .actbtn:active{ background:var(--accent); }
  /* 按钮图标（SVG，currentColor 跟随主题）
     【统一图标体系】全部改用 Lucide 官方图标（ISC 许可）的描边风格：
     统一 24×24 viewBox、stroke-width 2、round 端点，
     不再混用「部分实心填充 + 部分描边」的写法——
     以前开火是实心子弹、开镜是自绘十字、跳跃是火柴人，
     线宽和风格各不相同，看起来像拼凑的。
     描边图标在深色半透明按钮上辨识度更高，也更像正经射击手游的 UI。 */
  .actbtn .ico{ width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  #btnFire .ico{ width:38px; height:38px; }
  #btnJump .ico{ width:30px; height:30px; }
  #btnAim.active{ background:rgba(124,92,255,.55); border-color:#7c5cff; }
  /* 开火键的配色单独留下：这只是颜色和字号，不涉及 right/bottom 定位。
     定位仍然全部交给上面那套 calc 公式。 */
  #btnFire{ border-color:#ff5a4d; background:rgba(255,90,77,.18); font-size:15px; }
/* 【已删除的旧定位】这里原本还有一套
       #btnFire{right:26px;bottom:26px;...}
       #btnAim{right:118px;bottom:96px;...}
       #btnJump{right:126px;bottom:22px;}
       #btnReload{right:30px;bottom:126px;}
       #btnInteract{right:204px;bottom:34px;...}
       #btnSprint{right:196px;bottom:110px;...}
     选择器权重和上面那套 calc 公式完全相同，而它们在文件里更靠后，
     于是后写的这一套直接生效 —— 上面精心算好的两列方阵被整个推翻，
     按钮又散回原来那种「各按各的像素值」的摆法，窄屏就叠在一起。
     这是「按键重叠」反复出现、改了没用 的根本原因。
     ​现在统一由上面的 CSS 变量 + calc 决定位置，这里不再重复定义。 */

  /* ===== 底部中间：武器切换条 =====
     按用户要求「直接在下面的中间」。
     三个格子：主武器 / 手枪 / 副武器。
     空槽变暗不可点，当前手持那个高亮。
     位置钉在屏幕底部正中，夹在左摇杆和右按键群之间，
     所以宽度要收紧一点（最多 3 格 × 58px + 间距），
     并且在窄屏上自动缩小，避免和摇杆/开火键撞上。 */
  #wpnBar{ position:fixed; left:50%; transform:translateX(-50%);
           bottom:14px; display:flex; gap:6px; z-index:36;
           pointer-events:auto; }
  #wpnBar .ws{
    width:58px; height:52px; border-radius:11px;
    background:rgba(14,18,28,.86); border:2px solid rgba(255,255,255,.16);
    color:#cfd6e6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    cursor:pointer; touch-action:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .12s, background .12s, transform .08s;
  }
  #wpnBar .ws .wi{ font-size:19px; line-height:1; }
  #wpnBar .ws .wn{ font-size:9.5px; line-height:1; letter-spacing:.02em;
                   opacity:.8; white-space:nowrap; max-width:54px;
                   overflow:hidden; text-overflow:ellipsis; }
  /* 当前手持 */
  #wpnBar .ws.on{ border-color:#7c5cff; background:rgba(124,92,255,.3);
                  color:#fff; box-shadow:0 0 12px rgba(124,92,255,.45); }
  #wpnBar .ws.on .wn{ opacity:1; }
  /* 空槽：不能点，明显变暗 */
  #wpnBar .ws.empty{ opacity:.34; cursor:default; border-style:dashed; }
  #wpnBar .ws:active{ transform:scale(.94); }
  #wpnBar .ws.empty:active{ transform:none; }

  /* 窄屏：底部中间夹在摇杆和按键之间，宽度必须收一收，
     否则 3×58=174px 加上间距会和开火键撞上。 */
  @media (max-width:520px){
    #wpnBar{ bottom:10px; gap:4px; }
    #wpnBar .ws{ width:46px; height:42px; border-radius:9px; }
    #wpnBar .ws .wi{ font-size:15px; }
    #wpnBar .ws .wn{ font-size:8px; max-width:42px; }
  }
  @media (max-width:380px){
    #wpnBar .ws{ width:38px; height:36px; }
    #wpnBar .ws .wn{ font-size:7px; max-width:34px; }
  }

  /* ============ 横屏强制遮罩 ============
   竖屏时盖住整个游戏，要求用户转屏。
   z-index 要比所有东西都高（商店 210、背包 210、死亡界面）
   否则会出现「遮罩下面还能点到按钮」。 */
#orientMask{
  position:fixed; inset:0; z-index:9999;
  display:none;                /* 由 orientRefresh() 改成 flex */
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #171c2b 0%, #0b0e14 70%);
  touch-action:none;
}
#orientMask .omBox{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:28px 26px; max-width:88vw; text-align:center;
}
#orientMask .omIcon{
  font-size:54px; line-height:1;
  animation:omSpin 2.4s ease-in-out infinite;
}
/* 手机图标左右摇一下，比箭头更直观地暗示「转过来」 */
@keyframes omSpin{
  0%,45%   { transform:rotate(0deg); }
  55%,100% { transform:rotate(90deg); }
}
#orientMask .omTitle{
  font-size:20px; font-weight:800; color:#e8e8f0; letter-spacing:.5px;
}
#orientMask .omDesc{
  font-size:13px; line-height:1.7; color:#9aa6bd; max-width:420px;
}
#orientMask .omBtn{
  margin-top:4px; padding:11px 26px; border-radius:11px; cursor:pointer;
  border:2px solid var(--accent); background:rgba(124,92,255,.22);
  color:#cbbcff; font-size:14px; font-weight:700; font-family:inherit;
}
#orientMask .omBtn:active{ transform:scale(.96); }

/* ============ 语言切换按钮 ============
   复用主菜单 .btn.ghost.small 的外观，这里只补一点宽度保证
   「🌐 English」和「🌐 中文」切换时按钮不会尺寸跳动。 */
#langBtn{ min-width:96px; }

/* 英文文案普遍比中文长 30% 左右，主菜单 .box 高度会溢出。
   只对英文收紧行距与字号，中文保持原样不受影响。 */
html[data-lang="en"] #menu .box{ line-height:1.5; }
html[data-lang="en"] #menu h1{ font-size:clamp(18px,3.2vw,26px); }
html[data-lang="en"] #menu p.sub{ font-size:12px; }
html[data-lang="en"] #menu .kk span{ font-size:11px; }
html[data-lang="en"] #menu .btn{ font-size:12.5px; }
html[data-lang="en"] .keysbox-note{ font-size:10.5px; }

/* 英文下 HUD 的「背包」比「Backpack」短，pill 会被撑宽。
   给一个上限并省略，避免挤掉右侧的弹药格。 */
html[data-lang="en"] #bagBtn span{
  display:inline-block; max-width:58px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom;
}

/* 菜单 */
  #menu{ position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.92); display:flex; align-items:center; justify-content:center; padding:20px; }
  #menu .box{ width:100%; max-width:520px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(124,92,255,.7) rgba(255,255,255,.06); background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:24px; }
  #menu .box::-webkit-scrollbar{ width:8px; }
  #menu .box::-webkit-scrollbar-track{ background:rgba(255,255,255,.06); border-radius:4px; }
  #menu .box::-webkit-scrollbar-thumb{ background:rgba(124,92,255,.75); border-radius:4px; }
  .keysbox{ margin:4px 0 14px; padding:14px; border-radius:12px; background:rgba(124,92,255,.13); border:1px solid rgba(124,92,255,.42); box-shadow:0 0 0 1px rgba(124,92,255,.1) inset; }
  .keysbox-t{ font-size:12.5px; letter-spacing:.08em; color:#b9a6ff; margin-bottom:10px; font-weight:700; }
  .keysgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .kk{ display:flex; align-items:center; gap:5px; font-size:12px; color:#c8d0e0; }
  .kk kbd{ display:inline-block; min-width:20px; padding:2px 6px; font:600 11px/1.4 ui-monospace,monospace; text-align:center; color:#e8ecf5; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-bottom-width:2px; border-radius:5px; }
  .kk span{ color:#98a0b0; }
  .keysbox-note{ margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.09); font-size:11.5px; color:#8b93a6; line-height:1.6; }
  h1{ font-size:22px; margin-bottom:4px; } h1 span{ color:var(--accent2); }
  .sub{ color:#98a0b0; font-size:13px; margin-bottom:18px; }
  .row{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .btn{ pointer-events:auto; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:active{ filter:brightness(1.2); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,.2); }
  .btn.danger{ background:#c2382a; }
  .btn.small{ padding:8px 12px; font-size:13px; }
  .stat{ background:rgba(255,255,255,.05); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; }
  .stat .k{ font-size:11px; color:#98a0b0; } .stat .v{ font-size:18px; font-weight:800; color:var(--accent2); }
  .shoprow{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid rgba(255,255,255,.1); border-radius:10px; margin-top:8px; background:rgba(255,255,255,.03); }
  .shoprow .info{ flex:1; } .shoprow .n{ font-weight:700; font-size:14px; } .shoprow .d{ font-size:12px; color:#98a0b0; }
  .shoprow .price{ font-weight:800; color:#ffd54a; white-space:nowrap; }
  /* ================= 商店 / 背包 浮层 =================
     【为什么以前「商店点不动」】
     #shop 原来只是一个 <div id="shop" style="display:none"></div>，
     既没有 position:fixed，也没有 z-index。
     toggleShop() 把它设成 display:flex 时，它只是文档流里的一个普通块，
     高度由内容撑开、被画在页面最上方，并且被 #menu(100)/#hud(10)/#death(90)
     这些层完整盖住 —— 功能其实跑了，但屏幕上什么都看不见，
     表现就是「点了没反应」。
     现在给它完整的全屏遮罩 + 足够高的层级 + 可滚动内容区。 */
  #shop, #bag, #stash{ position:fixed; inset:0; z-index:210; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(4,6,11,.86); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); }
  #shop .box, #bag .box{ width:100%; max-width:560px; max-height:88vh;
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    scrollbar-width:thin; scrollbar-color:rgba(124,92,255,.7) rgba(255,255,255,.06); }
  /* 局内背包用的是仓库那套 .stk 结构，而不是 .box。
     .stk 里写了 height:100%，但 #bag 是 flex 居中的全屏遮罩，
     没有给子元素确定高度 -> height:100% 解析成 auto -> 整块塌成 0 高。
     表现就是「背包能打开，但格子一个都点不动」（其实根本没渲染出尺寸）。
     这里给 .stk 一个明确的高度来源。 */
  #bag .stk{ height:min(88vh, 620px); max-height:88vh; }
  /* 面板必须自己吃掉触摸/鼠标事件，否则底下的视角拖拽层（#viewLayer, z-index:25）
     和摇杆会抢走手势，表现为「点在格子上没反应」或「点一下视角还转了」。
     touch-action 也要显式放开，不然滚动和点击会被浏览器当成手势丢掉。 */
  #shop, #bag, #stash{ touch-action:auto; pointer-events:auto; }
  #bag .stkg, #stash .stkg{ cursor:pointer; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  #shop .box::-webkit-scrollbar, #bag .box::-webkit-scrollbar{ width:8px; }
  #shop .box::-webkit-scrollbar-thumb, #bag .box::-webkit-scrollbar-thumb{ background:rgba(124,92,255,.75); border-radius:4px; }
  #shop h1, #bag h1{ font-size:19px; margin-bottom:4px; }
  /* 顶部货币条 */
  .shophead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .shophead .cash{ font-weight:800; color:#ffd54a; font-size:15px; white-space:nowrap; }
  /* 分类标签页 */
  .tabs{ display:flex; gap:6px; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px;
    scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; padding:7px 13px; border-radius:9px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.07); border:1px solid transparent; color:#c8d0e0; cursor:pointer; }
  .tab.on{ background:rgba(124,92,255,.3); border-color:var(--accent); color:#fff; }
  /* 商品行：图标 + 名称/说明 + 价格 + 按钮 */
  .item{ display:flex; align-items:center; gap:11px; padding:10px 11px;
    border:1px solid rgba(255,255,255,.09); border-radius:11px; margin-top:7px;
    background:rgba(255,255,255,.028); }
  .item .ic{ width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:rgba(124,92,255,.16); color:var(--accent2); font-size:17px; }
  .item .info{ flex:1; min-width:0; }
  .item .n{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .item .d{ font-size:11.5px; color:#98a0b0; line-height:1.45; margin-top:2px; }
  .item .owned{ font-size:10.5px; font-weight:700; color:#7ee8a0;
    background:rgba(126,232,160,.14); border-radius:5px; padding:1px 6px; }
  .item .price{ font-weight:800; color:#ffd54a; white-space:nowrap; font-size:13px; }
  .item.locked{ opacity:.5; }
  /* 紧凑按钮 */
  .btn.sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; min-width:auto; white-space:nowrap; }
  /* 背包格子 */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; margin-top:10px; }
  .cell{ aspect-ratio:1; border-radius:11px; background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; padding:5px; position:relative; }
  .cell.eq{ border-color:rgba(124,92,255,.65); background:rgba(124,92,255,.14); }
  .cell .ci{ font-size:20px; line-height:1; }
  .cell .cn{ font-size:9.5px; color:#b8c0d0; text-align:center; line-height:1.2;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell .cq{ position:absolute; right:4px; bottom:3px; font-size:10px; font-weight:800; color:#ffd54a; }
  /* 【仓库双栏】左仓库 / 右出击背包，中间留一点缝 */
  .stashrow{ display:flex; gap:10px; align-items:flex-start; }
  .stashcol{ flex:1 1 0; min-width:0; }
  .stashcol .grid{ max-height:34vh; overflow-y:auto; }
  .cell.lk2{ opacity:.5; }

  /* ===== 仓库（按设计图：左装备栏 + 右格子区） ===== */
  .stk{ display:flex; gap:12px; width:100%; max-width:900px; height:100%;
        padding:10px; box-sizing:border-box; }
  /* --- 左栏 --- */
  .stkleft{ flex:0 0 38%; max-width:230px; display:flex; flex-direction:column;
            gap:8px; min-width:0; }
  .stkback{ align-self:flex-start; width:38px; height:34px; border-radius:9px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
            color:#dfe6f5; font-size:18px; line-height:1; cursor:pointer; }
  .stkback:active{ background:rgba(255,255,255,.2); }
  .stktitle{ font-size:26px; font-weight:800; letter-spacing:1px; color:#eef2ff;
             margin:2px 0 6px; }

  /* 装备槽 */
  .stkslots{ display:flex; flex-direction:column; gap:6px; }
  .stkslot{ display:flex; align-items:center; gap:8px; padding:8px 10px;
            border-radius:10px; background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.10);
            color:#9aa6bd; font-size:13px; cursor:pointer;
            transition:background .15s, border-color .15s; min-height:42px; }
  .stkslot.on{ background:rgba(124,92,255,.16); border-color:rgba(124,92,255,.5);
               color:#e8ecff; }
  .stkslot:active{ background:rgba(255,255,255,.14); }
  .stksi{ font-size:19px; width:24px; text-align:center; flex:0 0 auto; }
  .stksn{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
          white-space:nowrap; }
  .stkcap{ font-size:11px; color:#8fe0b0; font-weight:700; flex:0 0 auto; }

  /* 出击背包（点背包槽展开） */
  .stkpouch{ background:rgba(0,0,0,.28); border:1px solid rgba(124,92,255,.3);
             border-radius:10px; padding:8px; }
  .stkph{ font-size:12px; color:#b9c4da; margin-bottom:6px; }
  .stkpgrid{ display:flex; flex-wrap:wrap; gap:5px; }
  .stkpi{ position:relative; width:34px; height:34px; border-radius:7px;
          background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
          display:flex; align-items:center; justify-content:center; font-size:16px;
          cursor:pointer; }
  .stkpi:active{ background:rgba(255,120,120,.3); }
  .stkpi b{ position:absolute; right:1px; bottom:0; font-size:9px; color:#ffd54a;
            font-weight:800; text-shadow:0 1px 2px #000; }
  .stkempty2{ font-size:11px; color:#6b7688; padding:6px 2px; }

  /* --- 右栏：现金 + 仓库格子 --- */
  .stkright{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
             gap:8px; }
  .stkcash{ align-self:flex-end; font-size:15px; color:#ffd54a; font-weight:700;
            background:rgba(0,0,0,.3); padding:5px 12px; border-radius:9px;
            border:1px solid rgba(255,213,74,.28); }
  .stkgrid{ flex:1 1 auto; overflow-y:auto; display:grid;
            grid-template-columns:repeat(8,1fr); gap:4px; align-content:start;
            padding:2px; }
  .stkg{ aspect-ratio:1/1; border-radius:6px; background:rgba(255,255,255,.035);
         border:1px solid rgba(255,255,255,.07); position:relative;
         display:flex; align-items:center; justify-content:center;
         font-size:18px; cursor:pointer; transition:background .12s; }
  .stkg:hover{ background:rgba(255,255,255,.1); }
  .stkg:active{ background:rgba(124,92,255,.3); }
  .stkg.sel{ border-color:#7c5cff; background:rgba(124,92,255,.28); }
  .stkgi{ pointer-events:none; }
  .stkgq{ position:absolute; right:1px; bottom:0; font-size:9px; color:#ffd54a;
          font-weight:800; text-shadow:0 1px 2px #000; pointer-events:none; }
  /* 不可使用的物品（枪、弹药、装备）置灰但仍可见 */
  .stkg.dim{ opacity:.42; }
  .stkg.dim:hover{ background:rgba(255,255,255,.06); }

  /* 手机竖屏：右栏格子缩小成 6 列 */
  @media (max-width:520px){
    .stkgrid{ grid-template-columns:repeat(6,1fr); }
    .stkleft{ flex:0 0 42%; }
    .stktitle{ font-size:22px; }
    .stkslot{ font-size:12px; min-height:38px; padding:6px 8px; }
    .stksi{ font-size:17px; width:20px; }
  }
  .cell .lk{ position:absolute; top:4px; right:5px; font-size:9px; }
  #death{ position:fixed; inset:0; z-index:90; background:rgba(120,10,10,.6); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #death h2{ font-size:32px; text-shadow:0 2px 8px #000; }
  #fpscount{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:#778; }
  @media (max-width:768px){ .actbtn,.joyZone,.actZone{ } }
  /* ================= 横屏布局 =================
     横屏和竖屏的操作区完全不同：
     竖屏时屏幕窄高，摇杆和按钮分居左右两半，纵向空间够用；
     横屏时高度只有 360~420px，如果还照竖屏那样往上堆按钮，
     开镜/换弹/奔跑会直接叠在一起。
     这里改成「沿底边一字排开」的横屏专用布局，
     并把整体尺寸按屏幕高度缩放，保证小屏也不遮挡视野。 */
  @media (orientation:landscape){
    /* 摇杆挪到左下角偏内一点，避免贴住系统手势区 */
    #joyZone{ width:250px; height:250px; }
    #joyBase{ left:120px; top:calc(100% - 118px); width:132px; height:132px; }
    #joyStick{ width:62px; height:62px; }
    /* 右下按键：只调基准尺寸，位置全交给上面的 calc 公式，
       否则在这里重写 right/bottom 会把两列方阵重新打散、叠在一起。 */
    #actZone{ --bs:50px; --gap:7px; --big:74px; }
    #btnAim{ width:56px; height:56px; }
    #btnAim .ico{ width:26px; height:26px; }
    #btnInteract{ width:52px; height:52px; }
    /* 横屏视野更宽，准星和提示位置同步微调 */
    #prompt{ bottom:96px; }
    #toast{ bottom:104px; }
    #htip{ bottom:14px; font-size:10px; }
    /* 菜单卡片在横屏下更扁，避免超出屏幕需要滚动 */
    #menu{ padding:12px; }
    #menu .box{ max-width:640px; max-height:94vh; padding:16px 20px; }
    #menu h1{ font-size:20px; }
    /* 屏幕特别矮（如 360px 高的手机横屏）再压一档 */
    @media (max-height:400px){
      #actZone{ --bs:44px; --gap:6px; --big:66px; }
      #btnAim{ width:50px; height:50px; }
      #btnAim .ico{ width:23px; height:23px; }
      #btnInteract{ width:46px; height:46px; }
      .actbtn .ico{ width:20px; height:20px; }
      #joyZone{ width:210px; height:210px; }
      #joyBase{ left:96px; top:calc(100% - 96px); width:112px; height:112px; }
      #joyStick{ width:52px; height:52px; }
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div class="pill">🪙 <b id="money">0</b></div>
    <div class="pill" id="weaponPill">🔫 <span id="wpnName">手枪</span><span id="fireModeTag"></span></div>
    <div class="pill" id="ammoPill"><span id="ammo">12</span> / <span id="ammoReserve">36</span></div>
    <div class="pill" id="hpwrap">❤️ <span id="hpNum">100</span><div id="hpbar"><div id="hpfill"></div></div></div>
    <div class="pill" id="armorPill" style="display:none">🛡️ <b>0</b></div>
    <div class="pill">⏱ <span id="timer">00:00</span></div>
    <div class="pill" id="sndBtn" style="cursor:pointer">🔊 <span id="sndTxt">开</span></div>
    <div class="pill" id="bagBtn" style="cursor:pointer">🎒 <span>背包</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="hitmark"><span class="h1"></span><span class="h2"></span><span class="h3"></span><span class="h4"></span></div>
  <div id="msg"></div>
  <div id="prompt"></div>
<div id="toast"></div>
  <div id="htip">📱 右半屏拖动转视角 · 左摇杆移动 · 射击/跳/换弹/拾取在右下 · 靠近门按 E 开门</div>
  <div id="doorHint"></div>
</div>

<div id="grade"></div>
<div id="grain"></div>
<!-- 触摸控制层：必须在 #hud 之外，因为 #hud 是 pointer-events:none -->
<div id="viewLayer"></div>
<div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>
<div id="actZone">
  <div class="actbtn" id="btnFire" title="开火">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- Lucide crosshair：外圈 + 四向刻度线 -->
      <circle cx="12" cy="12" r="9"/>
      <line x1="20.5" x2="16.5" y1="12" y2="12"/>
      <line x1="7.5" x2="3.5" y1="12" y2="12"/>
      <line x1="12" x2="12" y1="7.5" y2="3.5"/>
      <line x1="12" x2="12" y1="20.5" y2="16.5"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="actbtn" id="btnAim" title="开镜">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- 开镜：四角准镜框（比三环更像「瞄准镜」，不再是同心圆传送门） -->
      <path d="M3 8V5a2 2 0 0 1 2-2h3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="actbtn" id="btnInspect" title="检视武器 (F)">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- 检视：一只眼睛，代表「看看手上这把」 -->
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </div>
  <div class="actbtn" id="btnJump" title="跳跃">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- Lucide move-up：向上箭头 -->
      <path d="M8 6L12 2L16 6"/>
      <path d="M12 2V17"/>
      <path d="M7 22h10"/>
    </svg>
  </div>
  <div class="actbtn" id="btnReload" title="换弹">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- Lucide rotate-ccw：逆时针回转箭头 -->
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
  </div>
  <div class="actbtn" id="btnProne" title="趴下">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- 趴下：一个人横向趴着的简笔（Lucide「身位」改画） -->
      <path d="M3 17h18"/>
      <circle cx="7" cy="13" r="2"/>
      <path d="M9 13h6a3 3 0 0 1 3 3"/>
