<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FPS 搜打撤 · 学校逃离 3D</title>
<style>
  :root{ --accent:#7c5cff; --accent2:#a88cff; --bg:#0b0e14; --panel:rgba(14,18,28,.92); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0e14; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e8f0; touch-action:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block;
      /* saltline 观感：提对比 + 压高光 + 微降饱和 + 轻微色偏。
         CSS filter 走 GPU 合成，几乎零开销，不需要 EffectComposer。 */
      filter: contrast(1.18) saturate(0.92) brightness(1.04) hue-rotate(-4deg);
    }
  /* 后处理叠加层：暗角 + 色调 + 颗粒（对应 saltline 的最终合成 pass） */
  #grade{ position:fixed; inset:0; z-index:4; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(120,170,255,.06) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 70%, rgba(255,190,120,.05) 100%);
    mix-blend-mode:normal;
  }
  /* 胶片颗粒：用 SVG 噪声做平铺，静态不闪，成本可忽略 */
  #grain{ position:fixed; inset:0; z-index:5; pointer-events:none; opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    background-size:120px 120px;
  }
  /* HUD */
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  /* 视角触摸层：覆盖全屏，位于摇杆/按钮之下 */
  #viewLayer{ position:fixed; right:0; top:0; bottom:0; width:50%; z-index:25; touch-action:none; background:transparent; }
  /* 右半屏负责转视角；左半屏只归摇杆。两者不重叠，
     否则摇杆铺满左半屏会把视角拖拽抢走（反之亦然）。 */
  /* 游戏内常驻操作提示（手机端小字条） */
  #htip{ position:absolute; left:50%; transform:translateX(-50%); bottom:58px; max-width:94vw; padding:5px 10px; border-radius:8px; background:rgba(10,14,22,.72); border:1px solid rgba(124,92,255,.35); color:#c8d0e0; font-size:10.5px; line-height:1.5; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .6s; }
  #htip.hide{ opacity:0; }
  /* 门交互提示：靠近门时出现在屏幕【中上方】。
     原来放在 bottom:96px 正中间，结果和右下的按键群、左边的摇杆
     在窄屏/横屏时叠在一起，看着像「开门键和原按键重叠」。
     现在抬到顶部 1/3 处，远离所有触摸控件，也不会挡住准星以外的视野。 */
  #doorHint{ display:none; position:fixed; left:50%; top:22%; transform:translateX(-50%);
    padding:9px 16px; border-radius:10px; background:rgba(10,14,22,.86);
    border:1px solid rgba(120,255,180,.55); color:#d8ffe8; font-size:14px; font-weight:600;
    backdrop-filter:blur(6px); cursor:pointer; z-index:70; white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.45); }
  #doorHint b{ display:inline-block; min-width:20px; padding:1px 6px; margin-right:6px;
    border-radius:5px; background:rgba(120,255,180,.22); border:1px solid rgba(120,255,180,.6);
    color:#9effc4; font-size:12px; text-align:center; }
  #doorHint:active{ background:rgba(120,255,180,.25); }
  #topbar{ position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; }
  .pill{ background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:7px 12px; font-size:13px; font-weight:600; backdrop-filter:blur(6px); }
  .pill b{ color:var(--accent2); }
  /* 射击模式徽标：全自动/半自动/栓动/泵动。
     auto 用青色高亮，跳单发的模式用橙色，一眼能看出手感差别。 */
  #fireModeTag{ margin-left:7px; font-size:10.5px; font-weight:700; letter-spacing:.04em;
    padding:1.5px 6px; border-radius:6px; background:rgba(255,255,255,.10);
    color:#9fb0c8; vertical-align:1px; }
  #fireModeTag.auto{ color:#0b1a14; background:#48d99a; }
  #fireModeTag.pump,#fireModeTag.bolt{ color:#2a1a05; background:#f0a35a; }
  #fireModeTag.semi{ color:#1a1226; background:#a78bfa; }
  #hpwrap{ flex:1; min-width:80px; }
  #hpbar{ height:8px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; margin-top:5px; }
  #hpfill{ height:100%; width:100%; background:linear-gradient(90deg,#48c774,#8ce6a0); border-radius:6px; transition:width .2s; }
  #hpfill.low{ background:linear-gradient(90deg,#e6533c,#ff8a70); }
  #crosshair{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after{ content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair::before{ left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  #hitmark{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; opacity:0; transition:opacity .1s; }
  #hitmark span{ position:absolute; width:12px; height:3px; background:#fff; border-radius:2px; }
  #hitmark .h1{ top:-1px; left:-1px; transform:rotate(45deg); } #hitmark .h2{ top:-1px; right:-1px; transform:rotate(-45deg); }
  #hitmark .h3{ bottom:-1px; left:-1px; transform:rotate(-45deg); } #hitmark .h4{ bottom:-1px; right:-1px; transform:rotate(45deg); }
  /* 消息 / 拾取提示 */
  #msg{ position:absolute; top:70px; left:50%; transform:translateX(-50%); text-align:center; font-size:15px; font-weight:600; text-shadow:0 1px 4px #000; pointer-events:none; opacity:0; transition:opacity .2s; }
  #prompt{ position:absolute; bottom:130px; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 16px; border-radius:10px; font-size:14px; border:1px solid var(--accent); opacity:0; transition:opacity .15s; }
  #toast{ position:absolute; bottom:140px; left:50%; transform:translateX(-50%); color:#7ee8a0; font-size:14px; font-weight:600; opacity:0; text-shadow:0 1px 3px #000; white-space:nowrap; }
  /* 加载/错误提示 */
  #loaderr{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff7a6a; font-size:15px; font-weight:700; text-align:center; z-index:200; background:rgba(20,8,8,.92); padding:16px 22px; border-radius:12px; border:1px solid #c2382a; display:none; max-width:80%; line-height:1.6; }
  /* 摇杆（移动端）
     【摇杆固定】原来 #joyZone 是 left:0 / width:50% / height:100% 的整块半屏，
      它会盖住左下角一大片，和右侧操作区在窄屏/横屏时直接重叠，
      视觉上就像「摇杆穿模到交互按钮里」。
       现在改成：摇杆区域 = 摇杆本体 + 一圈触摸余量的小方块，
       尺寸随 #joyBase 走，位置固定在左下角，绝不外溢到按钮区。 */
  #joyZone{ position:fixed; left:0; bottom:0; width:210px; height:210px; display:none; pointer-events:auto; z-index:60; touch-action:none; background:transparent; }
  #joyBase{ position:absolute; left:110px; top:calc(100% - 110px); width:110px; height:110px; margin:0; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(124,92,255,.5); box-shadow:0 0 0 6px rgba(124,92,255,.08); touch-action:none; transform:translate(-50%,-50%); pointer-events:none; }
  #joyStick{ position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.35); transform:translate(-50%,-50%); }
  /* 右侧操作区（移动端） */
  /* ===== 右侧按键布局（按用户示意图） =====
                                 瞄准
        摇杆              跳跃    开火
                         趴下     换弹

      换成两列三行的紧凑方阵：
        右列（贴屏幕右边缘）：开火（大）/ 换弹
        左列：跳跃（上）/ 趴下（下）
        瞄准单独浮在两列左上方

      以前是散落的 5 个按钮各自 right/bottom 定位，
      互相之间没有对齐关系，窄屏时会叠在一起。 */
  #actZone{ position:fixed; bottom:0; right:0; width:50%; height:55%;
            display:none; pointer-events:none; z-index:35; }

  /* 所有按钮统一基准尺寸，靠 CSS 变量缩放 */
  #actZone{ --bs:56px; --gap:8px; --big:84px; }

  #btnFire{ right:16px; bottom:16px;
            width:var(--big); height:var(--big);
            border-color:#ff5a4d; background:rgba(255,90,77,.18); font-size:15px; }
  #btnFire .ico{ width:36px; height:36px; }

  #btnReload{ right:16px; bottom:calc(16px + var(--big) + var(--gap));
              width:var(--bs); height:var(--bs); }
  #btnReload .ico{ width:26px; height:26px; }

  #btnJump{ right:calc(16px + var(--big) + var(--gap)); bottom:calc(16px + var(--bs) + var(--gap));
            width:var(--bs); height:var(--bs); }
  #btnJump .ico{ width:26px; height:26px; }

  #btnProne{ right:calc(16px + var(--big) + var(--gap)); bottom:16px;
             width:var(--bs); height:var(--bs); }
  #btnProne .ico{ width:26px; height:26px; }

  /* 瞄准：浮在跳跃/趴下这列的正上方，明确远离开火 */
  #btnAim{ right:calc(16px + var(--big) + var(--gap)); bottom:calc(16px + var(--big) + var(--gap)*2);
           width:64px; height:64px; border-color:#7c5cff; }
  #btnAim .ico{ width:28px; height:28px; }
  #btnAim.active{ background:rgba(124,92,255,.55); border-color:#7c5cff; }
  /* 检视按钮：放在开镜左边一格，不抢开火键的位置 */
  #btnInspect{ right:calc(16px + (var(--big) + var(--gap))*2); bottom:16px; }
  #btnInspect .ico{ width:24px; height:24px; }

  /* ==== GM 隐藏面板（主菜单连点 D 15 次）====
     浮在屏幕上层，可拖动、可收起。z-index 比遮罩(9999)略低但比
     菜单(100)/商店(210)都高，这样开着商店也能调出 GM 加钱。 */
  #gmPanel{ position:fixed; right:18px; bottom:18px; z-index:9000; width:236px;
    background:rgba(12,15,24,.96); border:1px solid rgba(124,92,255,.55);
    border-radius:14px; box-shadow:0 14px 44px rgba(0,0,0,.65),
    0 0 0 1px rgba(124,92,255,.18) inset; display:none;
    font-size:12.5px; color:#e8ecf5; backdrop-filter:blur(10px);
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #gmPanel.on{ display:block; }
  #gmPanel.min .gmb{ display:none; }
  #gmPanel.min{ width:auto; }
  /* 标题栏：拖动区 */
  #gmHead{ display:flex; align-items:center; gap:8px; padding:9px 11px;
    cursor:grab; border-bottom:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg,rgba(124,92,255,.26),rgba(124,92,255,.06));
    border-radius:13px 13px 0 0; }
  #gmPanel.min #gmHead{ border-bottom:none; border-radius:13px; }
  #gmHead:active{ cursor:grabbing; }
  #gmHead .t{ font-weight:800; letter-spacing:.06em; font-size:12px;
    color:#c9b8ff; flex:1; white-space:nowrap; }
  #gmHead .dot{ width:7px; height:7px; border-radius:50%; background:#48d99a;
    box-shadow:0 0 8px #48d99a; flex:none; }
  #gmMin{ flex:none; width:22px; height:22px; line-height:1; border:none;
    background:rgba(255,255,255,.12); color:#dfe5f0; border-radius:7px;
    font-size:14px; font-weight:700; cursor:pointer; padding:0; }
  #gmMin:active{ background:rgba(255,255,255,.26); }
  .gmb{ padding:11px; display:flex; flex-direction:column; gap:8px; }
  .gmrow{ display:flex; gap:6px; }
  .gmbtn{ flex:1; border:1px solid rgba(255,255,255,.14); border-radius:9px;
    background:rgba(255,255,255,.07); color:#e8ecf5; font-size:12px;
    font-weight:700; padding:9px 6px; cursor:pointer; transition:.12s; }
  .gmbtn:active{ transform:scale(.95); background:rgba(124,92,255,.5); }
  .gmbtn.money{ background:linear-gradient(180deg,rgba(255,213,74,.28),rgba(255,213,74,.10));
    border-color:rgba(255,213,74,.5); color:#ffe89a; }
  .gmbtn.money:active{ background:rgba(255,213,74,.55); }
  #gmCash{ font-size:19px; font-weight:800; color:#ffd54a; text-align:center;
    letter-spacing:.02em; padding:2px 0 4px; }
  #gmCash small{ font-size:10px; color:#8d97a8; font-weight:600;
    letter-spacing:.08em; display:block; margin-bottom:2px; }

  /* 交互（开门/拾取）挪到中间偏上，彻底离开右下按键群 */
  #btnInteract{ right:50%; transform:translateX(50%);
                bottom:calc(16px + var(--big) + var(--gap));
                width:58px; height:58px; }
  #btnInteract .ico{ width:26px; height:26px; }

  /* 奔跑：紧贴开火上方的斜角位，避免压住换弹 */
  #btnSprint{ right:calc(16px + var(--big) + var(--gap));
              bottom:calc(16px + var(--big) + var(--gap));
              width:52px; height:52px; }
  #btnSprint .ico{ width:22px; height:22px; }
  .actbtn{ position:absolute; width:64px; height:64px; border-radius:50%; background:var(--panel); border:2px solid rgba(255,255,255,.2); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:auto; touch-action:none; }
  .actbtn:active{ background:var(--accent); }
  /* 按钮图标（SVG，currentColor 跟随主题）
     【统一图标体系】全部改用 Lucide 官方图标（ISC 许可）的描边风格：
     统一 24×24 viewBox、stroke-width 2、round 端点，
     不再混用「部分实心填充 + 部分描边」的写法——
     以前开火是实心子弹、开镜是自绘十字、跳跃是火柴人，
     线宽和风格各不相同，看起来像拼凑的。
     描边图标在深色半透明按钮上辨识度更高，也更像正经射击手游的 UI。 */
  .actbtn .ico{ width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  #btnFire .ico{ width:38px; height:38px; }
  #btnJump .ico{ width:30px; height:30px; }
  #btnAim.active{ background:rgba(124,92,255,.55); border-color:#7c5cff; }
  /* 开火键的配色单独留下：这只是颜色和字号，不涉及 right/bottom 定位。
     定位仍然全部交给上面那套 calc 公式。 */
  #btnFire{ border-color:#ff5a4d; background:rgba(255,90,77,.18); font-size:15px; }
/* 【已删除的旧定位】这里原本还有一套
       #btnFire{right:26px;bottom:26px;...}
       #btnAim{right:118px;bottom:96px;...}
       #btnJump{right:126px;bottom:22px;}
       #btnReload{right:30px;bottom:126px;}
       #btnInteract{right:204px;bottom:34px;...}
       #btnSprint{right:196px;bottom:110px;...}
     选择器权重和上面那套 calc 公式完全相同，而它们在文件里更靠后，
     于是后写的这一套直接生效 —— 上面精心算好的两列方阵被整个推翻，
     按钮又散回原来那种「各按各的像素值」的摆法，窄屏就叠在一起。
     这是「按键重叠」反复出现、改了没用 的根本原因。
     ​现在统一由上面的 CSS 变量 + calc 决定位置，这里不再重复定义。 */

  /* ===== 底部中间：武器切换条 =====
     按用户要求「直接在下面的中间」。
     三个格子：主武器 / 手枪 / 副武器。
     空槽变暗不可点，当前手持那个高亮。
     位置钉在屏幕底部正中，夹在左摇杆和右按键群之间，
     所以宽度要收紧一点（最多 3 格 × 58px + 间距），
     并且在窄屏上自动缩小，避免和摇杆/开火键撞上。 */
  #wpnBar{ position:fixed; left:50%; transform:translateX(-50%);
           bottom:14px; display:flex; gap:6px; z-index:36;
           pointer-events:auto; }
  #wpnBar .ws{
    width:58px; height:52px; border-radius:11px;
    background:rgba(14,18,28,.86); border:2px solid rgba(255,255,255,.16);
    color:#cfd6e6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    cursor:pointer; touch-action:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .12s, background .12s, transform .08s;
  }
  #wpnBar .ws .wi{ font-size:19px; line-height:1; }
  #wpnBar .ws .wn{ font-size:9.5px; line-height:1; letter-spacing:.02em;
                   opacity:.8; white-space:nowrap; max-width:54px;
                   overflow:hidden; text-overflow:ellipsis; }
  /* 当前手持 */
  #wpnBar .ws.on{ border-color:#7c5cff; background:rgba(124,92,255,.3);
                  color:#fff; box-shadow:0 0 12px rgba(124,92,255,.45); }
  #wpnBar .ws.on .wn{ opacity:1; }
  /* 空槽：不能点，明显变暗 */
  #wpnBar .ws.empty{ opacity:.34; cursor:default; border-style:dashed; }
  #wpnBar .ws:active{ transform:scale(.94); }
  #wpnBar .ws.empty:active{ transform:none; }

  /* 窄屏：底部中间夹在摇杆和按键之间，宽度必须收一收，
     否则 3×58=174px 加上间距会和开火键撞上。 */
  @media (max-width:520px){
    #wpnBar{ bottom:10px; gap:4px; }
    #wpnBar .ws{ width:46px; height:42px; border-radius:9px; }
    #wpnBar .ws .wi{ font-size:15px; }
    #wpnBar .ws .wn{ font-size:8px; max-width:42px; }
  }
  @media (max-width:380px){
    #wpnBar .ws{ width:38px; height:36px; }
    #wpnBar .ws .wn{ font-size:7px; max-width:34px; }
  }

  /* ============ 横屏强制遮罩 ============
   竖屏时盖住整个游戏，要求用户转屏。
   z-index 要比所有东西都高（商店 210、背包 210、死亡界面）
   否则会出现「遮罩下面还能点到按钮」。 */
#orientMask{
  position:fixed; inset:0; z-index:9999;
  display:none;                /* 由 orientRefresh() 改成 flex */
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #171c2b 0%, #0b0e14 70%);
  touch-action:none;
}
#orientMask .omBox{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:28px 26px; max-width:88vw; text-align:center;
}
#orientMask .omIcon{
  font-size:54px; line-height:1;
  animation:omSpin 2.4s ease-in-out infinite;
}
/* 手机图标左右摇一下，比箭头更直观地暗示「转过来」 */
@keyframes omSpin{
  0%,45%   { transform:rotate(0deg); }
  55%,100% { transform:rotate(90deg); }
}
#orientMask .omTitle{
  font-size:20px; font-weight:800; color:#e8e8f0; letter-spacing:.5px;
}
#orientMask .omDesc{
  font-size:13px; line-height:1.7; color:#9aa6bd; max-width:420px;
}
#orientMask .omBtn{
  margin-top:4px; padding:11px 26px; border-radius:11px; cursor:pointer;
  border:2px solid var(--accent); background:rgba(124,92,255,.22);
  color:#cbbcff; font-size:14px; font-weight:700; font-family:inherit;
}
#orientMask .omBtn:active{ transform:scale(.96); }

/* ============ 语言切换按钮 ============
   复用主菜单 .btn.ghost.small 的外观，这里只补一点宽度保证
   「🌐 English」和「🌐 中文」切换时按钮不会尺寸跳动。 */
#langBtn{ min-width:96px; }

/* 英文文案普遍比中文长 30% 左右，主菜单 .box 高度会溢出。
   只对英文收紧行距与字号，中文保持原样不受影响。 */
html[data-lang="en"] #menu .box{ line-height:1.5; }
html[data-lang="en"] #menu h1{ font-size:clamp(18px,3.2vw,26px); }
html[data-lang="en"] #menu p.sub{ font-size:12px; }
html[data-lang="en"] #menu .kk span{ font-size:11px; }
html[data-lang="en"] #menu .btn{ font-size:12.5px; }
html[data-lang="en"] .keysbox-note{ font-size:10.5px; }

/* 英文下 HUD 的「背包」比「Backpack」短，pill 会被撑宽。
   给一个上限并省略，避免挤掉右侧的弹药格。 */
html[data-lang="en"] #bagBtn span{
  display:inline-block; max-width:58px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom;
}

/* 菜单 */
  #menu{ position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.92); display:flex; align-items:center; justify-content:center; padding:20px; }
  #menu .box{ width:100%; max-width:520px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(124,92,255,.7) rgba(255,255,255,.06); background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:24px; }
  #menu .box::-webkit-scrollbar{ width:8px; }
  #menu .box::-webkit-scrollbar-track{ background:rgba(255,255,255,.06); border-radius:4px; }
  #menu .box::-webkit-scrollbar-thumb{ background:rgba(124,92,255,.75); border-radius:4px; }
  .keysbox{ margin:4px 0 14px; padding:14px; border-radius:12px; background:rgba(124,92,255,.13); border:1px solid rgba(124,92,255,.42); box-shadow:0 0 0 1px rgba(124,92,255,.1) inset; }
  .keysbox-t{ font-size:12.5px; letter-spacing:.08em; color:#b9a6ff; margin-bottom:10px; font-weight:700; }
  .keysgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .kk{ display:flex; align-items:center; gap:5px; font-size:12px; color:#c8d0e0; }
  .kk kbd{ display:inline-block; min-width:20px; padding:2px 6px; font:600 11px/1.4 ui-monospace,monospace; text-align:center; color:#e8ecf5; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-bottom-width:2px; border-radius:5px; }
  /* 「D」这个按键图标可以点：手机上没有键盘，靠它当 GM 彩蛋入口。
     -webkit-tap-highlight-color 去掉安卓点击时那层灰块；
     touch-action:none 防止连点时触发页面缩放。 */
  #gmKeyD{ cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; transition:transform .08s, background .12s; }
  #gmKeyD:active{ transform:translateY(1px); background:rgba(124,92,255,.45); }
  .kk span{ color:#98a0b0; }
  .keysbox-note{ margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.09); font-size:11.5px; color:#8b93a6; line-height:1.6; }
  h1{ font-size:22px; margin-bottom:4px; } h1 span{ color:var(--accent2); }
  .sub{ color:#98a0b0; font-size:13px; margin-bottom:18px; }
  .row{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .btn{ pointer-events:auto; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:active{ filter:brightness(1.2); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,.2); }
  .btn.danger{ background:#c2382a; }
  .btn.small{ padding:8px 12px; font-size:13px; }
  .stat{ background:rgba(255,255,255,.05); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; }
  .stat .k{ font-size:11px; color:#98a0b0; } .stat .v{ font-size:18px; font-weight:800; color:var(--accent2); }
  .shoprow{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid rgba(255,255,255,.1); border-radius:10px; margin-top:8px; background:rgba(255,255,255,.03); }
  .shoprow .info{ flex:1; } .shoprow .n{ font-weight:700; font-size:14px; } .shoprow .d{ font-size:12px; color:#98a0b0; }
  .shoprow .price{ font-weight:800; color:#ffd54a; white-space:nowrap; }
  /* ================= 商店 / 背包 浮层 =================
     【为什么以前「商店点不动」】
     #shop 原来只是一个 <div id="shop" style="display:none"></div>，
     既没有 position:fixed，也没有 z-index。
     toggleShop() 把它设成 display:flex 时，它只是文档流里的一个普通块，
     高度由内容撑开、被画在页面最上方，并且被 #menu(100)/#hud(10)/#death(90)
     这些层完整盖住 —— 功能其实跑了，但屏幕上什么都看不见，
     表现就是「点了没反应」。
     现在给它完整的全屏遮罩 + 足够高的层级 + 可滚动内容区。 */
  #shop, #bag, #stash{ position:fixed; inset:0; z-index:210; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(4,6,11,.86); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); }
  #shop .box, #bag .box{ width:100%; max-width:560px; max-height:88vh;
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    scrollbar-width:thin; scrollbar-color:rgba(124,92,255,.7) rgba(255,255,255,.06); }
  /* 局内背包用的是仓库那套 .stk 结构，而不是 .box。
     .stk 里写了 height:100%，但 #bag 是 flex 居中的全屏遮罩，
     没有给子元素确定高度 -> height:100% 解析成 auto -> 整块塌成 0 高。
     表现就是「背包能打开，但格子一个都点不动」（其实根本没渲染出尺寸）。
     这里给 .stk 一个明确的高度来源。 */
  #bag .stk{ height:min(88vh, 620px); max-height:88vh; }
  /* 面板必须自己吃掉触摸/鼠标事件，否则底下的视角拖拽层（#viewLayer, z-index:25）
     和摇杆会抢走手势，表现为「点在格子上没反应」或「点一下视角还转了」。
     touch-action 也要显式放开，不然滚动和点击会被浏览器当成手势丢掉。 */
  #shop, #bag, #stash{ touch-action:auto; pointer-events:auto; }
  #bag .stkg, #stash .stkg{ cursor:pointer; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  #shop .box::-webkit-scrollbar, #bag .box::-webkit-scrollbar{ width:8px; }
  #shop .box::-webkit-scrollbar-thumb, #bag .box::-webkit-scrollbar-thumb{ background:rgba(124,92,255,.75); border-radius:4px; }
  #shop h1, #bag h1{ font-size:19px; margin-bottom:4px; }
  /* 顶部货币条 */
  .shophead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .shophead .cash{ font-weight:800; color:#ffd54a; font-size:15px; white-space:nowrap; }
  /* 分类标签页 */
  .tabs{ display:flex; gap:6px; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px;
    scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; padding:7px 13px; border-radius:9px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.07); border:1px solid transparent; color:#c8d0e0; cursor:pointer; }
  .tab.on{ background:rgba(124,92,255,.3); border-color:var(--accent); color:#fff; }
  /* 商品行：图标 + 名称/说明 + 价格 + 按钮 */
  .item{ display:flex; align-items:center; gap:11px; padding:10px 11px;
    border:1px solid rgba(255,255,255,.09); border-radius:11px; margin-top:7px;
    background:rgba(255,255,255,.028); }
  .item .ic{ width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:rgba(124,92,255,.16); color:var(--accent2); font-size:17px; }
  .item .info{ flex:1; min-width:0; }
  .item .n{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .item .d{ font-size:11.5px; color:#98a0b0; line-height:1.45; margin-top:2px; }
  .item .owned{ font-size:10.5px; font-weight:700; color:#7ee8a0;
    background:rgba(126,232,160,.14); border-radius:5px; padding:1px 6px; }
  .item .price{ font-weight:800; color:#ffd54a; white-space:nowrap; font-size:13px; }
  .item.locked{ opacity:.5; }
  /* 紧凑按钮 */
  .btn.sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; min-width:auto; white-space:nowrap; }
  /* 背包格子 */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; margin-top:10px; }
  .cell{ aspect-ratio:1; border-radius:11px; background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; padding:5px; position:relative; }
  .cell.eq{ border-color:rgba(124,92,255,.65); background:rgba(124,92,255,.14); }
  .cell .ci{ font-size:20px; line-height:1; }
  .cell .cn{ font-size:9.5px; color:#b8c0d0; text-align:center; line-height:1.2;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell .cq{ position:absolute; right:4px; bottom:3px; font-size:10px; font-weight:800; color:#ffd54a; }
  /* 【仓库双栏】左仓库 / 右出击背包，中间留一点缝 */
  .stashrow{ display:flex; gap:10px; align-items:flex-start; }
  .stashcol{ flex:1 1 0; min-width:0; }
  .stashcol .grid{ max-height:34vh; overflow-y:auto; }
  .cell.lk2{ opacity:.5; }

  /* ===== 仓库（按设计图：左装备栏 + 右格子区） ===== */
  .stk{ display:flex; gap:12px; width:100%; max-width:900px; height:100%;
        padding:10px; box-sizing:border-box; }
  /* --- 左栏 --- */
  .stkleft{ flex:0 0 38%; max-width:230px; display:flex; flex-direction:column;
            gap:8px; min-width:0; }
  .stkback{ align-self:flex-start; width:38px; height:34px; border-radius:9px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
            color:#dfe6f5; font-size:18px; line-height:1; cursor:pointer; }
  .stkback:active{ background:rgba(255,255,255,.2); }
  .stktitle{ font-size:26px; font-weight:800; letter-spacing:1px; color:#eef2ff;
             margin:2px 0 6px; }

  /* 装备槽 */
  .stkslots{ display:flex; flex-direction:column; gap:6px; }
  .stkslot{ display:flex; align-items:center; gap:8px; padding:8px 10px;
            border-radius:10px; background:rgba(255,255,255,.045);
            border:1px solid rgba(255,255,255,.10);
            color:#9aa6bd; font-size:13px; cursor:pointer;
            transition:background .15s, border-color .15s; min-height:42px; }
  .stkslot.on{ background:rgba(124,92,255,.16); border-color:rgba(124,92,255,.5);
               color:#e8ecff; }
  .stkslot:active{ background:rgba(255,255,255,.14); }
  .stksi{ font-size:19px; width:24px; text-align:center; flex:0 0 auto; }
  .stksn{ flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
          white-space:nowrap; }
  .stkcap{ font-size:11px; color:#8fe0b0; font-weight:700; flex:0 0 auto; }

  /* 出击背包（点背包槽展开） */
  .stkpouch{ background:rgba(0,0,0,.28); border:1px solid rgba(124,92,255,.3);
             border-radius:10px; padding:8px; }
  .stkph{ font-size:12px; color:#b9c4da; margin-bottom:6px; }
  .stkpgrid{ display:flex; flex-wrap:wrap; gap:5px; }
  .stkpi{ position:relative; width:34px; height:34px; border-radius:7px;
          background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
          display:flex; align-items:center; justify-content:center; font-size:16px;
          cursor:pointer; }
  .stkpi:active{ background:rgba(255,120,120,.3); }
  .stkpi b{ position:absolute; right:1px; bottom:0; font-size:9px; color:#ffd54a;
            font-weight:800; text-shadow:0 1px 2px #000; }
  .stkempty2{ font-size:11px; color:#6b7688; padding:6px 2px; }

  /* --- 右栏：现金 + 仓库格子 --- */
  .stkright{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
             gap:8px; }
  .stkcash{ align-self:flex-end; font-size:15px; color:#ffd54a; font-weight:700;
            background:rgba(0,0,0,.3); padding:5px 12px; border-radius:9px;
            border:1px solid rgba(255,213,74,.28); }
  .stkgrid{ flex:1 1 auto; overflow-y:auto; display:grid;
            grid-template-columns:repeat(8,1fr); gap:4px; align-content:start;
            padding:2px; }
  .stkg{ aspect-ratio:1/1; border-radius:6px; background:rgba(255,255,255,.035);
         border:1px solid rgba(255,255,255,.07); position:relative;
         display:flex; align-items:center; justify-content:center;
         font-size:18px; cursor:pointer; transition:background .12s; }
  .stkg:hover{ background:rgba(255,255,255,.1); }
  .stkg:active{ background:rgba(124,92,255,.3); }
  .stkg.sel{ border-color:#7c5cff; background:rgba(124,92,255,.28); }
  .stkgi{ pointer-events:none; }
  .stkgq{ position:absolute; right:1px; bottom:0; font-size:9px; color:#ffd54a;
          font-weight:800; text-shadow:0 1px 2px #000; pointer-events:none; }
  /* 不可使用的物品（枪、弹药、装备）置灰但仍可见 */
  .stkg.dim{ opacity:.42; }
  .stkg.dim:hover{ background:rgba(255,255,255,.06); }

  /* 手机竖屏：右栏格子缩小成 6 列 */
  @media (max-width:520px){
    .stkgrid{ grid-template-columns:repeat(6,1fr); }
    .stkleft{ flex:0 0 42%; }
    .stktitle{ font-size:22px; }
    .stkslot{ font-size:12px; min-height:38px; padding:6px 8px; }
    .stksi{ font-size:17px; width:20px; }
  }
  .cell .lk{ position:absolute; top:4px; right:5px; font-size:9px; }
  #death{ position:fixed; inset:0; z-index:90; background:rgba(120,10,10,.6); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #death h2{ font-size:32px; text-shadow:0 2px 8px #000; }
  #fpscount{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:#778; }
  @media (max-width:768px){ .actbtn,.joyZone,.actZone{ } }
  /* ================= 横屏布局 =================
     横屏和竖屏的操作区完全不同：
     竖屏时屏幕窄高，摇杆和按钮分居左右两半，纵向空间够用；
     横屏时高度只有 360~420px，如果还照竖屏那样往上堆按钮，
     开镜/换弹/奔跑会直接叠在一起。
     这里改成「沿底边一字排开」的横屏专用布局，
     并把整体尺寸按屏幕高度缩放，保证小屏也不遮挡视野。 */
  @media (orientation:landscape){
    /* 摇杆挪到左下角偏内一点，避免贴住系统手势区 */
    #joyZone{ width:250px; height:250px; }
    #joyBase{ left:120px; top:calc(100% - 118px); width:132px; height:132px; }
    #joyStick{ width:62px; height:62px; }
    /* 右下按键：只调基准尺寸，位置全交给上面的 calc 公式，
       否则在这里重写 right/bottom 会把两列方阵重新打散、叠在一起。 */
    #actZone{ --bs:50px; --gap:7px; --big:74px; }
    #btnAim{ width:56px; height:56px; }
    #btnAim .ico{ width:26px; height:26px; }
    #btnInteract{ width:52px; height:52px; }
    /* 横屏视野更宽，准星和提示位置同步微调 */
    #prompt{ bottom:96px; }
    #toast{ bottom:104px; }
    #htip{ bottom:14px; font-size:10px; }
    /* 菜单卡片在横屏下更扁，避免超出屏幕需要滚动 */
    #menu{ padding:12px; }
    #menu .box{ max-width:640px; max-height:94vh; padding:16px 20px; }
    #menu h1{ font-size:20px; }
    /* 屏幕特别矮（如 360px 高的手机横屏）再压一档 */
    @media (max-height:400px){
      #actZone{ --bs:44px; --gap:6px; --big:66px; }
      #btnAim{ width:50px; height:50px; }
      #btnAim .ico{ width:23px; height:23px; }
      #btnInteract{ width:46px; height:46px; }
      .actbtn .ico{ width:20px; height:20px; }
      #joyZone{ width:210px; height:210px; }
      #joyBase{ left:96px; top:calc(100% - 96px); width:112px; height:112px; }
      #joyStick{ width:52px; height:52px; }
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div class="pill">🪙 <b id="money">0</b></div>
    <div class="pill" id="weaponPill">🔫 <span id="wpnName">手枪</span><span id="fireModeTag"></span></div>
    <div class="pill" id="ammoPill"><span id="ammo">12</span> / <span id="ammoReserve">36</span></div>
    <div class="pill" id="hpwrap">❤️ <span id="hpNum">100</span><div id="hpbar"><div id="hpfill"></div></div></div>
    <div class="pill" id="armorPill" style="display:none">🛡️ <b>0</b></div>
    <div class="pill">⏱ <span id="timer">00:00</span></div>
    <div class="pill" id="sndBtn" style="cursor:pointer">🔊 <span id="sndTxt">开</span></div>
    <div class="pill" id="bagBtn" style="cursor:pointer">🎒 <span>背包</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="hitmark"><span class="h1"></span><span class="h2"></span><span class="h3"></span><span class="h4"></span></div>
  <div id="msg"></div>
  <div id="prompt"></div>
<div id="toast"></div>
  <div id="htip">📱 右半屏拖动转视角 · 左摇杆移动 · 射击/跳/换弹/拾取在右下 · 靠近门按 E 开门</div>
  <div id="doorHint"></div>
</div>

<div id="grade"></div>
<div id="grain"></div>
<!-- 触摸控制层：必须在 #hud 之外，因为 #hud 是 pointer-events:none -->
<div id="viewLayer"></div>
<div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>
<div id="actZone">
  <div class="actbtn" id="btnFire" title="开火">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- Lucide crosshair：外圈 + 四向刻度线 -->
      <circle cx="12" cy="12" r="9"/>
      <line x1="20.5" x2="16.5" y1="12" y2="12"/>
      <line x1="7.5" x2="3.5" y1="12" y2="12"/>
      <line x1="12" x2="12" y1="7.5" y2="3.5"/>
      <line x1="12" x2="12" y1="20.5" y2="16.5"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="actbtn" id="btnAim" title="开镜">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- 开镜：四角准镜框（比三环更像「瞄准镜」，不再是同心圆传送门） -->
      <path d="M3 8V5a2 2 0 0 1 2-2h3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="actbtn" id="btnInspect" title="检视武器 (F)">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- 检视：一只眼睛，代表「看看手上这把」 -->
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </div>
  <div class="actbtn" id="btnJump" title="跳跃">
    <svg viewBox="0 0 24 24" class="ico">
      <!-- Lucide move-up：向上箭头 -->
      <path d="M8 6L12 2L16 6"/>
      <path d="M12 2V17"/>
      <path d="M7 22h10"/>
    </svg>
  </div>
  <div class="actbtn" id="btnReload" title="换弹">

/* 把 {0} {1} 换掉。只在 T() 内部用。 */
function i18nFormat(str, args){
  if(!args || !args.length) return str;
  return String(str).replace(/\{(\d+)\}/g, function(m, i){
    const v = args[+i];
    return (v === undefined || v === null) ? m : String(v);
  });
}

/* 核心翻译函数：中文原串 -> 当前语言 */
function T(str, a, b, c){
  if(str == null) return str;
  let out = str;
  if(I18N_LANG === 'en'){
    const hit = I18N_EN[str];
    if(hit !== undefined) out = hit;
  }
  return i18nFormat(out, arguments.length > 1 ? Array.prototype.slice.call(arguments, 1) : null);
}

/* 按当前语言二选一，用于「中文文案 / 英文文案」都需要保留原样的场合 */
function TL(zh, en){ return I18N_LANG === 'en' ? en : zh; }

/* 读取持久化的语言 */
function i18nLoad(){
  let v = null;
  try{ v = localStorage.getItem(I18N_STORE_KEY); }catch(e){ v = null; }
  if(v && I18N_LANGS.indexOf(v) >= 0) I18N_LANG = v;
  else I18N_LANG = 'zh';
  return I18N_LANG;
}

/* 保存语言 */
function i18nSave(){
  try{ localStorage.setItem(I18N_STORE_KEY, I18N_LANG); }catch(e){}
}

/* 应用 <html lang> 与 <html data-lang>，CSS 可据此调字号 */
function i18nApplyDoc(){
  if(typeof document === 'undefined' || !document.documentElement) return;
  const el = document.documentElement;
  el.setAttribute('data-lang', I18N_LANG);
  el.setAttribute('lang', I18N_LANG === 'en' ? 'en' : 'zh-CN');
}

/* 切换语言。返回是否真的变了。
   rebuild 由各版自己传进来（重绘界面），这样 core 不需要知道界面细节。 */
function i18nSetLang(lang, rebuild){
  if(I18N_LANGS.indexOf(lang) < 0) return false;
  if(lang === I18N_LANG) return false;
  I18N_LANG = lang;
  i18nSave();
  i18nApplyDoc();
  if(typeof rebuild === 'function'){ try{ rebuild(); }catch(e){} }
  return true;
}

/* 在两种语言间来回切 */
function i18nToggle(rebuild){
  return i18nSetLang(I18N_LANG === 'zh' ? 'en' : 'zh', rebuild);
}

/* 扫描 DOM 里带 data-i18n 的元素并替换文本。
   属性用法：data-i18n 填中文原串即可；
   也可以填 data-i18n-ph 换 placeholder、data-i18n-title 换 title。 */
function i18nApplyDOM(root){
  if(typeof document === 'undefined') return;
  const scope = root || document;
  const nodes = scope.querySelectorAll ? scope.querySelectorAll('[data-i18n]') : [];
  for(let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    n.textContent = T(n.getAttribute('data-i18n'));
  }
  const phs = scope.querySelectorAll ? scope.querySelectorAll('[data-i18n-ph]') : [];
  for(let i = 0; i < phs.length; i++){
    const n = phs[i];
    n.setAttribute('placeholder', T(n.getAttribute('data-i18n-ph')));
  }
  const tts = scope.querySelectorAll ? scope.querySelectorAll('[data-i18n-title]') : [];
  for(let i = 0; i < tts.length; i++){
    const n = tts[i];
    n.setAttribute('title', T(n.getAttribute('data-i18n-title')));
  }
}

/* 生成一个语言切换按钮并挂到指定容器上。
   两版共用同一套外观，颜色跟各自主题走（用 CSS 变量）。 */
function i18nMountToggle(parent, rebuild, cls){
  if(typeof document === 'undefined' || !parent) return null;
  let btn = document.getElementById('langBtn');
  if(!btn){
    btn = document.createElement('button');
    btn.id = 'langBtn';
    btn.className = cls || 'langBtn';
    btn.type = 'button';
    parent.appendChild(btn);
  }
  const paint = function(){
    btn.textContent = I18N_LANG === 'zh' ? '🌐 English' : '🌐 中文';
    btn.setAttribute('title', T('切换语言'));
    btn.setAttribute('aria-label', T('切换语言'));
  };
  paint();
  btn.onclick = function(ev){
    if(ev) ev.stopPropagation();
    i18nToggle(function(){ rebuild && rebuild(); paint(); });
  };
  return btn;
}

/* ============ b_world.js：场景初始化 + 学校地图（还原现实） ============ */
const $=id=>document.getElementById(id);
let renderer,scene,camera,clock,ready=false;
const colliders=[],shootables=[],enemies=[],loots=[];
let exfil=null;

/* 造实体：加入场景 + 作为碰撞体 */
function solid(m){ m.castShadow=m.receiveShadow=true; scene.add(m); colliders.push(m); return m; }

/* 箱子（墙体/建筑块）。noCol=true 时只显示不碰撞（如窗户玻璃） */
function box(w,h,d,c,x,y,z,noCol){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.85}));
  m.position.set(x,y,z);
  if(noCol){ scene.add(m); return m; }
  return solid(m);
}
/* 圆柱（路灯/树/柱子） */
function cyl(rt,rb,h,c,x,y,z,noCol){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,12),new THREE.MeshStandardMaterial({color:c,roughness:.8}));
  m.position.set(x,y,z);
  if(noCol){ scene.add(m); return m; }
  return solid(m);
}
/* 平面装饰（球场标线、跑道等，贴地面不碰撞） */
let decoIndex=0;
function groundDeco(w,d,c,x,z,opacity){
  /* 【贴图错位的根因之一】
     这些装饰面原来全都压在 y=0.02，彼此之间几乎零间距，
     而地面本体在 y=0。两台设备/不同分辨率下深度缓冲精度不同，
     0.02 这个间距不够用，就会出现闪烁、条纹、错位（z-fighting）。
     处理方式双保险：
       1) 每个装饰面按序号抬一点高度，保证彼此不共面；
       2) 材质开 polygonOffset，让渲染器优先画它、把共面冲突推给地面。 */
  decoIndex++;
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    new THREE.MeshStandardMaterial({
      color:c, roughness:1,
      transparent:opacity<1, opacity:opacity!==undefined?opacity:1,
      polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2,
      depthWrite:opacity>=1,
    })
  );
  m.rotation.x=-Math.PI/2;
  m.position.set(x, 0.06+decoIndex*0.002, z);
  m.receiveShadow=true; scene.add(m); return m;
}

/* 渲染器 + 场景 + 光照 + 相机 */
function init(){
  try{
    renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
  }catch(e){
    showErr('WebGL 初始化失败：'+e.message+'。请检查浏览器是否支持 WebGL。');
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  /* 色调映射：这是 saltline 「像照片」最核心的一步。
     不做映射时，高光一律被硬裁到纯白，画面显平、发灰、像塑料；
     ACES 会做胶片式的柔和肩部压缩，亮部保留层次。 */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.autoUpdate = true;
  renderer.shadowMap.needsUpdate = true;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8fb7d9);           // 天空淡蓝
  scene.fog=new THREE.Fog(0x8fb7d9,40,180);

  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,600);
  // 相机初始位置 = 玩家出生点，避免初入黑/空视角
  camera.position.set(0,1.7,8);
  camera.rotation.set(0,0,0);

  clock=new THREE.Clock();

  /* 光照 */
  /* 光照：saltline 是强烈日光 + 明显阴影，不是均匀平光。
     半球光压低（负责暗部补色），主光加强并产生硬阴影，对比就出来了。 */
  scene.add(new THREE.HemisphereLight(0xcfe4ff,0x6b5f47,0.55));
  scene.add(new THREE.AmbientLight(0xffffff,0.16));   // 极轻的环境底，避免暗部死黑
  const sun=new THREE.DirectionalLight(0xfff4e0,2.6);
  sun.position.set(45,60,25);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  /* 【阴影精度 & 贴图错位】
     原来 shadow.camera 覆盖 180×180 米（left/right/top/bottom 都是 ±90），
     却只给 2048×2048 的贴图 —— 每个像素要管 8.8 厘米，
     墙根、台阶边缘会出现明显的锯齿、条纹和「影子错位」。
     校园主体范围约 ±50 米，把相机收到 ±60 就够用，
     每像素精度提升到约 5.9cm，几乎翻倍；
     再把贴图提到 3072 并加大 normalBias（沿法线偏移，不产生 peter-panning）。 */
  sun.shadow.mapSize.set(3072,3072);
  sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
  sun.shadow.camera.top=60;  sun.shadow.camera.bottom=-60;
  sun.shadow.camera.far=200; sun.shadow.camera.near=1;
  sun.shadow.bias=-0.0002;
  sun.shadow.normalBias=0.045;
  scene.add(sun);

  /* 大地：整个校园地面 */
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x6c8f5e,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  buildSchool();
  /* 【场景扩展】先开门洞再建操场：
     carve*Door 要把原来的整块外墙拆成两段，必须在 buildSchool 之后立刻执行，
     否则后来者只会叠加出一面又一面墙。 */
  carveMainDoor();
  carveEastDoor();
  carveWestDoor();
  carveAdminDoor();
  buildSportsZone();
  setupWorld();
  ready=true;
}

/* ============ 学校建筑（还原现实校园） ============ */
function buildSchool(){
  /* ---- 主教学楼（南侧，z=-22）60m 宽 × 4 层 ---- */
  box(60,14,16,0xd9c6a3,0,7,-22);                 // 主楼体
  /* 主楼屋顶做成「两边收窄」的样子：
     主楼本体 60 米宽（x 从 -30 到 30），而东西楼内边缘在 x=±26，
     如果屋顶也做满 60 米，它会在 y=14.35 的高度悬在东西楼上方
     —— 两个屋顶互相插在一起，从远处看就是「楼顶打架」。
     这里收窄到 50 米（x 从 -25 到 25），刚好落在东西楼之间。 */
  box(50,.7,16,0x6b5a45,0,14.35,-22);            // 平屋顶
  // 正面门窗（朝南 z=-14）
  for(let i=0;i<13;i++){
    const x=-27+i*4.5;
    box(2.6,2.6,.3,0x88ccee,x,5,-14.15,true);    // 窗（一层，高一点）
    box(2.6,2.6,.3,0x88ccee,x,9.5,-14.15,true);  // 窗（二层）
    box(2.6,2.6,.3,0x88ccee,x,12.5,-14.15,true); // 窗（三层）
  }
  /* 正门已交给 carveMainDoor() 建造真实可开的门，
     这里不能再放一块 6x3.6 的装饰门板 —— 它正好把门洞堵死，
     玩家开了门也进不去（这正是「只能在教学楼外活动」的真正原因）。 */

  box(3.2,.3,1.2,0x8a7a5a,0,3.75,-14.4,true);   // 门楣/雨棚（不碰撞，贴门洞上沿）

  /* 行政楼门同理，交给 carveAdminDoor()，

function spawnEnemy(x,z){

const P={
  pos:new THREE.Vector3(0,1.6,5),
  vel:new THREE.Vector3(),
  yaw:0, pitch:0,
  firing:false,            // 扳机是否按住（全自动连发靠它）
  /* 武器皮肤：{ 物品 id: 皮肤 id }。
     存的是「这把枪用什么皮肤」而不是「当前用什么皮肤」，
     这样切枪时每把枪都能记住自己的涂装。 */
  skins:{},
  hp:100, armor:0,
  /* ammo=手枪弹匣 / gun=长枪弹匣 / rifle|pistol|sniper|shot=各类后备弹。
     sniper 和 shot 以前没初始化，撒弹枪和狙击买了弹也只能靠
     「完全没弹时白给满匣」的兜底苟着，换弹时后备一直是 undefined。 */
  ammo:{ammo:90,med:0,cash:0,gun:120,rifle:0,pistol:0,sniper:0,shot:0},
  inv:{gun:true,med:0},

     bag 是按 id 聚合的物品表：{ itemId: 数量 }。
     装备栏单独存 id，护甲/头盔提供减伤和额外血量（见 dmgPlayer）。
     背包有容量上限，买太多就会卡住提示「背包已满」。 */

     stash —— 局外仓库，容量无限，安全区里随便存，阵亡不掉
     pouch —— 局内背包，装什么带什么，容量由背包装备决定，阵亡全丢
     原来的 P.bag 把两者混成一个，导致「蹲局里还能买到所有东西」，
     完全不像搜打撤。现在彻底拆开。 */
  stash:{ med:2, ammo_pistol:2, bandage:3, melee_knife:1, pis_default:1 },  // 局外仓库（新手初始物资）
  pouch:{},                // 局内背包 { itemId: 数量 }
  bagCap:24,               // 局内背包容量（由背包装备决定）
  /* 出击装备：六个槽位，对应仓库左侧的竖排装备栏

  equip:{ helmet:null, armorVest:null, backpack:'bp_small',

  helmetDur:0, vestDur:0, // 护甲耐久（受伤时先扣）

  slot:'secondary',        // 初始拿手枪（新手只有手枪+小刀）

const LOCK_TURN=false; // 手机端陀螺仪可后续接入

function lookAtYawPitch(){
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;
  camera.rotation.x=P.pitch;
}
function setView(y,p){
  P.yaw=y; P.pitch=p;
  const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
  lookAtYawPitch();
}
function lookDir(){
  const v=new THREE.Vector3(0,0,-1);

/* ---- 跳跃（只能在落地时跳，防止二段跳） ---- */
function doJump(){
  if(!P.alive) return;
  if(!P.onGround) return;   // 空中不能跳
  if(P.prone) return;       // 趴着不能跳，得先站起来
  P.vel.y=7;
  P.onGround=false;
  sfxStep();
}

/* 趴下开关：切换状态，站起时如果头顶有障碍就先不起来。
   检查方式：把眼睛抬到站立高度，看身体区间是否与某个碰撞盒相交；
   相交就说明上面有东西压着，保持趴着并提示。 */
function toggleProne(){
  if(!P.alive) return;
  if(P.prone){
    /* 试着站起来：临时按站立高度算一次碰撞 */
    const standFeet = P.pos.y - P.standH;
    const standHead = P.pos.y - P.eyeH + P.standH;
    let blocked=false;
    for(const m of colliders){
      if(!m.geometry) continue;
      if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
      const bb=m.geometry.boundingBox; if(!bb) continue;
      const hw=(bb.max.x-bb.min.x)/2, hd=(bb.max.z-bb.min.z)/2, hh=(bb.max.y-bb.min.y)/2;
      const top=m.position.y+hh, bot=m.position.y-hh;
      if(bot>standHead || top<standFeet+0.05) continue;
      /* 顶面低于脚下 35cm 的（地板/台阶）不算障碍 */
      if(top < standFeet+0.35) continue;
      if(P.pos.x>m.position.x-hw-0.4 && P.pos.x<m.position.x+hw+0.4 &&
         P.pos.z>m.position.z-hd-0.4 && P.pos.z<m.position.z+hd+0.4){ blocked=true; break; }
    }
    if(blocked){ toast('上面太低，站不起来'); sfxDeny(); return; }
    P.prone=false;
  }else{
    P.prone=true;
  }
  sfxUI();
  refreshHUD();
}

/* ---- 玩家移动（重力 + 键盘/摇杆输入） ---- */
function updP(dt){
  // 鼠标/触控视角在 e_io/e_ui 里通过 pointer 事件直接改 P.yaw/P.pitch
  /* 【趴下过渡】眼睛高度在站立(1.6)和趴下(0.55)之间平滑插值，
     直接跳变会让画面像瞬移，很难受。 */
  const wantH = P.prone ? P.proneH : P.standH;
  P.eyeH += (wantH - P.eyeH) * Math.min(1, dt*10);
  if(Math.abs(P.eyeH-wantH)<0.002) P.eyeH=wantH;

  const f=P.keys['KeyW'], b=P.keys['KeyS'], l=P.keys['KeyA'], r=P.keys['KeyD'];
  /* 趴下时不能冲刺，且速度只有步行的 35% */
  const sprint=!P.prone && (P.keys['ShiftLeft']||P.keys['ShiftRight']||P.sprinting);
  const spd=(sprint?P.sprint:P.speed) * (P.prone?0.35:1);

  let mx=0,mz=0;
  if(f)mz-=1; if(b)mz+=1; if(l)mx-=1; if(r)mx+=1;
  /* 【摇杆输入 —— 单一数据源】
     以前这里有两条路：先读 P.joyX，再读 window.__joyTouch 做「双保险」，
     两套逻辑并存导致出问题时无法判断是哪条路喂的值，
     调试面板上还会显示 P.joyX=0 而实际在用 __joyTouch（或反过来）。
     现在只从 window.__joyTouch 读：它是 touchmove 直接写入的原始触点，
     不依赖任何事件配对，也不受模块作用域影响。
     位移按 max=48px 归一化到 -1~1，死区 2px。 */
  const jt=window.__joyTouch;
  if(jt && jt.active){
    let dx=jt.cx-jt.sx, dy=jt.cy-jt.sy;
    const jmax=48;
    let d=Math.hypot(dx,dy);
    if(d>jmax){ dx*=jmax/d; dy*=jmax/d; d=jmax; }
    /* 【符号约定 —— 这里踩过坑】
       mx/mz 与键盘保持一致：mz 为负 = 前进，为正 = 后退。
       屏幕坐标 y 向下为正，手指「往上推」时 dy<0。
       但 updP 里前进方向是 mz<0 对应的 fwdZ=-cos(yaw)，
       若直接把 dy 当 mz 用，dy<0 会乘出正数 → 玩家反而后退。
       所以必须取反：屏幕往上推 → mz 为负 → 沿相机前方前进。 */
    if(d>2){ mx=dx/jmax; mz=-dy/jmax; }
    /* 同步回 P，方便 HUD 和其它系统读取；不是输入源 */
    P.joyX=mx; P.joyY=mz;
  }else{
    P.joyX=0; P.joyY=0;
  }

  /* 开镜：按住开镜键时 FOV 收紧，松开还原。
     aimT 是平滑插值，避免瞬间跳变导致眩晕。 */
  const aimTarget = P.aiming && P.onGround ? 1 : 0;
  P.aimT += (aimTarget - P.aimT) * Math.min(1, dt*12);
  if(camera){
    const baseFov = P.sprinting ? 78 : 75;
    /* 各枪开镜倍率不同：狙击压到 0.55 倍视场（约 2.4 倍镜），
       DMR 0.72、步枪 1.0、手枪 1.0。
       以前所有枪都固定缩 28 度，狙击开镜完全不像狙击。 */
    let adsK=1;
    try{
      const it=(typeof curItem==='function')?curItem():null;
      if(it && it.adsFov) adsK=it.adsFov;
    }catch(e){ adsK=1; }
    camera.fov = baseFov - 28*P.aimT*adsK;
    camera.updateProjectionMatrix();
  }

  // 相对 yaw 的方向
  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);
  // 前进方向：世界 -z 旋转 yaw
  const fwdX=-sin, fwdZ=-cos;
  const rightX=cos, rightZ=-sin;
  /* 【致命 bug 所在地】
     wx/wz 原来声明为 const，随后又写 wx/=len 归一化，
     ES module 是严格模式，给 const 赋值直接抛
     TypeError: Assignment to constant variable.
     结果是：只要玩家有任何移动输入，updP 就在这一行中断，
     后面的 moveAndCollide 永远执行不到 → 人永远站在原地。
     而没有任何输入时 len=0 走 else 分支，不抛错，
     所以「能转视角、能开镜、能开火，就是走不动」。
     这也解释了为什么前面几轮全在修摇杆都没用：
     摇杆值其实一直是好的，是下游把它消费掉的那一步炸了。 */
  let wx=fwdX*mz + rightX*mx;
  let wz=fwdZ*mz + rightZ*mx;
  const len=Math.hypot(wx,wz);
  if(len>0){
    wx/=len; wz/=len;
    P.vel.x=wx*spd;
    P.vel.z=wz*spd;
  }else{
    P.vel.x*=0.8; P.vel.z*=0.8;
  }

  // 重力
  P.vel.y-=22*dt;

  // 移动 + 碰撞（简单的 AABB 在地面的检测）
  moveAndCollide(dt);

  // 玩家朝向跟随视角
  camera.position.set(P.pos.x,P.pos.y,P.pos.z);
  lookAtYawPitch();
}

/* 简单的地面碰撞：只检测与 colliders（BOX）的 XZ 平面重叠 */
function moveAndCollide(dt){
  const nx=P.pos.x+P.vel.x*dt;
  const nz=P.pos.z+P.vel.z*dt;
  let ny=P.pos.y+P.vel.y*dt;
  const r=0.4; // 玩家半径
  /* 玩家可站立高度：P.pos.y 就是眼睛高度（1.6），
     所以身体占 [ny-1.6, ny] 这一段，而不是 [ny, ny+1.6]。
     以前写成 ny+1.6，等于把判定盒整段抬到头顶以上，
     站在地面板上时永远和「地面」这个碰撞体相交。 */
  /* 【可站立高度】P.pos.y 就是眼睛高度，而眼睛高度会随趴下变化，
     所以这里必须用 P.eyeH 而不是写死的 1.6 —— 否则趴下之后
     身体判定区间还是站立的尺寸，钻不过矮处也躲不掉子弹。 */
  const eyeH = P.eyeH;
  const feetY=ny-eyeH, headY=ny;

  /* ================= 垂直方向：落地判定 =================
     【原来这里只有一个 `if(ny<eyeH) ny=eyeH`】
     它只认得「地面 y=0」这一个平面。于是出现了两个严重问题：

       1) 遁地：屋顶、台阶、看台、走廊地板这些物体，
          逻辑上应该能踩上去，但代码里根本没有「站在某个顶面」
          这个概念。玩家走到台阶上，脚下没有支撑判定，
          就一直往下掉，最后被 y=0 那一行兜住 —— 表现就是
          「明明站在楼上却掉到楼里」「走两步突然掉下去」。

       2) 板子飞天：反过来说，悬在空中的装饰板（雨棚、门额横梁）
          被当成实心体，但玩家又不会被它挡住/托住，
          于是它看起来就是「飘在天上、人能穿过去」。

     现在补上真正的顶面判定：
       对每个碰撞体算出它的顶面 top，
       如果玩家这一帧的脚底从 top 上方落到 top 下方（跨过顶面），
       而且水平方向在它范围内，就落在 top 上。
     这一步必须在水平推进「之前」用旧位置算，
     否则人会先被侧面推开、再也对不上顶面。 */
  let standY=1;                       // 至少站在 y=0 地面上（眼睛高度）
  const r0=0.4;
  for(const m of colliders){
    if(!m.geometry) continue;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) continue;
    const halfH=(bb.max.y-bb.min.y)/2;
    const top=m.position.y+halfH;
    const halfW=(bb.max.x-bb.min.x)/2, halfD=(bb.max.z-bb.min.z)/2;
    const mx=m.position.x, mz=m.position.z;
    /* 水平方向必须在物体范围内（留一点边，不然贴边站不住） */
    if(P.pos.x < mx-halfW-r0*0.6 || P.pos.x > mx+halfW+r0*0.6) continue;
    if(P.pos.z < mz-halfD-r0*0.6 || P.pos.z > mz+halfD+r0*0.6) continue;
    /* 这一帧脚底有没有从 top 上方跨到下方（或本来就踩在 top 上） */
    const prevFeet=P.pos.y-P.eyeH;
    const landTop=top+eyeH;           // 站在这个顶面上时，眼睛应该在的高度
    if(prevFeet>=top-0.08 && ny<=landTop && P.vel.y<=0){
      if(landTop>standY) standY=landTop;
    }
  }
  /* 地面兜底（y=0 那块大平面没有碰撞体，单独处理） */
  if(standY<eyeH) standY=eyeH;

  P.onGround=false;
  if(ny<standY){ ny=standY; P.vel.y=0; P.onGround=true; }
  const canBlock=(m)=>{
    if(!m.geometry) return false;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) return false;
    const halfH=(bb.max.y-bb.min.y)/2;
    const top=m.position.y+halfH;
    /* 顶面低于脚下 35cm 的（地面、操场、走廊地板、马路）不参与侧面碰撞，
       否则站在地板上会被判定为「卡在实体内部」，分轴推进时每一帧都被推回原位。 */
    if(top < feetY+0.35) return false;
    return true;
  };
  /* 分轴推进：先试 X，再试 Z。
     整体一起判定的写法在角落里会把两轴一起弹回原位，
     表现就是「贴着墙走不动」甚至「一出生就动不了」。
     分轴的好处是被挡住时还能沿墙滑行，手感也顺。 */
  let px=P.pos.x, pz=P.pos.z;
  // ---- X 轴 ----
  let tx=nx, blockedX=false;
  for(const m of colliders){
    if(!canBlock(m)) continue;
    const bb=m.geometry.boundingBox;
    const halfW=(bb.max.x-bb.min.x)/2, halfD=(bb.max.z-bb.min.z)/2, halfH=(bb.max.y-bb.min.y)/2;
    const mx=m.position.x, mz=m.position.z, my=m.position.y;
    if(feetY < (my+halfH) && headY > (my-halfH)){
      if(tx>mx-halfW-r && tx<mx+halfW+r && pz>mz-halfD-r && pz<mz+halfD+r){
        tx = (tx>mx) ? (mx+halfW+r) : (mx-halfW-r);
        blockedX=true;
      }
    }
  }
  if(blockedX) P.vel.x=0;
  // ---- Z 轴 ----
  let tz=nz, blockedZ=false;
  for(const m of colliders){
    if(!canBlock(m)) continue;
    const bb=m.geometry.boundingBox;
    const halfW=(bb.max.x-bb.min.x)/2, halfD=(bb.max.z-bb.min.z)/2, halfH=(bb.max.y-bb.min.y)/2;
    const mx=m.position.x, mz=m.position.z, my=m.position.y;
    if(feetY < (my+halfH) && headY > (my-halfH)){
      if(tx>mx-halfW-r && tx<mx+halfW+r && tz>mz-halfD-r && tz<mz+halfD+r){
        tz = (tz>mz) ? (mz+halfD+r) : (mz-halfD-r);
        blockedZ=true;
      }
    }
  }
  if(blockedZ) P.vel.z=0;
  /* 兜底：数值异常时保持原位，绝不让 NaN 传染给下一帧 */
  if(!isFinite(tx)||!isFinite(tz)){ tx=P.pos.x; tz=P.pos.z; }
  P.pos.x=tx; P.pos.z=tz; P.pos.y=ny;
}

/* ============ d_game.js：敌人 AI + 物资 + 撤离 + 射击 ============ */
let enemyTick=0;

/* ---- 射击 ----
   三种手持状态：
     primary   主武器：步枪 / 冲锋枪 / DMR / 狙击 / 霰弹枪
     secondary 手枪  ：耗 P.ammo.ammo
     melee     副武器：不耗弹、射速慢、只能近身（射线限 3 米）

   【射击模式】由 SHOP_ITEMS[id].fireMode 决定：
     auto 全自动 —— 按住左键持续开火（在 updFireHold 里循环调用）
     semi 半自动 —— 一次扳机一发，射速受 fireCd 限制
     bolt 栓动   —— 每发之间拉枪机，fireCd 很长（狙击）
     pump 泵动   —— 每发之间拉护木，见 wPump 动画
   本函数只管「打一发」，不负责判断能不能连发；
   连发由 updFireHold 每帧检测左键是否还压着来决定。

   【霰弹】pellets>1 的枪一次发多条射线，每条独立算伤害；
   单颗伤害很低（14），但近距离九颗全中就是 126，一枪带走；
   距离拉开后散得很开，大部分弹丸打空 —— 这就是「近距离伤害高」，
   不需要额外写衰减公式，散射本身就是衰减。

   【近战为什么以前打不出伤害】
   近战是 1 条 3 米长的射线，但敌人胶囊体的 COLLIDER 只在
   spawnEnemy 里 push 进了 shootables，而刀挥出去的时机通常是
   敌人已经贴脸（<1m）—— 射线起点在相机（y≈1.62），刀又往下挥，
   3 米内的射线常常从胶囊体旁边擦过去。表现就是「砍了没反应」。
   现在近战改成【半球形近身判定】：不看准星射线，直接遍历所有
   敌人算水平距离 + 高度差，只要在 2.6 米内、且大致在正面
   120° 扇区内就算命中。这才是刀该有的手感。 */
function fireOnce(dirOverride){
  const melee=curIsMelee();
  /* 近战不做射线检测，走独立的近身判定（见 meleeSwing） */
  if(melee){ meleeSwing(); return; }
  const t=curAmmoKey();
  const dir=dirOverride||lookDir();
  const origin=camera.position.clone();
  const pellets=melee?1:curPellets();
  const baseDmg=curDamage();
  const raycaster=new THREE.Raycaster(origin,dir,0.2, melee?3.0:120);
  let hitAny=false, headAny=false;
  for(let i=0;i<pellets;i++){
    /* 第 0 颗沿准星正中；其余在圆锥内随机偏移（散射） */
    if(i>0){
      const sp=melee?0:SHOT_SPREAD*(P.aimT>0.5?0.55:1);
      raycaster.ray.direction.set(
        dir.x+(Math.random()-0.5)*sp*2,
        dir.y+(Math.random()-0.5)*sp*2,
        dir.z+(Math.random()-0.5)*sp*2
      ).normalize();
    }else{
      raycaster.ray.direction.copy(dir);
    }
    const hits=raycaster.intersectObjects(shootables,true);
    if(!hits.length) continue;
    const hit=hits[0];
    const obj=hit.object;
    for(const e of enemies){
      if(e.body===obj||e.head===obj){
        /* 霰弹距离衰减：6 米内满伤，12 米后只剩三成。
           普通枪 pellets=1，衰减几乎看不出，不影响原手感。 */
        let d=baseDmg;
        if(pellets>1){
          const dist=hit.distance||0;
          if(dist>6) d*= Math.max(0.30, 1-(dist-6)*0.115);
        }
        e.hp-=d;
        e.aggro=true;
        hitAny=true;
        if(obj===e.head && !melee) headAny=true;
        if(e.hp<=0 && e.alive){
          e.alive=false; e.body.visible=false; e.head.visible=false; sfxKill();
        }
        break;
      }
    }
  }
  if(headAny) sfxHeadshot(); else if(hitAny) sfxHit();
}
/* ---- 近战近身判定 ----
   不用射线，改为「圆锥扇形 + 距离」判定：
     1) 水平距离 <= MELEE_RANGE（2.6m）
     2) 与视线方向的水平夹角 <= MELEE_ARC/2（60°，即正面 120° 扇区）
     3) 高度差 <= 2.2m（站着也能砍到趴着的，但打不到楼上的）
   这样贴脸乱砍一定砍得到，而不是刀从人身上穿过去没反应。
   命中的每个敌人独立扣血，一次挥砍最多打 MELEE_MAX（2）个，
   避免一刀把一屋子人全清了。 */
const MELEE_RANGE=2.6;      // 挥砍半径（米）
const MELEE_ARC=Math.PI/3;  // 半扇区 60°，正面总共 120°
const MELEE_MAX=2;          // 一刀最多命中几个
function meleeSwing(){
  if(!camera) return;
  const dmg=curDamage();
  /* 每把刀的挥砍半径不同：太刀最长，斧头重但短 */
  const mit=(typeof curMeleeItem==='function')?curMeleeItem():null;
  const reach=(mit&&mit.meleeRange)||MELEE_RANGE;
  const cp=camera.position;
  /* 视线水平方向：相机 forward 拍平 */
  const fx=-Math.sin(P.yaw||0), fz=-Math.cos(P.yaw||0);
  const cands=[];
  for(const e of enemies){
    if(!e.alive) continue;
    const dx=(e.x||0)-cp.x, dz=(e.z||0)-cp.z;
    const dist=Math.hypot(dx,dz);
    if(dist>reach) continue;
    if(Math.abs(cp.y-(e.body&&e.body.position?e.body.position.y:cp.y))>2.2) continue;
    /* 贴得极近时方向没意义，直接算命中 */
    let ang=0;
    if(dist>0.25){
      const dot=(dx*fx+dz*fz)/dist;
      ang=Math.acos(Math.max(-1,Math.min(1,dot)));
    }
    if(ang>MELEE_ARC) continue;
    cands.push({e:e,dist:dist});
  }
  /* 近的先挨刀 */
  cands.sort((a,b)=>a.dist-b.dist);
  const n=Math.min(cands.length, MELEE_MAX);
  for(let i=0;i<n;i++){
    const e=cands[i].e;
    e.hp-=dmg;
    e.aggro=true;
    if(e.hp<=0 && e.alive){
      e.alive=false;
      if(e.body) e.body.visible=false;
      if(e.head) e.head.visible=false;
      sfxKill();
    }
  }
  if(n>0) sfxHit();
  return n;
}
/* 霰弹散射半角（弧度/轴向偏移量）：0.028 约等于 1.6 度，
   8 米处散开半径约 22cm —— 正好覆盖一个人上半身。 */
const SHOT_SPREAD=0.028;

/* 实际扣板机入口：检查冷却/弹药，播放声音，决定是否进入泵动/栓动装填 */
function fire(){
  if(P.reload) return;
  /* 检视武器时枪已经转到脸前了，这时候还能开火会很穿帮 */
  if(typeof isInspecting==='function' && isInspecting()) return;
  if(P.shootCd>0) return;
  /* 泵动/栓动：上一发的拉栓动作没做完，不许再开火。
     这条比 shootCd 更严格，因为 fireCd（0.20）比拉栓时间（0.58）短。 */
  if(wPump>0) return;
  const melee=curIsMelee();
  const t=curAmmoKey();             // melee 时为 null
  if(!melee && (P.ammo[t]|0)<=0){ sfxEmpty(); startReload(); return; }
  if(!melee) P.ammo[t]--;
  const mode=curFireMode();
  P.shootCd=curFireCd();
  P.shooting=true;
  sfxShoot();
  /* 后坐力：每把枪自己登记 recoil 系数，霰弹/栓动最大 */
  const rk=curRecoilK();
  addShake(melee?0.35:0.55*rk*rk);
  weaponKick();
  fireOnce();
  /* 泵动 / 栓动：打完这一发就开始拉栓，拉完才能再打。
     泵动同时把 wPump 置 1 驱动护木动画；栓动没有护木，
     就用同样的计时器把 shootCd 拉长到拉栓结束。 */
  if(mode==='pump'){
    wPumpDur=curPumpTime()||0.58;
    wPump=1;
    P.shootCd=Math.max(P.shootCd, wPumpDur);
  }else if(mode==='bolt'){
    wPumpDur=curPumpTime()||0.55;
    wPump=1;                      // 借用同一套进度量，只是没有护木模型可动
    P.shootCd=Math.max(P.shootCd, curFireCd());
  }
  /* 打空自动换弹（全自动枪打空后会自动接上，不用再点一次） */
  if(!melee && (P.ammo[t]|0)<=0) startReload();
}

/* ---- 全自动持续开火 ----
   以前 mousedown 只调一次 fire()，所以所有枪实际都是「点一次打一发」。
   现在在主循环里检查：左键压住 && 当前枪是 auto && 冷却到了 -> 再打一发。
   半自动/栓动/泵动不走这里，必须重新按一次。 */
/* 场景是否已经能开火。
   正常情况下用 b_world.js 的 ready；但在测试桩里 b_world 的
   let ready 可能落在另一个作用域，读不到就退化为「只要
   camera 存在就算就绪」——fire() 本来就要用 camera，
   camera 都没有的话它也开不了枪。 */
function canShootYet(){
  return !!camera;
}
function updFireHold(dt){
  if(!P.firing) return;
  /* ready 由 b_world.js 声明（let renderer,...,ready=false），
     initWorld() 成功后才置真。场景没建好之前按住开火键不应该开枪。
     用 typeof 保护：单块静态检查时可能还没加载 b_world。 */
  if(typeof ready==='boolean' ? !ready : !canShootYet()) return;
  if(P.reload||curIsMelee()) return;
  if(typeof isInspecting==='function' && isInspecting()) return;
  if(!curIsAuto()) return;
  if(P.shootCd>0||wPump>0) return;
  fire();
}
/* ---- 换弹 ----
   近战不需要换弹，直接忽略。
   弹匣容量按武器数据里的 mag 取，没写就用默认值。 */
function startReload(){
  if(curIsMelee()) return;          // 刀不换弹
  if(P.reload||P.shootCd>0) return;
  P.reload=true; P.reloadT=1.2;
  sfxReload();
}
function updReload(dt){
  if(!P.reload) return;
  P.reloadT-=dt;
  if(P.reloadT<=0){
    P.reload=false;
    /* 换弹时再取一次当前槽：万一换弹中途切了枪，
       这里装填的应该是「现在手上这把」，而不是开始换弹那把。
       同时要检查这把枪还在不在（可能被切走了）。 */
    if(curIsMelee()) return;
    const t=curAmmoKey();
    const rk=curReserveKey();
    const id=slotItem(P.slot);
    const it=id&&SHOP_ITEMS[id];
    const mag=(it&&it.mag)||(curIsPrimary()?30:12);
    /* 从后备弹里扣：有后备就用后备，没有就按旧逻辑白给满弹匣，
       避免新手手枪打空后彻底没法玩。 */
    const have=(P.ammo[rk]|0);
    if(have>0){
      const need=Math.max(0,mag-(P.ammo[t]|0));
      const take=Math.min(have,need);
      P.ammo[t]=(P.ammo[t]|0)+take;
      P.ammo[rk]=have-take;
    }else if(!(P.ammo[t]|0)){
      P.ammo[t]=mag;    // 兜底：完全没弹了给满一梭子，不然新手卡死
    }
    refreshHUD();
  }
}

/* ---- 受伤 ---- */
function damageP(n){
  /* 【护甲减伤】穿着头盔/护甲时：
     1) 先按装备的减伤比例削掉一部分伤害（头盔管头部，这里统一按加权算）
     2) 再扣装备耐久，耐久归零则装备失效并自动卸下
     原来的 P.armor 是旧的护盾值，保留兼容。 */
  let reduce=0;
  if(P.equip){
    if(P.equip.helmet && P.helmetDur>0) reduce += (SHOP_ITEMS[P.equip.helmet]?.reduce||0)*0.4;
    if(P.equip.armorVest && P.vestDur>0) reduce += (SHOP_ITEMS[P.equip.armorVest]?.reduce||0)*0.6;
  }
  if(reduce>0) n = n*(1-Math.min(0.75,reduce));

  if(P.armor>0){
    const a=Math.min(P.armor,n*.6);
    P.armor-=a; n-=a;
  }

  /* 扣耐久：伤害的一半转到护甲耐久上 */
  if(P.equip){
    if(P.equip.armorVest && P.vestDur>0){
      P.vestDur=Math.max(0,P.vestDur-n*0.5);
      if(P.vestDur<=0){ P.equip.armorVest=null; toast('护甲已损坏'); }
    } else if(P.equip.helmet && P.helmetDur>0){
      P.helmetDur=Math.max(0,P.helmetDur-n*0.5);
      if(P.helmetDur<=0){ P.equip.helmet=null; toast('头盔已损坏'); }
    }
  }

  P.hp-=n;
  sfxHurt();
  refreshHUD();
  if(P.hp<=0){ P.hp=0; onDeath(); }
}
function onDeath(){
  sfxDeath();
  /* 【阵亡结算】搜打撤的风险机制：
     你带进局的背包物资和身上的头盔/护甲，全都丢了。
     仓库里的东西不受影响（那是安全区）。 */
  const lost = (typeof settleDeath==='function') ? settleDeath() : 0;
  const info=$('deathInfo');
  if(info) info.textContent='击杀 '+(enemies.filter(e=>!e.alive).length)+' 名敌人 · 现金 ¥'+P.ammo.cash
    +' · 丢失背包物品 '+lost+' 种、装备全部掉光';
  const d=$('death'); if(d) d.style.display='flex';
}

/* ---- 敌人 AI ---- */
function updE(dt){
  if(P.shootCd>0) P.shootCd-=dt;
  if(P.reload) updReload(dt);
  if(P.shooting) P.shooting=false;

  enemyTick+=dt;
  while(enemyTick>=0.2){
    enemyTick-=0.2;
    for(const e of enemies){
      if(!e.alive){
        if(e.respawn>0) e.respawn-=1;
        continue;
      }
      // aggro 状态朝玩家移动，否则巡逻（原地小幅晃动）
      const dx=P.pos.x-e.x, dz=P.pos.z-e.z;
      const dist=Math.hypot(dx,dz);
      if(dist<18){ e.aggro=true; }
      if(e.aggro){
        const spd=e.speed;
        if(dist>1.5){
          e.x+=dx/dist*spd*0.2;
          e.z+=dz/dist*spd*0.2;
          e.body.rotation.y=Math.atan2(dx,dz);
        }
        // 攻击
        if(dist<3 && e.atkCd<=0){
          damageP(8+e.speed*0); e.atkCd=1.0;
        }
      }
      if(e.atkCd>0) e.atkCd-=0.2;
      // 同步 mesh 位置
      e.body.position.set(e.x,0.85,e.z);
      e.head.position.set(e.x,1.7,e.z);
    }
  }
  // 复活的敌人（respawn 计数器用 0.2s 节拍，这里简单延迟重生）
  for(const e of enemies){
    if(e.alive||e.respawn<=0) continue;
    e.respawn-=0.2;
    if(e.respawn<=0){ respawnEnemy(e); }
  }
}
function respawnEnemy(e){
  e.alive=true; e.hp=100; e.aggro=false;
  e.body.visible=true; e.head.visible=true;
  e.respawn=0;
}

function updLoot(dt){
  for(const l of loots){
    if(l.taken) continue;
    const d=Math.hypot(P.pos.x-l.x,P.pos.z-l.z);
    if(d<1.5){

/* ============ e_io.js：加密存档（PBKDF2 + AES-GCM + FNV-1a） ============ */
const MAGIC='EFSFPS';

function fnv1a(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=(h*0x01000193)>>>0;
  }
  return h.toString(16).padStart(8,'0');
}

function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ return Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); }

async function importKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},
    km,
    {name:'AES-GCM',length:256},
    false,
    ['encrypt','decrypt']
  );
}

async function encryptSave(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const json=JSON.stringify(obj);
  const key=await importKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(json));
  return MAGIC+'.'+buf2b64(salt)+'.'+buf2b64(iv)+'.'+buf2b64(ct);
}

async function decryptSave(str,pw){
  const parts=str.split('.');
  if(parts.length!==4||parts[0]!==MAGIC) throw new Error('格式错误');
  const salt=b642buf(parts[1]);
  const iv=b642buf(parts[2]);
  const ct=b642buf(parts[3]);
  const key=await importKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function exportSave(){
  const obj={hp:P.hp,armor:P.armor,ammo:P.ammo,inv:P.inv,cash:P.ammo.cash,pos:[P.pos.x,P.pos.z]};
  const pw=prompt('设置存档密码：');
  if(!pw) return;
  encryptSave(obj,pw).then(s=>{
    const t=$('savebox'); if(!t) return;
    t.value=s; t.style.display='block';
    t.select(); document.execCommand('copy');
    alert('已加密并复制到剪贴板');
  });
}
function importSave(){
  const s=prompt('粘贴存档串：');
  if(!s) return;
  const pw=prompt('输入存档密码：');
  if(!pw) return;
  decryptSave(s,pw).then(o=>{
    P.hp=o.hp; P.armor=o.armor; P.ammo=o.ammo; P.inv=o.inv;
    P.pos.set(o.pos[0],1.6,o.pos[1]);
    refreshHUD();
    alert('存档已恢复');
  }).catch(e=>{
    alert('解密失败：'+e.message);
  });
}

/* 显示摇杆和操作按钮。
   【不要再依赖触摸检测】原来写了 if(!isTouch) return;
   而 isTouch 来自 'ontouchstart' in window || navigator.maxTouchPoints>0。
   某些 Android WebView / 内置浏览器里这两个值都拿不到（或为 0），
   于是这段直接 return，#joyZone 永远停在 CSS 的 display:none，
   display:none 的元素收不到任何事件 —— 手怎么拖都没反应。
   反正桌面端本来也有鼠标拖拽摇杆的兜底，所以干脆无条件显示。 */
function showTouchUI(){

   之前 #joyZone 是常驻 display:block，层级还压在菜单之上，
   于是主界面也能看到一个摇杆，很碍事。 */
function hideTouchUI(){

  const az=$('actZone'); if(az) az.style.display='none';
  setWpnBarVisible(false);
