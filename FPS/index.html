<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FPS 搜打撤 · 学校逃离 3D</title>
<style>
  :root{ --accent:#7c5cff; --accent2:#a88cff; --bg:#0b0e14; --panel:rgba(14,18,28,.92); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0b0e14; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e8e8f0; touch-action:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block;
      /* saltline 观感：提对比 + 压高光 + 微降饱和 + 轻微色偏。
         CSS filter 走 GPU 合成，几乎零开销，不需要 EffectComposer。 */
      filter: contrast(1.18) saturate(0.92) brightness(1.04) hue-rotate(-4deg);
    }
  /* 后处理叠加层：暗角 + 色调 + 颗粒（对应 saltline 的最终合成 pass） */
  #grade{ position:fixed; inset:0; z-index:4; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(120,170,255,.06) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 70%, rgba(255,190,120,.05) 100%);
    mix-blend-mode:normal;
  }
  /* 胶片颗粒：用 SVG 噪声做平铺，静态不闪，成本可忽略 */
  #grain{ position:fixed; inset:0; z-index:5; pointer-events:none; opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    background-size:120px 120px;
  }
  /* HUD */
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  /* 视角触摸层：覆盖全屏，位于摇杆/按钮之下 */
  #viewLayer{ position:fixed; right:0; top:0; bottom:0; width:50%; z-index:25; touch-action:none; background:transparent; }
  /* 右半屏负责转视角；左半屏只归摇杆。两者不重叠，
     否则摇杆铺满左半屏会把视角拖拽抢走（反之亦然）。 */
  /* 游戏内常驻操作提示（手机端小字条） */
  #htip{ position:absolute; left:50%; transform:translateX(-50%); bottom:58px; max-width:94vw; padding:5px 10px; border-radius:8px; background:rgba(10,14,22,.72); border:1px solid rgba(124,92,255,.35); color:#c8d0e0; font-size:10.5px; line-height:1.5; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .6s; }
  #htip.hide{ opacity:0; }
  #topbar{ position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; }
  .pill{ background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:7px 12px; font-size:13px; font-weight:600; backdrop-filter:blur(6px); }
  .pill b{ color:var(--accent2); }
  #hpwrap{ flex:1; min-width:80px; }
  #hpbar{ height:8px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; margin-top:5px; }
  #hpfill{ height:100%; width:100%; background:linear-gradient(90deg,#48c774,#8ce6a0); border-radius:6px; transition:width .2s; }
  #hpfill.low{ background:linear-gradient(90deg,#e6533c,#ff8a70); }
  #crosshair{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; }
  #crosshair::before,#crosshair::after{ content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair::before{ left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  #hitmark{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; opacity:0; transition:opacity .1s; }
  #hitmark span{ position:absolute; width:12px; height:3px; background:#fff; border-radius:2px; }
  #hitmark .h1{ top:-1px; left:-1px; transform:rotate(45deg); } #hitmark .h2{ top:-1px; right:-1px; transform:rotate(-45deg); }
  #hitmark .h3{ bottom:-1px; left:-1px; transform:rotate(-45deg); } #hitmark .h4{ bottom:-1px; right:-1px; transform:rotate(45deg); }
  /* 消息 / 拾取提示 */
  #msg{ position:absolute; top:70px; left:50%; transform:translateX(-50%); text-align:center; font-size:15px; font-weight:600; text-shadow:0 1px 4px #000; pointer-events:none; opacity:0; transition:opacity .2s; }
  #prompt{ position:absolute; bottom:130px; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 16px; border-radius:10px; font-size:14px; border:1px solid var(--accent); opacity:0; transition:opacity .15s; }
  #toast{ position:absolute; bottom:140px; left:50%; transform:translateX(-50%); color:#7ee8a0; font-size:14px; font-weight:600; opacity:0; text-shadow:0 1px 3px #000; white-space:nowrap; }
  /* 加载/错误提示 */
  #loaderr{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff7a6a; font-size:15px; font-weight:700; text-align:center; z-index:200; background:rgba(20,8,8,.92); padding:16px 22px; border-radius:12px; border:1px solid #c2382a; display:none; max-width:80%; line-height:1.6; }
  /* 摇杆（移动端） */
  #joyZone{ position:fixed; bottom:0; left:0; width:50%; height:100%; display:none; pointer-events:auto; z-index:60; touch-action:none; background:transparent; }
  #joyBase{ position:absolute; left:110px; top:calc(100% - 110px); width:110px; height:110px; margin:0; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(124,92,255,.5); box-shadow:0 0 0 6px rgba(124,92,255,.08); touch-action:none; transform:translate(-50%,-50%); pointer-events:none; }
  #joyStick{ position:absolute; left:50%; top:50%; width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.35); transform:translate(-50%,-50%); }
  /* 右侧操作区（移动端） */
  #actZone{ position:fixed; bottom:0; right:0; width:50%; height:55%; display:none; pointer-events:none; z-index:35; }
  .actbtn{ position:absolute; width:64px; height:64px; border-radius:50%; background:var(--panel); border:2px solid rgba(255,255,255,.2); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:auto; touch-action:none; }
  .actbtn:active{ background:var(--accent); }
  /* 按钮图标（SVG，currentColor 跟随主题） */
  .actbtn .ico{ width:30px; height:30px; fill:currentColor; stroke:none; pointer-events:none; }
  #btnFire .ico{ width:38px; height:38px; }
  #btnJump .ico{ width:30px; height:30px; }
  #btnAim.active{ background:rgba(124,92,255,.55); border-color:#7c5cff; }
  #btnFire{ right:26px; bottom:26px; width:88px; height:88px; border-color:#ff5a4d; background:rgba(255,90,77,.18); font-size:15px; }
  #btnAim{ right:118px; bottom:96px; width:62px; height:62px; border-color:#7c5cff; }
  #btnJump{ right:126px; bottom:22px; }
  #btnReload{ right:30px; bottom:126px; }
  #btnInteract{ right:204px; bottom:34px; width:58px; height:58px; }
  #btnSprint{ right:196px; bottom:110px; width:58px; height:58px; }

  /* 菜单 */
  #menu{ position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.92); display:flex; align-items:center; justify-content:center; padding:20px; }
  #menu .box{ width:100%; max-width:520px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(124,92,255,.7) rgba(255,255,255,.06); background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:24px; }
  #menu .box::-webkit-scrollbar{ width:8px; }
  #menu .box::-webkit-scrollbar-track{ background:rgba(255,255,255,.06); border-radius:4px; }
  #menu .box::-webkit-scrollbar-thumb{ background:rgba(124,92,255,.75); border-radius:4px; }
  .keysbox{ margin:4px 0 14px; padding:14px; border-radius:12px; background:rgba(124,92,255,.13); border:1px solid rgba(124,92,255,.42); box-shadow:0 0 0 1px rgba(124,92,255,.1) inset; }
  .keysbox-t{ font-size:12.5px; letter-spacing:.08em; color:#b9a6ff; margin-bottom:10px; font-weight:700; }
  .keysgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .kk{ display:flex; align-items:center; gap:5px; font-size:12px; color:#c8d0e0; }
  .kk kbd{ display:inline-block; min-width:20px; padding:2px 6px; font:600 11px/1.4 ui-monospace,monospace; text-align:center; color:#e8ecf5; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-bottom-width:2px; border-radius:5px; }
  .kk span{ color:#98a0b0; }
  .keysbox-note{ margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.09); font-size:11.5px; color:#8b93a6; line-height:1.6; }
  h1{ font-size:22px; margin-bottom:4px; } h1 span{ color:var(--accent2); }
  .sub{ color:#98a0b0; font-size:13px; margin-bottom:18px; }
  .row{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .btn{ pointer-events:auto; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:active{ filter:brightness(1.2); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,.2); }
  .btn.danger{ background:#c2382a; }
  .btn.small{ padding:8px 12px; font-size:13px; }
  .stat{ background:rgba(255,255,255,.05); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; }
  .stat .k{ font-size:11px; color:#98a0b0; } .stat .v{ font-size:18px; font-weight:800; color:var(--accent2); }
  .shoprow{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid rgba(255,255,255,.1); border-radius:10px; margin-top:8px; background:rgba(255,255,255,.03); }
  .shoprow .info{ flex:1; } .shoprow .n{ font-weight:700; font-size:14px; } .shoprow .d{ font-size:12px; color:#98a0b0; }
  .shoprow .price{ font-weight:800; color:#ffd54a; white-space:nowrap; }
  #death{ position:fixed; inset:0; z-index:90; background:rgba(120,10,10,.6); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #death h2{ font-size:32px; text-shadow:0 2px 8px #000; }
  #fpscount{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:11px; color:#778; }
  @media (max-width:768px){ .actbtn,.joyZone,.actZone{ } }
</style>
</head>

{ "imports": { "three": "./three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ============ b_world.js：场景初始化 + 学校地图（还原现实） ============ */
const $=id=>document.getElementById(id);
let renderer,scene,camera,clock,ready=false;
const colliders=[],shootables=[],enemies=[],loots=[];
let exfil=null;

/* 造实体：加入场景 + 作为碰撞体 */
function solid(m){ m.castShadow=m.receiveShadow=true; scene.add(m); colliders.push(m); return m; }

/* 箱子（墙体/建筑块）。noCol=true 时只显示不碰撞（如窗户玻璃） */
function box(w,h,d,c,x,y,z,noCol){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.85}));
  m.position.set(x,y,z);
  if(noCol){ scene.add(m); return m; }
  return solid(m);
}
/* 圆柱（路灯/树/柱子） */
function cyl(rt,rb,h,c,x,y,z,noCol){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,12),new THREE.MeshStandardMaterial({color:c,roughness:.8}));
  m.position.set(x,y,z);
  if(noCol){ scene.add(m); return m; }
  return solid(m);
}
/* 平面装饰（球场标线、跑道等，贴地面不碰撞） */
function groundDeco(w,d,c,x,z,opacity){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color:c,roughness:1,transparent:opacity<1,opacity:opacity!==undefined?opacity:1}));
  m.rotation.x=-Math.PI/2; m.position.set(x,.02,z); m.receiveShadow=true; scene.add(m); return m;
}

/* 渲染器 + 场景 + 光照 + 相机 */
function init(){
  try{
    renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
  }catch(e){
    showErr('WebGL 初始化失败：'+e.message+'。请检查浏览器是否支持 WebGL。');
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  /* 色调映射：这是 saltline 「像照片」最核心的一步。
     不做映射时，高光一律被硬裁到纯白，画面显平、发灰、像塑料；
     ACES 会做胶片式的柔和肩部压缩，亮部保留层次。 */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  if('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.autoUpdate = true;
  renderer.shadowMap.needsUpdate = true;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8fb7d9);           // 天空淡蓝
  scene.fog=new THREE.Fog(0x8fb7d9,40,180);

  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,600);
  // 相机初始位置 = 玩家出生点，避免初入黑/空视角
  camera.position.set(0,1.7,8);
  camera.rotation.set(0,0,0);

  clock=new THREE.Clock();

  /* 光照 */

const P={
  pos:new THREE.Vector3(0,1.6,5),
  vel:new THREE.Vector3(),
  yaw:0, pitch:0,
  hp:100, armor:0,
  ammo:{ammo:90,med:0,cash:0,gun:120},

  shootCd:0, sprinting:false, joyX:0, joyY:0, alive:true,
  aiming:false,    /* 开镜状态（按住开镜键） */
  aimT:0,          /* 开镜过渡插值 0~1，用于平滑 FOV */
  keys:{},
};
const LOCK_TURN=false; // 手机端陀螺仪可后续接入

function lookAtYawPitch(){
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;
  camera.rotation.x=P.pitch;
}
function setView(y,p){
  P.yaw=y; P.pitch=p;
  const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
  lookAtYawPitch();
}
function lookDir(){
  const v=new THREE.Vector3(0,0,-1);
  v.applyEuler(new THREE.Euler(P.pitch,P.yaw,0,'YXZ'));
  return v;
}

/* ---- 跳跃（只能在落地时跳，防止二段跳） ---- */
function doJump(){
  if(!P.alive) return;
  if(!P.onGround) return;   // 空中不能跳
  P.vel.y=7;
  P.onGround=false;

}

/* ---- 玩家移动（重力 + 键盘/摇杆输入） ---- */
function updP(dt){
  // 鼠标/触控视角在 e_io/e_ui 里通过 pointer 事件直接改 P.yaw/P.pitch
  const f=P.keys['KeyW'], b=P.keys['KeyS'], l=P.keys['KeyA'], r=P.keys['KeyD'];
  const sprint=P.keys['ShiftLeft']||P.keys['ShiftRight']||P.sprinting;
  const spd=sprint?P.sprint:P.speed;

  let mx=0,mz=0;
  if(f)mz-=1; if(b)mz+=1; if(l)mx-=1; if(r)mx+=1;
  /* 【摇杆输入 —— 单一数据源】
     以前这里有两条路：先读 P.joyX，再读 window.__joyTouch 做「双保险」，
     两套逻辑并存导致出问题时无法判断是哪条路喂的值，
     调试面板上还会显示 P.joyX=0 而实际在用 __joyTouch（或反过来）。
     现在只从 window.__joyTouch 读：它是 touchmove 直接写入的原始触点，
     不依赖任何事件配对，也不受模块作用域影响。
     位移按 max=48px 归一化到 -1~1，死区 2px。 */
  const jt=window.__joyTouch;
  if(jt && jt.active){
    let dx=jt.cx-jt.sx, dy=jt.cy-jt.sy;
    const jmax=48;
    let d=Math.hypot(dx,dy);
    if(d>jmax){ dx*=jmax/d; dy*=jmax/d; d=jmax; }
    /* 【符号约定 —— 这里踩过坑】
       mx/mz 与键盘保持一致：mz 为负 = 前进，为正 = 后退。
       屏幕坐标 y 向下为正，手指「往上推」时 dy<0。
       但 updP 里前进方向是 mz<0 对应的 fwdZ=-cos(yaw)，
       若直接把 dy 当 mz 用，dy<0 会乘出正数 → 玩家反而后退。
       所以必须取反：屏幕往上推 → mz 为负 → 沿相机前方前进。 */
    if(d>2){ mx=dx/jmax; mz=-dy/jmax; }
    /* 同步回 P，方便 HUD 和其它系统读取；不是输入源 */
    P.joyX=mx; P.joyY=mz;
  }else{
    P.joyX=0; P.joyY=0;
  }

  /* 开镜：按住开镜键时 FOV 收紧，松开还原。
     aimT 是平滑插值，避免瞬间跳变导致眩晕。 */
  const aimTarget = P.aiming && P.onGround ? 1 : 0;
  P.aimT += (aimTarget - P.aimT) * Math.min(1, dt*12);
  if(camera){
    const baseFov = P.sprinting ? 78 : 75;
    camera.fov = baseFov - 28*P.aimT;   // 75 -> 47
    camera.updateProjectionMatrix();
  }

  // 相对 yaw 的方向
  const sin=Math.sin(P.yaw), cos=Math.cos(P.yaw);
  // 前进方向：世界 -z 旋转 yaw
  const fwdX=-sin, fwdZ=-cos;
  const rightX=cos, rightZ=-sin;
  /* 【致命 bug 所在地】
     wx/wz 原来声明为 const，随后又写 wx/=len 归一化，
     ES module 是严格模式，给 const 赋值直接抛
     TypeError: Assignment to constant variable.
     结果是：只要玩家有任何移动输入，updP 就在这一行中断，
     后面的 moveAndCollide 永远执行不到 → 人永远站在原地。
     而没有任何输入时 len=0 走 else 分支，不抛错，
     所以「能转视角、能开镜、能开火，就是走不动」。
     这也解释了为什么前面几轮全在修摇杆都没用：
     摇杆值其实一直是好的，是下游把它消费掉的那一步炸了。 */
  let wx=fwdX*mz + rightX*mx;
  let wz=fwdZ*mz + rightZ*mx;
  const len=Math.hypot(wx,wz);
  if(len>0){
    wx/=len; wz/=len;
    P.vel.x=wx*spd;
    P.vel.z=wz*spd;
  }else{
    P.vel.x*=0.8; P.vel.z*=0.8;
  }

  // 重力
  P.vel.y-=22*dt;

  // 移动 + 碰撞（简单的 AABB 在地面的检测）
  moveAndCollide(dt);

  // 玩家朝向跟随视角
  camera.position.set(P.pos.x,P.pos.y,P.pos.z);
  lookAtYawPitch();

  /* 调试：把摇杆活值和速度显示在 HUD 上，直接看数据而不是猜。
     位置固定右下角，字体很小，不影响游戏。 */
  if(!window.__dbgEl){
    const d=document.createElement('div');
    d.id='__dbg';
    d.style.cssText='position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:99999;color:#00ff88;font:bold 12px monospace;background:rgba(0,0,0,.75);padding:5px 10px;border-radius:6px;pointer-events:none;line-height:1.45;white-space:pre;text-align:left';
    document.body.appendChild(d);
    window.__dbgEl=d;
  }
  if(window.__dbgEl){
    const t=window.__joyTouch||{};
    const j=window.__joyTouch||{};
    const jd=(j.active&&j.sx!=null)?Math.round(Math.hypot(j.cx-j.sx,j.cy-j.sy)):0;
    window.__dbgEl.textContent=
      'EVT start='+(window.__evtStart||0)+' move='+(window.__evtMove||0)+'\n'+
      'joy='+(P.joyX||0).toFixed(2)+','+(P.joyY||0).toFixed(2)+' d='+jd+'\n'+
      'vel='+(P.vel.x||0).toFixed(2)+','+(P.vel.z||0).toFixed(2)+'\n'+
      'pos='+P.pos.x.toFixed(2)+','+P.pos.y.toFixed(2)+','+P.pos.z.toFixed(2)+'\n'+
      'FPS '+(window.__fps||0)+' dt='+(window.__lastDt||0).toFixed(3)+
      ' frames='+(window.__frames||0)+'\n'+
      'touch='+(t.active?'Y':'N')+' ERR:'+(window.__lastErr||'-');
  }
}

/* 简单的地面碰撞：只检测与 colliders（BOX）的 XZ 平面重叠 */
function moveAndCollide(dt){
  const nx=P.pos.x+P.vel.x*dt;
  const nz=P.pos.z+P.vel.z*dt;
  let ny=P.pos.y+P.vel.y*dt;
  const r=0.4; // 玩家半径
  /* 玩家可站立高度：P.pos.y 就是眼睛高度（1.6），
     所以身体占 [ny-1.6, ny] 这一段，而不是 [ny, ny+1.6]。
     以前写成 ny+1.6，等于把判定盒整段抬到头顶以上，
     站在地面板上时永远和「地面」这个碰撞体相交。 */
  const feetY=ny-1.6, headY=ny;
  // 地面
  P.onGround=false;              // 先假设离地，落地时再置 true
  if(ny<1.6){ ny=1.6; P.vel.y=0; P.onGround=true; }
  const canBlock=(m)=>{
    if(!m.geometry) return false;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) return false;
    const halfH=(bb.max.y-bb.min.y)/2;
    const top=m.position.y+halfH;
    /* 顶面低于脚下 35cm 的（地面、操场、走廊地板、马路）不参与侧面碰撞，
       否则站在地板上会被判定为「卡在实体内部」，分轴推进时每一帧都被推回原位。 */
    if(top < feetY+0.35) return false;
    return true;
  };
  /* 分轴推进：先试 X，再试 Z。
     整体一起判定的写法在角落里会把两轴一起弹回原位，
     表现就是「贴着墙走不动」甚至「一出生就动不了」。
     分轴的好处是被挡住时还能沿墙滑行，手感也顺。 */
  let px=P.pos.x, pz=P.pos.z;
  // ---- X 轴 ----
  let tx=nx, blockedX=false;
  for(const m of colliders){
    if(!canBlock(m)) continue;
    const bb=m.geometry.boundingBox;
    const halfW=(bb.max.x-bb.min.x)/2, halfD=(bb.max.z-bb.min.z)/2, halfH=(bb.max.y-bb.min.y)/2;
    const mx=m.position.x, mz=m.position.z, my=m.position.y;
    if(feetY < (my+halfH) && headY > (my-halfH)){
      if(tx>mx-halfW-r && tx<mx+halfW+r && pz>mz-halfD-r && pz<mz+halfD+r){
        tx = (tx>mx) ? (mx+halfW+r) : (mx-halfW-r);
        blockedX=true;
      }
    }
  }
  if(blockedX) P.vel.x=0;
  // ---- Z 轴 ----
  let tz=nz, blockedZ=false;
  for(const m of colliders){
    if(!canBlock(m)) continue;
    const bb=m.geometry.boundingBox;
    const halfW=(bb.max.x-bb.min.x)/2, halfD=(bb.max.z-bb.min.z)/2, halfH=(bb.max.y-bb.min.y)/2;
    const mx=m.position.x, mz=m.position.z, my=m.position.y;
    if(feetY < (my+halfH) && headY > (my-halfH)){
      if(tx>mx-halfW-r && tx<mx+halfW+r && tz>mz-halfD-r && tz<mz+halfD+r){
        tz = (tz>mz) ? (mz+halfD+r) : (mz-halfD-r);
        blockedZ=true;
      }
    }
  }
  if(blockedZ) P.vel.z=0;
  /* 兜底：数值异常时保持原位，绝不让 NaN 传染给下一帧 */
  if(!isFinite(tx)||!isFinite(tz)){ tx=P.pos.x; tz=P.pos.z; }
  P.pos.x=tx; P.pos.z=tz; P.pos.y=ny;
}

/* ============ d_game.js：敌人 AI + 物资 + 撤离 + 射击 ============ */
let enemyTick=0;

/* ---- 射击 ---- */
function fire(){
  if(P.reload) return;
  const t=P.inv.gun?'gun':'ammo';
  if(P.shootCd>0) return;
  if((P.ammo[t]||0)<=0){ sfxEmpty(); startReload(); return; }
  P.ammo[t]--;
  P.shootCd=P.inv.gun?0.12:0.18;
  P.shooting=true;
  sfxShoot();
  addShake(P.inv.gun?0.55:0.9);
  weaponKick();

  // 射线检测
  const dir=lookDir();
  const origin=camera.position.clone();
  const raycaster=new THREE.Raycaster(origin,dir,0.2,120);
  const hits=raycaster.intersectObjects(shootables,true);
  if(hits.length>0){
    const hit=hits[0];
    const obj=hit.object;
    // 命中敌人（body/head）
    for(const e of enemies){
      if(e.body===obj||e.head===obj){
        const dmg=P.inv.gun?34:10;
        e.hp-=dmg;
        e.aggro=true;
        if(obj===e.head) sfxHeadshot(); else sfxHit();
        if(e.hp<=0){ e.alive=false; e.body.visible=false; e.head.visible=false; sfxKill(); }
        break;
      }
    }
  }
  // 枪口火光（简单后续可扩展）
}

/* ---- 换弹 ---- */
function startReload(){
  if(P.reload||P.shootCd>0) return;
  P.reload=true; P.reloadT=1.2;
  sfxReload();
}
function updReload(dt){
  if(!P.reload) return;
  P.reloadT-=dt;
  if(P.reloadT<=0){
    P.reload=false;
    const t=P.inv.gun?'gun':'ammo';
    P.ammo[t]=P.inv.gun?30:120; // 上限
  }
}

/* ---- 受伤 ---- */
function damageP(n){
  if(P.armor>0){
    const a=Math.min(P.armor,n*.6);
    P.armor-=a; n-=a;
  }
  P.hp-=n;
  sfxHurt();
  if(P.hp<=0){ P.hp=0; onDeath(); }
}
function onDeath(){
  sfxDeath();
  const info=$('deathInfo'); if(info) info.textContent='击杀 '+(enemies.filter(e=>!e.alive).length)+' 名敌人 · 现金 ¥'+P.ammo.cash;
  const d=$('death'); if(d) d.style.display='flex';
}

/* ---- 敌人 AI ---- */
function updE(dt){
  if(P.shootCd>0) P.shootCd-=dt;
  if(P.reload) updReload(dt);
  if(P.shooting) P.shooting=false;

  enemyTick+=dt;
  while(enemyTick>=0.2){
    enemyTick-=0.2;
    for(const e of enemies){
      if(!e.alive){
        if(e.respawn>0) e.respawn-=1;
        continue;
      }
      // aggro 状态朝玩家移动，否则巡逻（原地小幅晃动）
      const dx=P.pos.x-e.x, dz=P.pos.z-e.z;
      const dist=Math.hypot(dx,dz);
      if(dist<18){ e.aggro=true; }
      if(e.aggro){
        const spd=e.speed;
        if(dist>1.5){
          e.x+=dx/dist*spd*0.2;
          e.z+=dz/dist*spd*0.2;
          e.body.rotation.y=Math.atan2(dx,dz);
        }
        // 攻击
        if(dist<3 && e.atkCd<=0){
          damageP(8+e.speed*0); e.atkCd=1.0;
        }
      }
      if(e.atkCd>0) e.atkCd-=0.2;
      // 同步 mesh 位置
      e.body.position.set(e.x,0.85,e.z);
      e.head.position.set(e.x,1.7,e.z);
    }
  }
  // 复活的敌人（respawn 计数器用 0.2s 节拍，这里简单延迟重生）
  for(const e of enemies){
    if(e.alive||e.respawn<=0) continue;
    e.respawn-=0.2;
    if(e.respawn<=0){ respawnEnemy(e); }
  }
}
function respawnEnemy(e){
  e.alive=true; e.hp=100; e.aggro=false;
  e.body.visible=true; e.head.visible=true;
  e.respawn=0;
}

/* ---- 物资拾取 ---- */
function updLoot(dt){
  for(const l of loots){
    if(l.taken) continue;
    const d=Math.hypot(P.pos.x-l.x,P.pos.z-l.z);
    if(d<1.5){
      l.taken=true; l.mesh.visible=false;
      switch(l.type){
        case 'ammo': P.ammo.ammo+=30; break;
        case 'med':  P.inv.med++; break;
        case 'cash': P.ammo.cash+=200; break;
        case 'gun':  P.inv.gun=true; P.ammo.gun=120; break;
      }
      sfxPickup();
      refreshHUD();
    }
  }
}

/* ---- 撤离判定 ---- */
let exfiled=false;
function checkExfil(){
  if(!exfil||exfiled) return;
  const d=Math.hypot(P.pos.x-exfil.x,P.pos.z-exfil.z);
  if(d<3){
    exfiled=true;
    sfxExfil();
    toast('✅ 成功撤离！');

    const h=$('death'); if(h) h.style.display='flex';
    const h2=h&&h.querySelector('h2'); if(h2) h2.textContent='✅ 撤离成功';
  }
}

/* ============ e_io.js：加密存档（PBKDF2 + AES-GCM + FNV-1a） ============ */
const MAGIC='EFSFPS';

function fnv1a(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=(h*0x01000193)>>>0;
  }
  return h.toString(16).padStart(8,'0');
}

function buf2b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64){ return Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); }

async function importKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},
    km,
    {name:'AES-GCM',length:256},
    false,
    ['encrypt','decrypt']
  );
}

async function encryptSave(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const json=JSON.stringify(obj);
  const key=await importKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(json));
  return MAGIC+'.'+buf2b64(salt)+'.'+buf2b64(iv)+'.'+buf2b64(ct);
}

async function decryptSave(str,pw){
  const parts=str.split('.');
  if(parts.length!==4||parts[0]!==MAGIC) throw new Error('格式错误');
  const salt=b642buf(parts[1]);
  const iv=b642buf(parts[2]);
  const ct=b642buf(parts[3]);
  const key=await importKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function exportSave(){
  const obj={hp:P.hp,armor:P.armor,ammo:P.ammo,inv:P.inv,cash:P.ammo.cash,pos:[P.pos.x,P.pos.z]};
  const pw=prompt('设置存档密码：');
  if(!pw) return;
  encryptSave(obj,pw).then(s=>{
    const t=$('savebox'); if(!t) return;
    t.value=s; t.style.display='block';
    t.select(); document.execCommand('copy');
    alert('已加密并复制到剪贴板');
  });
}
function importSave(){
  const s=prompt('粘贴存档串：');
  if(!s) return;
  const pw=prompt('输入存档密码：');
  if(!pw) return;
  decryptSave(s,pw).then(o=>{
    P.hp=o.hp; P.armor=o.armor; P.ammo=o.ammo; P.inv=o.inv;
    P.pos.set(o.pos[0],1.6,o.pos[1]);
    refreshHUD();
    alert('存档已恢复');
  }).catch(e=>{
    alert('解密失败：'+e.message);
  });
}

/* ---- 主菜单 / 开始 / 结束按钮 ---- */
/* 显示摇杆和操作按钮。
   【不要再依赖触摸检测】原来写了 if(!isTouch) return;
   而 isTouch 来自 'ontouchstart' in window || navigator.maxTouchPoints>0。
   某些 Android WebView / 内置浏览器里这两个值都拿不到（或为 0），
   于是这段直接 return，#joyZone 永远停在 CSS 的 display:none，
   display:none 的元素收不到任何事件 —— 手怎么拖都没反应。
   反正桌面端本来也有鼠标拖拽摇杆的兜底，所以干脆无条件显示。 */
function showTouchUI(){
  const jz=$('joyZone'); if(jz) jz.style.display='block';
  const az=$('actZone'); if(az) az.style.display='block';
  window.__joyEnabled=true;   // 允许 document 兜底监听接管左半屏
  const tip=$('htip'); if(tip) tip.textContent='📱 右半屏拖动转视角 · 左摇杆移动 · 右下按钮作战';
}
/* 主菜单/死亡界面时把摇杆和操作按钮收起来。
   之前 #joyZone 是常驻 display:block，层级还压在菜单之上，
   于是主界面也能看到一个摇杆，很碍事。 */
function hideTouchUI(){
  const jz=$('joyZone'); if(jz) jz.style.display='none';
  const az=$('actZone'); if(az) az.style.display='none';
  window.__joyEnabled=false;
  if(window.__joyTouch) window.__joyTouch.active=false;
}
function bindUI(){
  hideTouchUI();   // 一进页面就是主菜单，摇杆/操作按钮先收起来
  const start=$('btnPlay'); if(start) start.onclick=()=>{ $('menu').style.display='none'; audioInit(); audioResume(); sfxUI(); showTouchUI(); init(); };
  const respawn=$('btnRespawn'); if(respawn) respawn.onclick=()=>{ location.reload(); };
  const deathMenu=$('btnDeathMenu'); if(deathMenu) deathMenu.onclick=()=>{ location.reload(); };
  const shopBtn=$('btnShop'); if(shopBtn) shopBtn.onclick=()=>{ toggleShop(); };
  // 音效开关
  const sndBtn=$('sndBtn');
  if(sndBtn) sndBtn.onclick=(ev)=>{
    ev.stopPropagation();
    sfxOn=!sfxOn;
    if(masterGain) masterGain.gain.value=sfxOn?VOL.master:0;
    $('sndTxt').textContent=sfxOn?'开':'关';
    sndBtn.firstChild.textContent=sfxOn?'🔊 ':'🔇 ';
    if(sfxOn) sfxUI();
  };
  const exportBtn=$('btnExport'); if(exportBtn) exportBtn.onclick=exportSave;
  const importBtn=$('btnImport'); if(importBtn) importBtn.onclick=importSave;
  const resetBtn=$('btnReset'); if(resetBtn) resetBtn.onclick=()=>{ if(confirm('确认重置所有数据？')) location.reload(); };
  const backBtn=$('btnBack'); if(backBtn) backBtn.onclick=()=>{ location.href='../'; };

  // 键盘
  addEventListener('keydown',e=>{
    P.keys[e.code]=true;
    if(e.code==='Space'||e.code==='KeyR'||e.code==='KeyQ'||e.code==='KeyE') e.preventDefault();
    if(e.code==='KeyR') startReload();
    if(e.code==='KeyQ') toggleShop();
    if(e.code==='KeyE') interact();
    if(e.code==='Space'&&!e.repeat) doJump();
    if(e.code==='Escape') $('shop').style.display='none';
  });
  addEventListener('keyup',e=>{ P.keys[e.code]=false; });
  addEventListener('mousedown',e=>{
    if(e.button===0 && ready) fire();
  });

  // 指针锁定视角
  const cv=$('c');
  let dragging=false, lx=0, ly=0, locked=false;
  cv.addEventListener('mousedown',e=>{
    if(!ready) return;
    dragging=true; lx=e.clientX; ly=e.clientY;
    // 只有左键/中键才请求锁定，避免右键菜单干扰
    if(!locked && cv.requestPointerLock) cv.requestPointerLock();
  });
  document.addEventListener('pointerlockchange',()=>{
    locked=(document.pointerLockElement===cv);
    document.body.classList.toggle('locked',locked);
  });
  addEventListener('mouseup',()=>{ dragging=false; });
  addEventListener('mousemove',e=>{
    // 锁定态优先用 movementX/Y（clientX 在锁定下是冻结的）
    if(locked){
      const dx=e.movementX||0, dy=e.movementY||0;
      if(dx===0&&dy===0) return;
      P.yaw-=dx*0.0025;
      P.pitch-=dy*0.0025;
    }else{
      if(!dragging) return;
      P.yaw-=(e.clientX-lx)*0.003;
      P.pitch-=(e.clientY-ly)*0.003;
      lx=e.clientX; ly=e.clientY;
    }
    const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
  });

  /* 触屏摇杆：只用 touch 事件。
     【为什么不用 pointer】pointerdown/pointermove 与 touchstart/touchmove
     同时绑在同一个元素上时，两者会互相打架：
     pointerdown 先跑并把 jId 赋值，接着 touchstart 看到 jId!==null 直接 return，
     而 pointermove 又因为设备上 pointerId 配对异常被 if 挡掉，
     结果两套事件都「启动了」，但没有任何一套真正更新 P.joyX，
     表现就是摇杆能显示、能跟随手指，玩家却一动不动。
     这里只保留 touch 事件，逻辑单一，不再有配对问题。 */
  const joyZone=$('joyZone'), joyBase=$('joyBase'), joyStick=$('joyStick');
  if(joyZone&&joyBase&&joyStick){
    let activeId=null, sx=0, sy=0;

    /* 【真凶就在这里】原来 startJoy 每次都无条件执行 sx=cx;sy=cy;
       浏览器只要多发一次 touchstart（手指轻微抖动、WebView 重新派发、
       或者 #joyZone 被反复 touchstart），起点就被刷新成「当前点」，
       于是接下来的 touchmove 里 dx=cx-sx 恒等于 0，
       moveJoy 被调用了 134 次、joyX 却永远是 0.00，pos 永远 0.0,5.0。
       修法：只有「当前没有活动触点」时才记录起点，
       已经在拖时再收到 touchstart 一律忽略。 */
    const startJoy=(cx,cy)=>{
      if(activeId!==null){          // 已经在拖了，绝不重置起点
        window.__evtStart=(window.__evtStart||0)+1;
        return;
      }
      sx=cx; sy=cy;
      activeId=1;
      window.__evtStart=(window.__evtStart||0)+1;
      window.__lastStart=[cx|0,cy|0];
      /* 摇杆放在按下位置，用 translate(-50%,-50%) 精确居中 */
      joyBase.style.left=cx+'px';
      joyBase.style.top=cy+'px';
      joyBase.style.display='block';
      joyStick.style.transform='translate(-50%,-50%)';
      P.joyX=0; P.joyY=0;
      window.__joyTouch={ active:true, sx:cx, sy:cy, cx:cx, cy:cy };
    };

    const moveJoy=(cx,cy)=>{
      window.__evtMove=(window.__evtMove||0)+1;
      window.__lastMove=[cx|0,cy|0];
      let dx=cx-sx, dy=cy-sy;
      const max=48, d=Math.hypot(dx,dy);
      if(d>max){ dx*=max/d; dy*=max/d; }
      joyStick.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
      /* 死区 2px：手指轻微抖动不算推杆，但门限不能太大，
         否则手感会发黏。超过门限按比例输出 -1~1。 */
      if(d>2){ P.joyX=dx/max; P.joyY=dy/max; }
      else { P.joyX=0; P.joyY=0; }
      if(window.__joyTouch){ window.__joyTouch.cx=cx; window.__joyTouch.cy=cy; window.__joyTouch.active=true; }
    };

    const endJoy=()=>{
      activeId=null; P.joyX=0; P.joyY=0;
      if(window.__joyTouch) window.__joyTouch.active=false;
      joyStick.style.transform='translate(-50%,-50%)';
      /* 松开后回到常驻位置（左下角），而不是隐藏——
         常驻可见才能一眼确认摇杆是否真的在工作。 */
      joyBase.style.left='110px';
      joyBase.style.top='calc(100% - 110px)';
    };

    joyZone.addEventListener('touchstart',e=>{
      /* 已经在拖时不再重置起点（见上面 startJoy 的说明） */
      const t=e.changedTouches[0]; if(!t) return;
      startJoy(t.clientX,t.clientY);
      const tip=$('htip');
      if(tip){ tip.classList.remove('hide'); tip.textContent='🎮 摇杆已激活 · 拖动移动'; }
      e.preventDefault();
    }, {passive:false});
    joyZone.addEventListener('touchmove',e=>{
      if(activeId===null) return;
      const t=e.changedTouches[0]; if(!t) return;
      moveJoy(t.clientX,t.clientY);
      e.preventDefault();
    }, {passive:false});
    /* 【按住期间被系统吞掉 touchend 的兜底】
       如果 WebView 在手指仍按着时发了 touchend、却没有后续 touchstart，
       会出现「手指仍在动、却收不到 move」的僵死状态。
       用一个定时器在 touchend 后 250ms 检查：期间没有任何 move，
       才真正结束摇杆，否则把它当作误报忽略。 */
    let endTimer=null;
    const softEnd=()=>{
      if(endTimer) clearTimeout(endTimer);
      const t0=window.__joyTouch?window.__joyTouch.t0:0;
      const mv=window.__evtMove||0;
      endTimer=setTimeout(()=>{
        if((window.__evtMove||0)!==mv && Date.now()-(window.__joyTouch.t0||0)<2000){
          // 期间还有 move，说明是误报的 touchend，保持按住状态
          return;
        }
        endJoy();
      }, 250);
    };
    joyZone.addEventListener('touchend',e=>{ softEnd(); },{passive:true});
    joyZone.addEventListener('touchcancel',e=>{ endJoy(); },{passive:true});
    /* 【全局兜底】有些 WebView 里 #joyZone 的 touch 事件会被
       其它覆盖层吃掉（canvas、#grade、#grain、甚至系统手势区）。
       这里在 document 上再挂一份：只要触点落在左半屏、
       且当前没有摇杆在拖，就照样启动摇杆。
       优先走 #joyZone 的正常路径，它没收到才由这里接手。 */
    document.addEventListener('touchstart',e=>{
      if(activeId!==null) return;
      if(!window.__joyEnabled) return;    // 还没进游戏（菜单界面）不接管
      const t=e.changedTouches[0]; if(!t) return;
      if(t.clientX > window.innerWidth*0.5) return;   // 右半屏归视角
      startJoy(t.clientX,t.clientY);
    }, {passive:true});
    document.addEventListener('touchmove',e=>{
      if(activeId===null) return;
      const t=e.changedTouches[0]; if(!t) return;
      moveJoy(t.clientX,t.clientY);
    }, {passive:true});
    document.addEventListener('touchend',e=>{
      if(activeId===null) return;
      softEnd();
    }, {passive:true});

    /* 桌面调试用：鼠标拖左半屏也能触发摇杆，方便在电脑上验证移动逻辑 */
    joyZone.addEventListener('mousedown',e=>{
      if(activeId!==null) return;
      startJoy(e.clientX,e.clientY);
      const mv=ev=>moveJoy(ev.clientX,ev.clientY);
      const up=()=>{ endJoy(); removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
      addEventListener('mousemove',mv); addEventListener('mouseup',up);
      e.preventDefault();
    });
  }

  // 移动端操作按钮
  const fireBtn=$('btnFire'); if(fireBtn){ fireBtn.addEventListener('touchstart',e=>{ if(ready) fire(); e.preventDefault(); }); }
  const jumpBtn=$('btnJump'); if(jumpBtn){ jumpBtn.addEventListener('touchstart',e=>{ if(ready) doJump(); e.preventDefault(); }); }
  const reloadBtn=$('btnReload'); if(reloadBtn){ reloadBtn.addEventListener('touchstart',e=>{ startReload(); e.preventDefault(); }); }
  const sprintBtn=$('btnSprint'); if(sprintBtn){
    sprintBtn.addEventListener('touchstart',e=>{ P.sprinting=true; e.preventDefault(); });
    sprintBtn.addEventListener('touchend',()=>{ P.sprinting=false; });
  }
  const interactBtn=$('btnInteract'); if(interactBtn){ interactBtn.addEventListener('touchstart',e=>{ interact(); e.preventDefault(); }); }
/* 开镜：改成「切换」模式。
     以前是按住生效，手机上一个手指要一直压着开镜键，
     根本没法同时用摇杆移动、也没法开火 —— 手感完全不可用。
     现在点一下开镜、再点一下关闭，状态机单一，不会出现
     touchstart 触发 pointerdown 又触发 pointerleave 导致反复开关。 */
  const aimBtn=$('btnAim');
  const setAim=(on)=>{
    P.aiming=!!on;
    if(aimBtn){
      if(P.aiming) aimBtn.classList.add('active');
      else aimBtn.classList.remove('active');
    }
    const tip=$('htip');
    if(tip) tip.textContent = P.aiming ? '🔭 开镜中 · 再点一次退出' : '📱 右半屏拖动转视角 · 左摇杆移动 · 右下按钮作战';
  };
  if(aimBtn){
    const toggle=(e)=>{
      setAim(!P.aiming);
      if(e&&e.preventDefault) e.preventDefault();
      if(e&&e.stopPropagation) e.stopPropagation();
    };
    aimBtn.addEventListener('touchstart',toggle,{passive:false});
    /* 桌面/鼠标调试用；pointerup 之类不再参与，避免同一次点击被处理两遍 */
    aimBtn.addEventListener('mousedown',e=>{ if(e.button===0) toggle(e); });
    /* 换弹时自动退出开镜，否则换弹动画和 FOV 会互相打架 */
  }
  window.__setAim=setAim;
  // 键盘右键也可开镜（桌面端，按住式）
  addEventListener('mousedown',e=>{ if(e.button===2&&ready){ if(window.__setAim) window.__setAim(true); } });
  addEventListener('mouseup',e=>{ if(e.button===2){ if(window.__setAim) window.__setAim(false); } });

  // 触屏视角拖拽（屏幕右半区，整屏监听，不依赖按钮）
  const viewLayer=$('viewLayer');
  if(viewLayer){
    /* 视角拖拽：只用「第一个落在右半屏的触点」。
       以前按 identifier 严格配对，WebView 里 identifier 偶尔会对不上，
       表现就是视角偶尔卡住。现在改成记录一个独立标记，
       touchend 时检查是不是自己那根手指（位置配对容错更大）。 */
    let vx=0, vy=0, vOn=false;
    viewLayer.addEventListener('touchstart',e=>{
      if(vOn) return;
      const t=e.changedTouches[0]; if(!t) return;
      vOn=true; vx=t.clientX; vy=t.clientY;
    }, {passive:true});
    viewLayer.addEventListener('touchmove',e=>{
      if(!vOn) return;
      const t=e.changedTouches[0]; if(!t) return;
      P.yaw-=(t.clientX-vx)*0.005;
      P.pitch-=(t.clientY-vy)*0.005;
      const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
      vx=t.clientX; vy=t.clientY;
    }, {passive:true});
    viewLayer.addEventListener('touchend',()=>{ vOn=false; }, {passive:true});
    viewLayer.addEventListener('touchcancel',()=>{ vOn=false; }, {passive:true});
  }
}

   【必须在这里声明】本项目所有分块被打包进同一个 <script type="module">，

/* 根据当前武器切换显示 */
function syncWeapon(){

  const hasGun=!!(P&&P.inv&&P.inv.gun);
  wsk.pistol.visible=!hasGun;
  wsk.rifle.visible=hasGun;
}

/* 每帧更新：走路晃动 + 后坐力回弹 + 换弹动作 + 奔跑收枪 */
function updWeapon(dt){
  if(!weaponRoot||!wsk) return;

  // 想用的枪
  const wantRifle=!!(P&&P.inv&&P.inv.gun);
  if(wsk.rifle.visible!==wantRifle) syncWeapon();

  const spd=Math.hypot(P.vel.x,P.vel.z);
  const moving=spd>0.5&&P.onGround;
  const sprinting=P.sprinting&&moving;

  // 平滑过渡系数（避免姿态突变）
  const k=Math.min(1,dt*10);
  wSprint = wSprint===undefined?0:wSprint+( (sprinting?1:0) - wSprint )*k;
  wAds = wAds===undefined?0:wAds;

  // 走路晃动：冲刺时频率和幅度都加大
  wBobT+=dt*(moving?spd*(sprinting?2.1:1.6):0);
  const bobAmt=moving?Math.min(spd/10,1):0;
  const bobScale=sprinting?1.85:1;
  const bobX=Math.sin(wBobT)*0.012*bobAmt*bobScale;
  const bobY=Math.abs(Math.cos(wBobT))*0.010*bobAmt*bobScale;

  // 开火后坐力衰减
  if(wRecoil>0) wRecoil=Math.max(0,wRecoil-dt*6);
  // 换弹下沉
  const reloadDip=P.reload?0.09:0;
  const reloadRot=P.reload?0.5:0;

  // ===== 奔跑姿态：枪身放低、向内倾斜、上下颠 =====
  // 右手枪判断（冲刺时把枪压低并向左收）
  const s=wSprint;
  const bobRun=Math.sin(wBobT*1.0)*0.028*s;

  weaponRoot.position.x=(0.19+bobX) - 0.055*s;
  weaponRoot.position.y=(-0.17-bobY-wRecoil*0.03-reloadDip) - 0.075*s + bobRun;
  weaponRoot.position.z=(-0.38+wRecoil*0.06) + 0.055*s;

  // 奔跑时枪口朝左下压，形成「抱着枪跑」的观感
  weaponRoot.rotation.x=wRecoil*0.16 + reloadRot*0.35 + 0.42*s;
  weaponRoot.rotation.z=Math.sin(wBobT*0.5)*0.02*bobAmt + reloadRot*0.25 + 0.30*s;
  weaponRoot.rotation.y=(P.reload?0.3:0) + 0.22*s;
}

/* 开火时调用：给模型加后坐 */
function weaponKick(){ wRecoil=Math.min(1.2,wRecoil+0.85); }

/* ============ y_audio.js：Web Audio 合成音效（零素材、零依赖） ============ */
let AC=null, masterGain=null, sfxOn=true, noiseBuf=null;
const VOL={ master:0.55, shot:0.42, reload:0.3, hit:0.35, hurt:0.4, pickup:0.35, step:0.12, ui:0.25, ambient:0.16 };

function audioInit(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();
    masterGain.gain.value=VOL.master;
    masterGain.connect(AC.destination);
    // 预生成 1 秒白噪声缓冲（枪声/脚步/爆炸复用）
    const len=AC.sampleRate;
    noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    startAmbient();
  }catch(e){ console.warn('audio init failed',e); AC=null; }
  return AC;
}
// 移动端需要用户手势才能解锁音频
function audioResume(){ if(AC&&AC.state==='suspended') AC.resume(); }

/* ---- 基础合成器 ---- */
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||!sfxOn) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.3,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,delay){
  if(!AC||!sfxOn||!noiseBuf) return;
  const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const g=AC.createGain(), f=AC.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(6000,t0);
  f.frequency.exponentialRampToValueAtTime(400,t0+dur);
  g.gain.setValueAtTime(vol||0.3,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t0); s.stop(t0+dur+0.02);
}

/* ---- 环境音：低频风噪，营造氛围 ---- */
function startAmbient(){
  if(!AC||!noiseBuf) return;
  try{
    const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320;
    const g=AC.createGain(); g.gain.value=VOL.ambient;
    s.connect(f); f.connect(g); g.connect(masterGain); s.start();
  }catch(e){}
}

/* ---- 脚步节流 ---- */
let stepT=0;
function updAudio(dt){
  if(!AC||!P.alive) return;
  if(!P.onGround) return;
  const sp=Math.hypot(P.vel.x,P.vel.z);
  if(sp>1.2){
    stepT-=dt*(sp/6);
    if(stepT<=0){ sfxStep(); stepT=0.42; }
  }
}

/* ============ z_render.js：渲染循环 + 启动 ============ */

/* 安全调用：单个子系统抛错时只记一次日志，不中断整帧 */
const __errOnce={};
function safeCall(fn,arg){
  if(typeof fn!=='function') return;
  try{ fn(arg); }
  catch(e){
    const k=fn.name||'anon';
    /* 把最后一次错误暴露到调试面板上：
       如果 updP 每帧都抛错，玩家当然一动不动，
       而以前这个异常只在控制台里，屏幕上完全看不出来。 */
    window.__lastErr=k+':'+(e&&e.message?e.message.slice(0,40):'?');
    if(!__errOnce[k]){ __errOnce[k]=true; console.error('['+k+'] 出错（后续同类错误已静音）：',e); }
  }
}

/* ---- 相机抖动 / 后坐力（学自 saltline 的衰减双频正弦） ---- */
const shake={ t:0, power:0, active:false };
function addShake(power){ shake.power=Math.max(shake.power, power); shake.t=0; shake.active=true; }
function updShake(dt){
  if(!shake.active) return 0;
  shake.t+=dt;
  if(shake.t>0.9){ shake.active=false; shake.power=0; return 0; }
  // 衰减包络 × 双频正弦叠加（避免机械感）
  return shake.power*Math.exp(-shake.t*5)*(0.55+0.45*Math.sin(shake.t*47)*Math.sin(shake.t*13+1))*0.04;
}

/* ---- 像素预算制分辨率（学自 saltline：锁像素总数而非固定倍率） ---- */
const PIXEL_BUDGET=2300000; // 约 high 档
let curPixelScale=1;
function applyPixelBudget(){
  if(typeof renderer==='undefined'||!renderer) return;
  const w=Math.max(2,window.innerWidth), h=Math.max(2,window.innerHeight);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const pixels=w*dpr*h*dpr;
  let scale=1;
  if(pixels>PIXEL_BUDGET) scale=Math.sqrt(PIXEL_BUDGET/pixels);
  if(Math.abs(scale-curPixelScale)>0.01){
    curPixelScale=scale;
    renderer.setPixelRatio(dpr*scale);
    /* 第 3 个参数必须为 true：要同时更新 canvas 的 CSS 尺寸。
       传 false 只改绘制缓冲区，样式尺寸还是旧的，
       移动端高 DPR 下会被拉伸/错位，严重时看起来像整屏发黑。 */
    renderer.setSize(w,h,true);
  }
}

function safeShake(dt){
  try{ return updShake(dt)||0; }catch(e){ return 0; }
}

function animate(){
  requestAnimationFrame(animate);
  if(!ready) return;
  const dt=Math.min(clock.getDelta(),0.05);
  /* 心跳统计：如果 frames 不涨，说明 animate 根本没在跑
     （WebView 后台、异常中断、或 ready 一直为 false），
     这是「怎么拖都不动」的另一种可能原因，直接显示出来好判断。 */
  window.__frames=(window.__frames||0)+1;
  window.__lastDt=dt;
  window.__fps=Math.round(1/Math.max(dt,0.001));

  /* 每个子系统单独兜底：任何一个抛错都不能拖垮渲染循环，
     否则会出现「场景/枪/人物全黑」这种整屏停摆。 */
  safeCall(updP,dt); safeCall(updE,dt); safeCall(updLoot,dt);
  safeCall(checkExfil); safeCall(updAudio,dt); safeCall(updWeapon,dt);

  // 相机抖动叠加（基准位置由 updP 写入）
  const sh=safeShake(dt);
  if(sh!==0){
    camera.position.x+=(Math.random()-0.5)*sh;
    camera.position.y+=(Math.random()-0.5)*sh;
  }

  refreshHUD();
  /* 渲染放在 try 里：万一某帧的子步骤抛错，
     用纯场景渲染兜底，绝不让画面停在全黑上等下一帧。 */
  try{
    renderer.render(scene,camera);
  }catch(e){
    if(!window.__renderErrShown){ window.__renderErrShown=true; console.error('render error',e); }
  }
}

// 窗口尺寸变化时重算像素预算
window.addEventListener('resize',()=>{ if(ready) applyPixelBudget(); });

// 启动：渲染循环立即开始（init 成功后 ready=true 才会真正渲染）
requestAnimationFrame(animate);
</script>
</body>
</html>
