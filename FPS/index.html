  if(window.__joyTouch) window.__joyTouch.active=false;
}
function bindUI(){
  /* 【幂等保护】bindUI 里注册了大量 addEventListener，
     一旦被执行两次，每个 handler 就挂了两份：
     视角每帧的位移会被算两遍（灵敏度直接翻倍）、
     摇杆的移动也会叠两次。
     这正是「两个单独用没问题、一起用灵敏度爆炸」的放大器：
     真实设备上 DOMContentLoaded 与直接调用、或某些 WebView 重复派发，
     都可能触发二次执行。
     用标志位保证只跑一次。 */
if(window.__uiBound) return; window.__uiBound=true;
  /* 【GM 面板的初始化不放在这里】
     这个函数在 <script> 执行到 f_ui.js 时就会跑（文档已经 ready），
     而 initGM 定义在后面的 x_ext.js 里 —— 那一刻它还不存在，
     这里的 typeof 检查会静默跳过，导致面板永远绑不上按钮。
     现在由 z_render.js 末尾的启动段负责调用 initGM()。 */
  bindDoorHint();   // 门提示条点击交互（手机端没有键盘）
  initInputModeDetect();   // 键盘/触摸自动切换触摸按键

  hideTouchUI();   // 一进页面就是主菜单，摇杆/操作按钮先收起来

  /* ===== 多指触控工具（bindUI 顶层，摇杆和视角层共用） =====
     【多指 bug 的核心修复】
     旧实现到处用 e.changedTouches[0] 取触点：
     当「左手推摇杆 + 右手转视角」时，一次 touchmove 会同时派发到
     #joyZone 和 #viewLayer 两个处理函数，而 changedTouches 里
     装的往往是**另一根手指**。结果：
       - 摇杆把手腕的横移当成推杆 → 方向乱跳
       - 视角把摇杆的位移当成转角 → 一点就飞（灵敏度「爆炸」）
     表现就是「单独用没问题，两个一起用灵敏度超级高」。
     所以必须做 identifier 配对：谁认领了哪根手指，就只认那一根。 */

  /* 在 TouchList 里按 identifier 找触点 */
  const findTouch=(e,tid)=>{
    if(!e||tid===null||tid===undefined) return null;
    const lists=[e.changedTouches, e.touches];
    for(const list of lists){
      if(!list) continue;
      for(let i=0;i<list.length;i++){
        if(list[i] && list[i].identifier===tid) return list[i];
      }
    }
    return null;
  };
  /* 某个 identifier 是否在这次变更里被抬起 */
  const hasTouch=(list,tid)=>{
    if(!list||tid===null||tid===undefined) return false;
    for(let i=0;i<list.length;i++){
      if(list[i] && list[i].identifier===tid) return true;
    }
    return false;
  };
  /* 摇杆当前锁定的触点 identifier（null = 没有手指在推摇杆） */
  let joyTid=null;


  /* 【横屏支持】屏幕旋转时立即重算：
       1) 画布尺寸与像素预算（applyPixelBudget 里同时修正相机 aspect）
       2) 摇杆区域占比（横屏时左侧给摇杆 42%，其余归视角拖拽）
     有些 WebView 在旋转时 resize 事件晚于真实尺寸变化，
     所以 orientationchange 之后再补两次延迟调用，确保拿到最终尺寸。 */
  const relayout=()=>{
    if(window.__relayout) window.__relayout();
    if(typeof applyPixelBudget==='function' && ready) { try{ applyPixelBudget(); }catch(e){} }
  };
  window.addEventListener('resize',()=>{ relayout(); setTimeout(relayout,120); });
  window.addEventListener('orientationchange',()=>{ setTimeout(relayout,180); setTimeout(relayout,420); });
  relayout();
  const start=$('btnPlay'); if(start) start.onclick=()=>{
    $('menu').style.display='none';
    audioInit(); audioResume(); sfxUI();
    /* 进局了：置标记，然后按当前输入方式决定显示摇杆还是纯键盘。
       注意 init() 必须保留 —— 它负责建场景、生成敌人和武器。 */
    window.__inGame=true;
    init();
    applyInputMode(inputMode, true);
  };
  const respawn=$('btnRespawn'); if(respawn) respawn.onclick=()=>{ location.reload(); };
  const deathMenu=$('btnDeathMenu'); if(deathMenu) deathMenu.onclick=()=>{ location.reload(); };
  const shopBtn=$('btnShop'); if(shopBtn) shopBtn.onclick=()=>{ toggleShop(); };
  const stashBtn=$('btnStash'); if(stashBtn) stashBtn.onclick=()=>{ sfxUI(); toggleStash(); };
  /* 【局内背包入口】HUD 右上角的「🎒 背包」可直接点开 */
  const bagBtn=$('bagBtn');
  if(bagBtn) bagBtn.onclick=(ev)=>{ ev.stopPropagation(); sfxUI(); toggleBag(); };
  // 音效开关
  const sndBtn=$('sndBtn');
  if(sndBtn) sndBtn.onclick=(ev)=>{
    ev.stopPropagation();
    sfxOn=!sfxOn;
    if(masterGain) masterGain.gain.value=sfxOn?VOL.master:0;
    $('sndTxt').textContent=sfxOn?'开':'关';
    sndBtn.firstChild.textContent=sfxOn?'🔊 ':'🔇 ';
    if(sfxOn) sfxUI();
  };
  const exportBtn=$('btnExport'); if(exportBtn) exportBtn.onclick=exportSave;
  const importBtn=$('btnImport'); if(importBtn) importBtn.onclick=importSave;
  const resetBtn=$('btnReset'); if(resetBtn) resetBtn.onclick=()=>{ if(confirm('确认重置所有数据？')) location.reload(); };
  const backBtn=$('btnBack'); if(backBtn) backBtn.onclick=()=>{ location.href='../'; };

  /* ===== 键盘映射（按用户指定）=====
       W A S D    移动
       E          互动 / 开门
       鼠标左键    开火        （在下面的 mousedown 里）
       鼠标右键    瞄准        （在下面的 mousedown/mouseup 里）
       Shift      趴下        （左右 Shift 都可以）
       右 Shift   趴下        （同上）
       Space      跳跃
       Ctrl+W     奔跑
       R          换弹
       B / Tab    背包
       Q          商店
       Esc        关闭面板
   ============================== */
  addEventListener('keydown',e=>{
    P.keys[e.code]=true;

    /* Ctrl+W 奔跑：以前 Ctrl 被拿来做「趴下」，和奔跑冲突；
       现在趴下给 Shift，Ctrl 只负责奔跑。
       注意浏览器里 Ctrl+W 是关闭标签页的快捷键，这里必须 preventDefault
       拦下来，否则玩家一按就把页面关了。 */
    if(e.code==='KeyW' && (e.ctrlKey||e.metaKey)){
      e.preventDefault();
      P.sprinting=true;
      return;
    }

    if(e.code==='Space'||e.code==='KeyR'||e.code==='KeyQ'||e.code==='KeyE'||e.code==='KeyB'||e.code==='Tab') e.preventDefault();
    if(e.code==='KeyR') startReload();
    if(e.code==='KeyQ') toggleShop();
    if(e.code==='KeyE') interact();
    /* 背包：B 或 Tab 打开/关闭 */
    if(e.code==='KeyB'||e.code==='Tab'){ if(!e.repeat) toggleBag(); }
    if(e.code==='Space'&&!e.repeat) doJump();
    /* 趴下：Shift（左右都行），切换式 */
    if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat) toggleProne();
    /* 数字键 1/2/3 = 主武器 / 手枪 / 副武器（和底部切换条一一对应） */
    if(e.code==='Digit1'&&!e.repeat) switchSlot('primary');
    if(e.code==='Digit2'&&!e.repeat) switchSlot('secondary');
    if(e.code==='Digit3'&&!e.repeat) switchSlot('melee');
    /* F = 检视当前武器（看皮肤/看刀型）。
       用 !e.repeat 避免长按 F 每帧都重新触发一次。 */
    if(e.code==='KeyF'&&!e.repeat){ if(typeof startInspect==='function') startInspect(); }
    /* 主菜单连点 D 15 次解锁 GM 面板。
       游戏里按 D 是向右走，gmHitD 内部会先判断菜单是否可见，
       所以不会误触。 */
    if(e.code==='KeyD'&&!e.repeat){ if(typeof gmHitD==='function') gmHitD(); }
    /* X = 循环切枪，懒得记槽位时用 */
    if(e.code==='KeyX'&&!e.repeat) cycleSlot();
    if(e.code==='Escape'){ $('shop').style.display='none'; $('bag').style.display='none'; }
  });
  addEventListener('keyup',e=>{
    P.keys[e.code]=false;
    /* 松开 W 或 Ctrl 就停止奔跑 */
    if(e.code==='KeyW'||e.code==='ControlLeft'||e.code==='ControlRight') P.sprinting=false;
  });
  /* 失焦时清空所有按键，否则切出去再回来会「自己一直走」 */
  addEventListener('blur',()=>{
    P.keys={};
    P.sprinting=false;
    P.firing=false;      // 切出去必须松开扳机，否则回来就是满屏弹壳
    if(typeof endJoy==='function'){ try{ endJoy(); }catch(err){} }
  });
  /* 左键：按住不放记为 P.firing，松开才算停。
     全自动枪的连发不在这个事件里循环，而是由 updFireHold
     在主循环里每帧检查 —— 事件只负责「扳机是否被按住」。
     半自动/栓动/泵动虽然也会把 P.firing 置真，
     但 updFireHold 会直接 return（curIsAuto() 为假），
     所以它们仍然只能靠重新点击开火。 */
  addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    if(!ready) return;
    P.firing=true;
    fire();                          // 按下立刻先打一发，不能等下一帧
  });
  addEventListener('mouseup',e=>{
    if(e.button!==0) return;
    P.firing=false;
  });

  // 指针锁定视角
  const cv=$('c');
  let dragging=false, lx=0, ly=0, locked=false;
  cv.addEventListener('mousedown',e=>{
    if(!ready) return;
    dragging=true; lx=e.clientX; ly=e.clientY;
    // 只有左键/中键才请求锁定，避免右键菜单干扰
    if(!locked && cv.requestPointerLock) cv.requestPointerLock();
  });
  document.addEventListener('pointerlockchange',()=>{
    locked=(document.pointerLockElement===cv);
    document.body.classList.toggle('locked',locked);
  });
  addEventListener('mouseup',()=>{ dragging=false; });
  addEventListener('mousemove',e=>{
    // 锁定态优先用 movementX/Y（clientX 在锁定下是冻结的）
    if(locked){
      const dx=e.movementX||0, dy=e.movementY||0;
      if(dx===0&&dy===0) return;
      P.yaw-=dx*0.0016;
      P.pitch-=dy*0.0016;
    }else{
      if(!dragging) return;
      P.yaw-=(e.clientX-lx)*0.0016;
      P.pitch-=(e.clientY-ly)*0.0016;
      lx=e.clientX; ly=e.clientY;
    }
    const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
  });

  /* 触屏摇杆：只用 touch 事件。
     【为什么不用 pointer】pointerdown/pointermove 与 touchstart/touchmove
     同时绑在同一个元素上时，两者会互相打架：
     pointerdown 先跑并把 jId 赋值，接着 touchstart 看到 jId!==null 直接 return，
     而 pointermove 又因为设备上 pointerId 配对异常被 if 挡掉，
     结果两套事件都「启动了」，但没有任何一套真正更新 P.joyX，
     表现就是摇杆能显示、能跟随手指，玩家却一动不动。
     这里只保留 touch 事件，逻辑单一，不再有配对问题。 */
const joyZone=$('joyZone'), joyBase=$('joyBase'), joyStick=$('joyStick');
  if(joyZone&&joyBase&&joyStick){
    let activeId=null, sx=0, sy=0;
    /* 【真凶就在这里】原来 startJoy 每次都无条件执行 sx=cx;sy=cy;
       浏览器只要多发一次 touchstart（手指轻微抖动、WebView 重新派发、
       或者 #joyZone 被反复 touchstart），起点就被刷新成「当前点」，
       于是接下来的 touchmove 里 dx=cx-sx 恒等于 0，
       moveJoy 被调用了 134 次、joyX 却永远是 0.00，pos 永远 0.0,5.0。
       修法：只有「当前没有活动触点」时才记录起点，
       已经在拖时再收到 touchstart 一律忽略。 */
    const startJoy=(cx,cy)=>{
      if(activeId!==null){          // 已经在拖了，绝不重置起点
        window.__evtStart=(window.__evtStart||0)+1;
        return;
      }
      sx=cx; sy=cy;
      activeId=1;
      window.__evtStart=(window.__evtStart||0)+1;
      window.__lastStart=[cx|0,cy|0];
      /* 【摇杆固定】底座位置写死在 CSS 里（左下角），
         绝不再随手指按下的位置移动。
         以前这里执行 joyBase.style.left=cx / top=cy，
         摇杆会「跳到」你按下的地方，看起来像可以拖着到处跑，
         而且会跑到右侧按钮区里，造成穿模。
         现在只让摇杆头（joyStick）在底座内偏移，底座不动。 */
      joyBase.style.display='block';
      joyStick.style.transform='translate(-50%,-50%)';
      P.joyX=0; P.joyY=0;
      window.__joyTouch={ active:true, sx:cx, sy:cy, cx:cx, cy:cy };
    };

    const moveJoy=(cx,cy)=>{
      /* 【死区与缩放】max 是摇杆最大位移，输出经 max 归一化到 -1~1。
         这里保持原逻辑，只补注释。 */
      window.__evtMove=(window.__evtMove||0)+1;
      window.__lastMove=[cx|0,cy|0];
      let dx=cx-sx, dy=cy-sy;
      const max=48, d=Math.hypot(dx,dy);
      if(d>max){ dx*=max/d; dy*=max/d; }
      joyStick.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
      /* 死区 2px：手指轻微抖动不算推杆，但门限不能太大，
         否则手感会发黏。超过门限按比例输出 -1~1。 */
      if(d>2){ P.joyX=dx/max; P.joyY=dy/max; }
      else { P.joyX=0; P.joyY=0; }
      if(window.__joyTouch){ window.__joyTouch.cx=cx; window.__joyTouch.cy=cy; window.__joyTouch.active=true; }
    };

    const endJoy=()=>{
      activeId=null; joyTid=null; P.joyX=0; P.joyY=0;
      if(window.__joyTouch) window.__joyTouch.active=false;
      /* 只把摇杆头弹回中心，底座永远留在 CSS 定的左下角 */
      joyStick.style.transform='translate(-50%,-50%)';
    };

    /* 【多指触控的核心修复】
       旧代码一律取 e.changedTouches[0]：
       手指 A 推摇杆、手指 B 转视角时，两个处理函数都会各自收到
       「本次变更的触点数组」，而 [0] 拿到的常常是**另一根手指**。
       于是摇杆把手腕的横移当成了「推杆」，视角也拿摇杆的位移当转角，
       两边互相污染 —— 表现就是「单独用没事，一起用灵敏度爆炸」。

       现在改成：摇杆和视角各自**锁定一个 touch identifier**，
       move/end 时用 identifiers 或 changedTouches 精确找出「自己那根手指」，
       属于别人的触点一律忽略。 */
    joyZone.addEventListener('touchstart',e=>{
      for(const t of e.changedTouches){
        if(joyTid!==null) break;             // 已经认领了一根，其余忽略
        joyTid=t.identifier;
        startJoy(t.clientX,t.clientY);
      }
      const tip=$('htip');
      if(tip){ tip.classList.remove('hide'); tip.textContent='🎮 摇杆已激活 · 拖动移动'; }
      e.preventDefault();
    }, {passive:false});
    joyZone.addEventListener('touchmove',e=>{
      if(joyTid===null) return;
      const t=findTouch(e,joyTid); if(!t) return;
      moveJoy(t.clientX,t.clientY);
      e.preventDefault();
    }, {passive:false});
    /* 【按住期间被系统吞掉 touchend 的兜底】
       如果 WebView 在手指仍按着时发了 touchend、却没有后续 touchstart，
       会出现「手指仍在动、却收不到 move」的僵死状态。
       用一个定时器在 touchend 后 250ms 检查：期间没有任何 move，
       才真正结束摇杆，否则把它当作误报忽略。 */
    let endTimer=null;
    const softEnd=()=>{
      if(endTimer) clearTimeout(endTimer);
      const t0=window.__joyTouch?window.__joyTouch.t0:0;
      const mv=window.__evtMove||0;
      endTimer=setTimeout(()=>{
        if((window.__evtMove||0)!==mv && Date.now()-(window.__joyTouch.t0||0)<2000){
          // 期间还有 move，说明是误报的 touchend，保持按住状态
          return;
        }
        endJoy();
      }, 250);
    };
    joyZone.addEventListener('touchend',e=>{
      /* 只有「摇杆那根手指」抬起才结束，别的指头抬起不影响 */
      if(joyTid===null) return;
      if(!hasTouch(e.changedTouches,joyTid)) return;
      softEnd();
    },{passive:true});
    joyZone.addEventListener('touchcancel',e=>{
      if(joyTid===null) return;
      if(!hasTouch(e.changedTouches,joyTid)) return;
      endJoy();
    },{passive:true});
    /* 【全局兜底】有些 WebView 里 #joyZone 的 touch 事件会被
       其它覆盖层吃掉（canvas、#grade、#grain、甚至系统手势区）。
       这里在 document 上再挂一份：只要触点落在左半屏、
       且当前没有摇杆在拖，就照样启动摇杆。
       优先走 #joyZone 的正常路径，它没收到才由这里接手。 */
    /* 【横屏适配】摇杆只管屏幕左侧 42% 的区域。
       原来固定是 50%，横屏后左半屏很宽，手指稍微往中间推就落到视角层，
       会变成「推着推着视角自己转起来」。 */
    document.addEventListener('touchstart',e=>{
      if(joyTid!==null) return;
      if(!window.__joyEnabled) return;    // 还没进游戏（菜单界面）不接管
      for(const t of e.changedTouches){
        if(joyTid!==null) break;
        if(t.clientX > window.innerWidth*(window.__joyZoneRatio||0.42)) continue;
        joyTid=t.identifier;
        startJoy(t.clientX,t.clientY);
        break;
      }
    }, {passive:true});
    document.addEventListener('touchmove',e=>{
      if(joyTid===null) return;
      const t=findTouch(e,joyTid); if(!t) return;
      moveJoy(t.clientX,t.clientY);
    }, {passive:true});
    document.addEventListener('touchend',e=>{
      if(joyTid===null) return;
      if(!hasTouch(e.changedTouches,joyTid)) return;
      softEnd();
    }, {passive:true});
    document.addEventListener('touchcancel',e=>{
      if(joyTid===null) return;
      if(!hasTouch(e.changedTouches,joyTid)) return;
      endJoy();
    }, {passive:true});

    /* 桌面调试用：鼠标拖左半屏也能触发摇杆，方便在电脑上验证移动逻辑 */
    joyZone.addEventListener('mousedown',e=>{
      if(activeId!==null) return;
      startJoy(e.clientX,e.clientY);
      const mv=ev=>moveJoy(ev.clientX,ev.clientY);
      const up=()=>{ endJoy(); removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
      addEventListener('mousemove',mv); addEventListener('mouseup',up);
      e.preventDefault();
    });
  }

  // 移动端操作按钮
  /* 移动端开火键：同样用「按住」语义。
     以前只监听 touchstart，所以移动端也打不出连发。
     touchend / touchcancel 都必须清掉，否则手指抬起后
     全自动枪会一直响到弹匣打空。 */
  const fireBtn=$('btnFire');
  if(fireBtn){
    fireBtn.addEventListener('touchstart',e=>{
      if(ready){ P.firing=true; fire(); }
      e.preventDefault();
    },{passive:false});
    const stopFire=()=>{ P.firing=false; };
    fireBtn.addEventListener('touchend',stopFire);
    fireBtn.addEventListener('touchcancel',stopFire);
    /* 桌面调试：鼠标压住按钮也走同一套 */
    fireBtn.addEventListener('mousedown',e=>{ if(ready){ P.firing=true; fire(); } e.preventDefault(); });
    fireBtn.addEventListener('mouseup',()=>{ P.firing=false; });
  }
  const jumpBtn=$('btnJump'); if(jumpBtn){ jumpBtn.addEventListener('touchstart',e=>{ if(ready) doJump(); e.preventDefault(); }); }
  const reloadBtn=$('btnReload'); if(reloadBtn){ reloadBtn.addEventListener('touchstart',e=>{ startReload(); e.preventDefault(); }); }
  const sprintBtn=$('btnSprint'); if(sprintBtn){
    sprintBtn.addEventListener('touchstart',e=>{ P.sprinting=true; e.preventDefault(); });
    sprintBtn.addEventListener('touchend',()=>{ P.sprinting=false; });
  }
  /* 趴下：点一下切换（不是按住），和跳跃一样是瞬时动作 */
  const proneBtn=$('btnProne'); if(proneBtn){
    const tap=(e)=>{ e.preventDefault(); e.stopPropagation(); toggleProne(); };
    proneBtn.addEventListener('touchstart',tap,{passive:false});
    proneBtn.addEventListener('click',tap);
  }
  const interactBtn=$('btnInteract'); if(interactBtn){ interactBtn.addEventListener('touchstart',e=>{ interact(); e.preventDefault(); }); }
/* 开镜：改成「切换」模式。
     以前是按住生效，手机上一个手指要一直压着开镜键，
     根本没法同时用摇杆移动、也没法开火 —— 手感完全不可用。
     现在点一下开镜、再点一下关闭，状态机单一，不会出现
     touchstart 触发 pointerdown 又触发 pointerleave 导致反复开关。 */
  const aimBtn=$('btnAim');
  const setAim=(on)=>{
    P.aiming=!!on;
    if(aimBtn){
      if(P.aiming) aimBtn.classList.add('active');
      else aimBtn.classList.remove('active');
    }
    const tip=$('htip');
    if(tip) tip.textContent = P.aiming ? '🔭 开镜中 · 再点一次退出' : '📱 右半屏拖动转视角 · 左摇杆移动 · 右下按钮作战';
  };
  if(aimBtn){
    const toggle=(e)=>{
      setAim(!P.aiming);
      if(e&&e.preventDefault) e.preventDefault();
      if(e&&e.stopPropagation) e.stopPropagation();
    };
    aimBtn.addEventListener('touchstart',toggle,{passive:false});
    /* 桌面/鼠标调试用；pointerup 之类不再参与，避免同一次点击被处理两遍 */
    aimBtn.addEventListener('mousedown',e=>{ if(e.button===0) toggle(e); });
    /* 换弹时自动退出开镜，否则换弹动画和 FOV 会互相打架 */
  }
  window.__setAim=setAim;
  /* 检视按钮：点一下把武器在脸前转一圈，用来欣赏皮肤和刀型。
     用 touchstart 防止 300ms 延迟，同时 preventDefault 避免
     触发后面的 mousedown 造成双重调用。 */
  const inspectBtn=$('btnInspect');
  if(inspectBtn){
    const doIns=(e)=>{ if(typeof startInspect==='function') startInspect();
      if(e&&e.preventDefault) e.preventDefault();
      if(e&&e.stopPropagation) e.stopPropagation(); };
    inspectBtn.addEventListener('touchstart',doIns,{passive:false});
    inspectBtn.addEventListener('click',doIns);
  }
  // 键盘右键也可开镜（桌面端，按住式）
  /* 右键瞄准：按住开镜，松开还原。
     必须同时屏蔽浏览器右键菜单，否则一按右键先弹出一个菜单，
     瞄准根本没法用。只在画布上屏蔽，不影响其它区域。 */
  addEventListener('contextmenu',e=>{
    if(e.target && (e.target.tagName==='CANVAS' || e.target.id==='viewLayer')){
      e.preventDefault();
    }
  });
  addEventListener('mousedown',e=>{ if(e.button===2&&ready){ e.preventDefault(); if(window.__setAim) window.__setAim(true); } });
  addEventListener('mouseup',e=>{ if(e.button===2){ if(window.__setAim) window.__setAim(false); } });

  // 触屏视角拖拽（屏幕右半区，整屏监听，不依赖按钮）
  const viewLayer=$('viewLayer');
  if(viewLayer){
    /* 视角拖拽：只用「第一个落在右半屏的触点」。
       以前按 identifier 严格配对，WebView 里 identifier 偶尔会对不上，
       表现就是视角偶尔卡住。现在改成记录一个独立标记，
       touchend 时检查是不是自己那根手指（位置配对容错更大）。 */
    let vx=0, vy=0, vOn=false, viewTid=null;
    viewLayer.addEventListener('touchstart',e=>{
      if(viewTid!==null) return;
      for(const t of e.changedTouches){
        if(viewTid!==null) break;
        viewTid=t.identifier;
        vOn=true; vx=t.clientX; vy=t.clientY;
      }
    }, {passive:true});
    /* 【视角灵敏度】单位是「弧度/像素」。
       历史上调过两次：
         v1: 0.005  → 一划就飞，完全瞄不准
         v2: 0.0026 → 仍然偏快（用户实测「还是太高」）
       现在降到 0.0016：横向划满一整屏（约 800px）≈ 73°，
       这是主流手游 FPS 的默认档位。
       想改手感只需要动这一个数（触屏和鼠标共用）。 */
   const TOUCH_SENS=0.0016;
   const MOUSE_SENS=0.0016;
   viewLayer.addEventListener('touchmove',e=>{
      if(!vOn || viewTid===null) return;
      /* 【关键】必须先用 findTouch 找到「视角自己那根手指」再决定要不要动。
         不能反过来写成 `if(!t) return` 之前就更新起点——
         否则摇杆手指的 touchmove 也会派发到这里，
         虽然被当成「别人的手指」跳过，却会把 vx/vy 覆写成摇杆的位置，
         导致之后右手怎么划都算不出位移（视角卡死）。
         同理，也绝不能用 changedTouches[0] 兜底。 */
      const t=findTouch(e,viewTid); if(!t) return;
      P.yaw-=(t.clientX-vx)*TOUCH_SENS;
      P.pitch-=(t.clientY-vy)*TOUCH_SENS;
      const lim=1.45; if(P.pitch>lim)P.pitch=lim; if(P.pitch<-lim)P.pitch=-lim;
      vx=t.clientX; vy=t.clientY;
    }, {passive:true});
    viewLayer.addEventListener('touchend',e=>{
      if(viewTid===null) return;
      if(!hasTouch(e.changedTouches,viewTid)) return;   // 抬起的不是视角手指
      vOn=false; viewTid=null;
    }, {passive:true});
    viewLayer.addEventListener('touchcancel',e=>{
      if(viewTid===null) return;
      if(!hasTouch(e.changedTouches,viewTid)) return;
      vOn=false; viewTid=null;
    }, {passive:true});
  }
}

/* ============ 搜打撤物品系统 ============
   撤离类游戏的核心循环：买装备 → 带进局 → 搜物资 → 撤离带回。
   这里把「商品定义」和「背包/装备」分开：
   - SHOP_ITEMS 只描述「卖什么、多少钱、有什么属性」
   - P.bag / P.equip 描述「玩家实际拥有什么」
   - BAG_CAP 描述「能带多少」（背包决定容量） */

/* 背包占用格数：数量 1 个占 1 格，子弹按堆叠算 1 格 */
/* 局内背包占用格数（只有 pouch 算容量，stash 无限） */
function pouchUsed(){
  let n=0;
  for(const k in P.pouch){ if(P.pouch[k]>0) n++; }
  return n;
}
function pouchFree(){ return P.bagCap - pouchUsed(); }
/* 兼容旧名字 */
function bagUsed(){ return pouchUsed(); }
function bagFree(){ return pouchFree(); }

/* 往局内背包塞东西（局内拾取用），容量不足返回 false */
function bagAdd(id, cnt){
  if(!cnt) cnt=1;
  if(!P.pouch[id] || P.pouch[id]<=0){
    if(pouchFree()<=0) return false;   // 新物品占新格
    P.pouch[id]=0;
  }
  P.pouch[id]+=cnt;
  return true;
}
/* 从局内背包扣东西 */
function bagTake(id, cnt){
  if(!cnt) cnt=1;
  if(!P.pouch[id] || P.pouch[id]<cnt) return false;
  P.pouch[id]-=cnt;
  if(P.pouch[id]<=0) delete P.pouch[id];
  return true;
}
/* 往局外仓库塞东西（购买/撤离带回用），容量无限 */
function stashAdd(id, cnt){
  if(!cnt) cnt=1;
  P.stash[id]=(P.stash[id]||0)+cnt;
  return true;
}

/* ---- 商店 ---- */
function toggleShop(){
  const s=$('shop'); if(!s) return;
  const opening = s.style.display!=='flex';
  if(opening){ buildShop(); s.style.display='flex'; }
  else s.style.display='none';
}
function closeShop(){ const s=$('shop'); if(s) s.style.display='none'; }

function buildShop(){
  const s=$('shop'); if(!s) return;
  let h='<div class="box" style="max-width:600px">';
  h+='<div class="row" style="justify-content:space-between;align-items:center;margin:0 0 6px">'
    +'<h1 style="margin:0">🛒 商店</h1>'
    +'<div style="color:#ffd54a;font-weight:700">¥'+P.ammo.cash+'</div></div>';
  /* 分类标签 */
  h+='<div class="tabs">';
  for(const c of SHOP_CATS){
    h+='<button class="tab'+(shopTab===c.id?' on':'')+'" data-cat="'+c.id+'">'+c.name+'</button>';
  }
  h+='</div>';
  /* 商品列表 */
  h+='<div class="list">';
  let any=false;
  for(const id in SHOP_ITEMS){
    const it=SHOP_ITEMS[id];
    if(it.cat!==shopTab) continue;
    any=true;
    const owned = (P.stash[id]>0) ? P.stash[id] : 0;
    const eqTag = equipTagOf(id);
    h+='<div class="item'+(P.ammo.cash<it.price?' locked':'')+'">'
      +'<div class="ic">'+it.icon+'</div>'
      +'<div class="info"><div class="n">'+it.name+(eqTag?' <span class="owned">已装备</span>':'')+'</div>'
      +'<div class="d">'+it.desc+'</div></div>'
      +(owned?'<div class="owned">仓库×'+owned+'</div>':'')
      +'<div class="price">¥'+it.price+'</div>'
      +'<button class="btn sm" data-buy="'+id+'">购买</button>'
      +'</div>';
  }
  if(!any) h+='<div class="d" style="text-align:center;padding:14px">暂无商品</div>';
  h+='</div>';
  /* 底部：说明 + 关闭 */
  h+='<div class="row" style="margin-top:10px;align-items:center;justify-content:space-between">'
    +'<div class="d">买到的物品进仓库 · 出击前在仓库里装包</div>'
    +'<button class="btn ghost" id="closeShop">关闭</button></div>';
  h+='</div>';
  s.innerHTML=h;

  /* 绑定事件 */
  s.querySelectorAll('.tab').forEach(b=>{
    b.onclick=()=>{ shopTab=b.getAttribute('data-cat'); sfxUI(); buildShop(); };
  });
  s.querySelectorAll('[data-buy]').forEach(b=>{
    b.onclick=()=>{ buyItem(b.getAttribute('data-buy')); };
  });
  const cs=$('closeShop'); if(cs) cs.onclick=()=>{ sfxUI(); closeShop(); };
}

function equipTagOf(id){
  const e=P.equip;
  return (e.helmet===id)||(e.armorVest===id)||(e.backpack===id);
}

/* 购买逻辑：扣钱 → 装备类直接穿上 → 其余进「局外仓库」
   【关键】商店是局外功能，买的东西一律进 stash，不占局内背包格子。
   出击前要去仓库把物资装进背包，这才是搜打撤的整备流程。 */
function buyItem(id){
  const it=SHOP_ITEMS[id]; if(!it) return;
  if(P.ammo.cash < it.price){ sfxDeny(); toast('货币不足'); return; }

  const cat=it.cat;
  /* 装备类：直接穿戴（等同买完立刻装备），也记一份进仓库 */
  if(cat==='helmet'){
    P.ammo.cash-=it.price;
    P.equip.helmet=id; P.helmetDur=it.dur;
    sfxBuy(); toast('已装备 '+it.name); refreshHUD(); buildShop(); return;
  }
  if(cat==='armor'){
    P.ammo.cash-=it.price;
    P.equip.armorVest=id; P.vestDur=it.dur;
    sfxBuy(); toast('已装备 '+it.name); refreshHUD(); buildShop(); return;
  }
  if(cat==='bag'){
    P.ammo.cash-=it.price;
    P.equip.backpack=id; P.bagCap=it.cap;
    sfxBuy(); toast('背包装备成功，出击背包 '+it.cap+' 格'); refreshHUD(); buildShop(); return;
  }
  /* 【新加的四个装备槽】
     主武器/手枪/副武器/胸挂都直接穿上，因为它们只有在装备槽里才有意义。
     但「主武器」比较特殊：玩家可能想先买一把备着，所以我们只在
     对应槽位空着的时候自动装备，否则丢进仓库。 */
  if(cat==='gun'||cat==='pistol'||cat==='melee'||cat==='chest'){
    P.ammo.cash-=it.price;
    const slot=stashSlotOf(id);
    if(slot && !P.equip[slot]){
      P.equip[slot]=id;
      sfxBuy(); toast('已装备 '+it.name); refreshHUD(); buildShop(); return;
    }
    stashAdd(id,1);
    sfxBuy(); toast('买下 '+it.name+' → 仓库'); refreshHUD(); buildShop(); return;
  }

  /* 【武器皮肤】买完立刻套到当前手持的主武器上。
     皮肤是纯外观，没有属性，所以不需要进仓库再装备 ——
     买完直接生效手感最好，也避免玩家买了不知道怎么用。
     如果手上不是枪（比如拿到了刀），就存进 P.skins 里，
     等真正装备那把枪时自动生效（curSkinId 会去查）。
     由于皮肤只能给枪上，我们把 skin 存到 P.equip.primary 这把枪的 id 上。 */
  if(cat==='skin'){
    const skinId=it.skin||id;
    /* 找一把能套的武器：优先当前手持的主武器，其次手里任何一把枪 */
    let target=(P.equip&&P.equip.primary)||null;
    if(!target && P.equip && P.equip.secondary) target=P.equip.secondary;
    if(!target){
      /* 一把枪都没有，不允许买，不然花了钱什么都看不到 */
      toast('先买一把枪再买皮肤'); sfxDeny(); buildShop(); return;
    }
    P.ammo.cash-=it.price;
    stashAdd(id,1);
    if(typeof setSkin==='function') setSkin(target, skinId);
    if(typeof _modelCache==='object') _modelCache.key=null;
    sfxBuy();
    toast('皮肤已应用 '+(SHOP_ITEMS[target]?SHOP_ITEMS[target].name:'')+' · '+it.name);
    refreshHUD(); buildShop(); return;
  }
  /* 消耗品/子弹：全部进仓库，仓库容量无限 */
  P.ammo.cash-=it.price;
  stashAdd(id,1);
  if(cat==='ammo'){
    const key=it.ammo;
    P.ammo[key]=(P.ammo[key]||0)+it.count;
    sfxBuy(); toast(it.name+' +'+it.count+' → 仓库');
  }else{
    sfxBuy(); toast('买下 '+it.name+' → 仓库');
  }
  refreshHUD(); buildShop(); return;
}

/* ============ 局外仓库 / 局内背包 ============
   搜打撤的两层容器，必须完全分开：

   ┌─ 局外（主菜单）──────────────────────────┐
   │  仓库 stash：容量无限，安全，死亡不掉      │
   │  在这里整备：把装备穿上、把物资塞进背包     │
   └──────────────────────────────────────┘
   ┌─ 局内（进游戏）──────────────────────────┐
   │  背包 pouch：容量 = 背包装备给的格子       │
   │  Tab / B 打开，能用的只有包里这点东西      │
   │  撤离成功 → 并入 stash；阵亡 → 全部丢失     │
   └──────────────────────────────────────┘ */

/* ---- 仓库（局外） ---- */
function toggleStash(){
  const el=$('stash'); if(!el) return;
  const opening = el.style.display!=='flex';
  if(opening){ buildStashNew(); el.style.display='flex'; }
  else el.style.display='none';
}
function closeStash(){ const el=$('stash'); if(el) el.style.display='none'; }

/* 仓库里的东西搬到出击背包 */
function stashTake(id, n){
  const cnt = n||(P.stash[id]||0);
  if(!(P.stash[id]>0)) return false;
  const move = Math.min(cnt, P.stash[id]);
  /* 出击包按格算：新物品要占一格 */
  if(!(P.pouch[id]>0) && pouchUsed()>=P.bagCap){ toast('出击背包已满（'+P.bagCap+' 格）'); sfxDeny(); return false; }
  P.stash[id]-=move;
  if(P.stash[id]<=0) delete P.stash[id];
  P.pouch[id]=(P.pouch[id]||0)+move;
  sfxPickup(); return true;
}
/* 出击背包里的东西放回仓库 */
function stashPut(id, n){
  if(!(P.pouch[id]>0)) return false;
  const move = Math.min(n||P.pouch[id], P.pouch[id]);
  P.pouch[id]-=move;
  if(P.pouch[id]<=0) delete P.pouch[id];
  P.stash[id]=(P.stash[id]||0)+move;
  sfxPickup(); return true;
}

/* ============ 局外仓库（按设计图重做） ============ */
/* 布局参考塔科夫/暗区突围：
     左侧竖排 —— 返回键、大标题「仓库」、装备槽
                  主武器 / 手枪 / 副武器(小刀) / 胸挂 / 背包
     右侧     —— 顶部现金，下面是仓库格子

   和老实现的区别：
     老的是「左仓库右出击背包」两列平铺，本质还是一维列表。
     现在是真正的「装备槽 + 仓库格子」分离，装备槽管你身上穿什么，
     仓库管你囤了什么，出击背包在装备槽里点「背包」进去装。 */


/* 当前选中的物品（点一下格子选中，再点装备槽放入） */
let selStash=null;

function stashSlotOf(id){
  const it=SHOP_ITEMS[id]; if(!it) return null;
  for(const s of SLOTS){ if(s.accept.includes(it.cat)) return s.key; }
  return null;
}

function buildStashNew(){
  const el=$('stash'); if(!el) return;
  let h='<div class="stk">';

  /* ---------- 左侧：返回 + 标题 + 装备槽 ---------- */
  h+='<div class="stkleft">';
  h+='<button class="stkback" id="stkBack">←</button>';
  h+='<div class="stktitle">仓库</div>';

  /* 装备槽区：每个槽一行，图标 + 槽名 + 当前装备 */
  h+='<div class="stkslots">';
  for(const s of SLOTS){
    const id=P.equip[s.key];
    const it=id?SHOP_ITEMS[id]:null;
    let fill=it?(it.icon):('  ');
    let cls='stkslot'+(it?' on':'');
    let name=it?it.name:s.label;
    /* 背包槽显示容量 */
    let extra='';
    if(s.key==='backpack'){
      extra='<span class="stkcap">'+pouchUsed()+'/'+P.bagCap+'</span>';
    }
    h+='<div class="'+cls+'" data-slot="'+s.key+'">'
      +'<span class="stksi">'+(it?it.icon:s.fb)+'</span>'
      +'<span class="stksn">'+name+'</span>'
      +extra
      +'</div>';
  }
  h+='</div>';

  /* 出击背包格子（在左侧下方，点背包槽展开） */
  h+='<div class="stkpouch" id="stkPouchBox" style="display:none">';
  h+='<div class="stkph">🎒 出击背包 <span class="stkcap">'+pouchUsed()+'/'+P.bagCap+'</span></div>';
  h+='<div class="stkpgrid">';
  let np=0;
  for(const id in P.pouch){
    if(!(P.pouch[id]>0)) continue;
    const it=SHOP_ITEMS[id]; if(!it) continue;
    np++;
    h+='<div class="stkpi" data-pouch="'+id+'" title="'+it.name+'">'+it.icon+'<b>'+P.pouch[id]+'</b></div>';
  }
  if(!np) h+='<div class="stkempty2">空（点击仓库物品放入）</div>';
  h+='</div></div>';

  h+='</div>';   /* 左栏结束 */

  /* ---------- 右侧：现金 + 仓库格子 ---------- */
  h+='<div class="stkright">';
  h+='<div class="stkcash">💵 <b>'+P.ammo.cash+'</b> 元</div>';

  /* 仓库格子：把数量展开成一格一格的小方块。
     塔科夫那种 2×3 大物品我们先不做（手机屏幕太小），
     这里每件物品占一个方块，数量用角标表示。 */
  h+='<div class="stkgrid" id="stkGrid">';
  /* 先铺满底格，形成「一堆格子」的观感 */
  const cellTotal=96;      // 8 列 × 12 行
  let used=0;
  const owned=[];
  for(const id in P.stash){
    if(!(P.stash[id]>0)) continue;
    if(!SHOP_ITEMS[id]) continue;
    owned.push(id);
  }
  /* 已占用格数 = sum(ceil(数量)) 简单按种类算一格，数量累加到角标 */
  used=owned.length;

  /* 渲染有物品的格子 */
  for(const id of owned){
    const it=SHOP_ITEMS[id];
    const sel=(selStash===id)?' sel':'';
    h+='<div class="stkg'+sel+'" data-item="'+id+'">'
      +'<span class="stkgi">'+it.icon+'</span>'
      +'<b class="stkgq">'+P.stash[id]+'</b>'
      +'</div>';
  }
  /* 补空格子，凑成整齐的一片 */
  for(let i=owned.length;i<cellTotal;i++){
    h+='<div class="stkg"></div>';
  }
  h+='</div>';

  h+='</div>';   /* 右栏结束 */

  h+='</div>';   /* 容器结束 */
  el.innerHTML=h;

  /* ---- 绑定事件 ---- */
  const bk=$('stkBack');
  if(bk) bk.onclick=()=>{ selStash=null; toggleStash(); };

  /* 点装备槽：如果是背包就展开出击背包，否则卸下 */
  el.querySelectorAll('[data-slot]').forEach(node=>{
    node.onclick=()=>{
      const k=node.dataset.slot;
      if(k==='backpack'){
        const box=$('stkPouchBox');
        if(box){
          const show=box.style.display==='none';
          box.style.display=show?'':'none';
        }
        return;
      }
      /* 其它槽：点一下卸下到仓库 */
      const cur=P.equip[k];
      if(cur){
        stashAdd(cur,1);
        P.equip[k]=null;
        if(k==='primary'||k==='secondary'||k==='melee') P.inv.gun=true;
        toast('已卸下');
        buildStashNew();
      }
    };
  });

  /* 点仓库格子：选中 / 放入装备槽 / 放进出击背包 */
  el.querySelectorAll('[data-item]').forEach(node=>{
    node.onclick=()=>{
      const id=node.dataset.item;
      const it=SHOP_ITEMS[id]; if(!it) return;

      /* 装备类直接穿上（替换下来的回仓库） */
      const slot=stashSlotOf(id);
      if(slot){
        const old=P.equip[slot];
        if(old && old!==id) stashAdd(old,1);
        P.equip[slot]=id;
        P.stash[id]--;
        if(P.stash[id]<=0) delete P.stash[id];
        /* 背包要重算容量 */
        if(slot==='backpack'){ P.bagCap=it.cap||24; }
        toast('已装备 '+(it.name||''));
        buildStashNew(); refreshHUD();
        return;
      }

      /* 消耗品：放进出击背包 */
      if(P.bagCap<=0){ toast('没有背包，装不了东西'); sfxDeny(); return; }
      if(pouchUsed()>=P.bagCap){ toast('背包满了'); sfxDeny(); return; }
      /* 容量：物品本身占 1 格，一次放 1 个 */
      if(stashTake(id,1)){
        bagAdd(id,1);
        buildStashNew(); refreshHUD();
      }
    };
  });

  /* 点出击背包里的物品：放回仓库 */
  el.querySelectorAll('[data-pouch]').forEach(node=>{
    node.onclick=()=>{
      const id=node.dataset.pouch;
      if(bagTake(id,1)) stashAdd(id,1);
      buildStashNew(); refreshHUD();
    };
  });
}

/* ---- 局内背包 ---- */
function toggleBag(){
  const b=$('bag'); if(!b) return;
  const opening = b.style.display!=='flex';
  if(opening){ buildBagNew(); b.style.display='flex'; }
  else b.style.display='none';
}
function closeBag(){ const b=$('bag'); if(b) b.style.display='none'; }

/* ============ 底部中间：武器切换条 ============
   三个格子对应三个武器槽。点一下就切过去。
   空槽显示为虚线变暗、点了没反应（不是隐藏，让玩家知道「这槽能装东西」）。 */
function buildWpnBar(){
  const el=$('wpnBar'); if(!el) return;
  let h='';
  for(const s of WSLOTS){
    const id=slotItem(s);
    const it=id&&SHOP_ITEMS[id];
    const usable=slotUsable(s);
    const on = (P.slot===s);
    const cls='ws'+(on?' on':'')+(usable?'':' empty');
    /* 名字优先显示具体枪名（突击步枪/制式手枪），
       太长就靠 CSS ellipsis 截断；空槽显示槽位名。 */
    const nm = it ? it.name : slotName(s);
    const ic = it ? it.icon : slotIcon(s);
    h+='<div class="'+cls+'" data-slot="'+s+'" title="'+slotName(s)+'">'
      +'<span class="wi">'+ic+'</span>'
      +'<span class="wn">'+nm+'</span>'
      +'</div>';
  }
  el.innerHTML=h;
  el.querySelectorAll('[data-slot]').forEach(node=>{
    node.onclick=()=>{
      const s=node.dataset.slot;
      /* switchSlot 内部会处理「空槽」「已经是当前槽」这些情况 */
      switchSlot(s);
    };
  });
}

/* 武器条跟着摇杆/按键一起显示隐藏，主菜单上不该出现 */
function setWpnBarVisible(v){
  const el=$('wpnBar'); if(!el) return;
  el.style.display = v ? 'flex' : 'none';
}
function refreshWpnBar(){ buildWpnBar(); }
/* 用户要求「局内背包就是仓库的左边，一模一样就行」。
   所以这里直接复用仓库那套 .stk / .stkleft / .stkright / .stkgrid
   的视觉结构，保证两个界面看起来是同一个系统，只是数据源不同：

     仓库（局外）：左装备槽 + 右 P.stash（无限，死亡不掉）
     背包（局内）：左装备槽 + 右 P.pouch（有限格子，死亡全丢）

   区别只有交互：
     仓库里点物品 = 装备 / 装包
     背包里点物品 = 直接使用（医疗、手雷等），装备只是展示不能换 */
function buildBagNew(){
  const el=$('bag'); if(!el) return;
  let h='<div class="stk">';

  /* ---------- 左侧：返回 + 标题 + 装备槽（只读） ---------- */
  h+='<div class="stkleft">';
  h+='<button class="stkback" id="bagBack">←</button>';
  h+='<div class="stktitle">背包</div>';

  h+='<div class="stkslots">';
  for(const s of SLOTS){
    const id=P.equip[s.key];
    const it=id?SHOP_ITEMS[id]:null;
    let extra='';
    if(s.key==='backpack'){
      extra='<span class="stkcap">'+pouchUsed()+'/'+P.bagCap+'</span>';
    }
    h+='<div class="stkslot'+(it?' on':'')+'" data-ro="'+s.key+'">'
      +'<span class="stksi">'+(it?it.icon:s.fb)+'</span>'
      +'<span class="stksn">'+(it?it.name:s.label)+'</span>'
      +extra
      +'</div>';
  }
  h+='</div>';
  h+='</div>';   /* 左栏结束 */

  /* ---------- 右侧：体力/负重位 + 格子 ---------- */
  h+='<div class="stkright">';
  /* 局内没有钱的概念（现金是撤离后结算的），这里显示剩余空间 */
  const free=Math.max(0, P.bagCap-pouchUsed());
  h+='<div class="stkcash">'+free+' 格空位</div>';

  h+='<div class="stkgrid" id="bagGrid">';
  const owned=[];
  for(const id in P.pouch){
    if(!(P.pouch[id]>0)) continue;
    if(!SHOP_ITEMS[id]) continue;
    owned.push(id);
  }
  const cellTotal=Math.max(48, P.bagCap>0?P.bagCap:48);
  for(const id of owned){
    const it=SHOP_ITEMS[id];
    /* 可以点的：回血 / 投掷 / 弹药（弹药点了补备弹）。
       其余置灰但仍可点击，点了会明确提示为什么不能用。 */
    const usable=(it.heal || id==='grenade'||id==='flashbang'||id==='smoke'
                  || (it.cat==='ammo' && it.ammo));
    h+='<div class="stkg'+(usable?'':' dim')+'" data-use="'+id+'">'
      +'<span class="stkgi">'+it.icon+'</span>'
      +'<b class="stkgq">'+P.pouch[id]+'</b>'
      +'</div>';
  }
  for(let i=owned.length;i<cellTotal;i++){
    h+='<div class="stkg"></div>';
  }
  h+='</div>';
  h+='</div>';   /* 右栏结束 */

  h+='</div>';
  el.innerHTML=h;

  /* 返回 */
  const bk=$('bagBack');
  if(bk) bk.onclick=()=>{ toggleBag(); };

  /* 点物品 = 使用。
     【为什么改成在容器上做委托，而不是给每个格子绑 onclick】
     原来的写法是 `el.querySelectorAll('[data-use]').forEach(n=>n.onclick=...)`，
     看起来没问题，但 useItem() 内部自己又调了一次 buildBagNew()，
     等于「点一下 → 重建 DOM」，刚绑上的节点立刻被 innerHTML 覆盖成新节点，
     新节点上又要等下一轮循环才绑事件，中间有一次点击是打空的。
     更稳的做法是在 #bag 上挂一次委托，用 closest 找目标格子 ——
     无论 DOM 被重建多少次，监听器都挂在没被替换掉的父节点上。 */
  if(!el.__useBound){
    el.__useBound=true;
    el.addEventListener('click', ev=>{
      const g=ev.target && ev.target.closest ? ev.target.closest('[data-use]') : null;
      if(!g) return;
      /* 只读的装备槽（data-ro）不要触发使用 */
      if(g.dataset.ro) return;
      const id=g.dataset.use;
      if(!id) return;
      ev.stopPropagation();
      useItem(id);
    });
  }
}

function cellOf(id, label, fb){
  if(!id) return '<div class="cell"><div class="ci" style="opacity:.25">'+fb+'</div><div class="cn">'+label+'</div><div class="cq lk">空</div></div>';
  const it=SHOP_ITEMS[id];
  let extra='';
  if(it&&it.dur){
    const cur = (it.cat==='helmet')?P.helmetDur:P.vestDur;
    if(cur>0) extra=' <span class="lk">'+Math.round(cur)+'</span>';
  }
  return '<div class="cell eq"><div class="ci">'+(it?it.icon:fb)+'</div><div class="cn">'+(it?it.name:label)+extra+'</div><div class="cq">'+label+'</div></div>';
}

/* 使用背包（pouch）里的物品 */
function useItem(id){
  const it=SHOP_ITEMS[id]; if(!it) return;
  if(!(P.pouch[id]>0)){ sfxDeny(); return; }
  if(it.heal){
    if(P.hp>=100){ sfxDeny(); toast('生命已满'); return; }
    P.pouch[id]--; if(P.pouch[id]<=0) delete P.pouch[id];
    P.hp=Math.min(100,P.hp+it.heal);
    sfxPickup(); toast(it.name+' +'+it.heal+' HP');
    refreshHUD(); buildBagNew(); return;
  }
  if(id==='grenade'||id==='flashbang'||id==='smoke'){
    P.pouch[id]--; if(P.pouch[id]<=0) delete P.pouch[id];
    sfxPickup(); toast('已投掷 '+it.name); buildBagNew(); return;
  }
  /* 【弹药物品】点一下就把备弹补到对应枪里。
     以前弹药走到这里只会提示「局内无法直接使用」，
     玩家身上背着一堆子弹却打不出去，看起来就像背包坏了。 */
  if(it.cat==='ammo' && it.ammo){
    const key={rifle:'rifle',pistol:'pistol',sniper:'sniper',shot:'shot'}[it.ammo]||it.ammo;
    const add=it.count||30;
    P.ammo[key]=(P.ammo[key]|0)+add;
    P.pouch[id]--; if(P.pouch[id]<=0) delete P.pouch[id];
    sfxPickup(); toast('装填 '+it.name+' +'+add);
    refreshHUD(); buildBagNew(); return;
  }
  /* 【装备类】这里不允许换装（换装是局外仓库的事），
     但要明确告诉玩家为什么点了没用，而不是静默失败。 */
  if(it.cat==='gun'||it.cat==='pistol'||it.cat==='melee'
     || it.cat==='chest'||it.cat==='backpack'||it.cat==='helmet'||it.cat==='vest'){
    toast(it.name+'：局内不能换装，回仓库再装备'); sfxDeny(); return;
  }
  toast(it.name+' 局内无法直接使用'); sfxDeny();
}

/* ---- 撤离 / 阵亡 结算 ---- */
/* 撤离成功：局内背包 + 身上装备全部并回仓库 */
function settleExfil(){
  let gained=0;
  for(const id in P.pouch){
    if(P.pouch[id]>0){ P.stash[id]=(P.stash[id]||0)+P.pouch[id]; gained+=P.pouch[id]; }
  }
  P.pouch={};
  /* 装备也一起"带回"，保留在 equip 里继续用 */
  toast('撤离成功！带回 '+gained+' 件物品');
}
/* 阵亡：局内背包和装备全部丢失（搜打撤的风险） */
function settleDeath(){
  const lost=Object.keys(P.pouch).length;
  P.pouch={};
  /* 【阵亡清空全部九个槽位】
     原来只写了 helmet/armorVest/backpack 三个，
     后来加了 primary/secondary/melee/chest 四个武器槽却忘了同步，
     结果主武器、手枪、小刀、胸挂在你死后会「跟着你进下一局」——
     等于白捡，搜打撤的风险完全消失了。
     这里改成整表重建，以后再加槽也不会漏。 */
  P.equip={ helmet:null, armorVest:null, backpack:null,
            primary:null, secondary:null, melee:null, chest:null };
  P.helmetDur=0; P.vestDur=0; P.bagCap=0;
  return lost;
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindUI);
else bindUI();/* ============ 输入方式自适应 ============
   需求：
     · 检测到键盘 -> 隐藏触摸按键（摇杆 + 右侧按钮）
     · 检测到触摸  -> 重新显示
     · 键盘映射：
         W A S D    移动
         E          互动（开门）
         鼠标左键    开火
         鼠标右键    瞄准（按住开镜）
         Shift      趴下（切换）
         Space      跳跃
         Ctrl+W     奔跑
         右 Shift   趴下

   实现要点：
     纯「有触摸就显示」会误判：带触摸屏的笔记本一碰就跳回触摸模式；
     纯「按平台判断」也不准：平板接了键盘照样摸屏幕。
     所以用「最近一次真实输入来源」为准，并给个冷却时间，
     避免鼠标微动和触摸抖动来回切。 */

let inputMode='touch';       // 'touch' | 'keyboard'
let lastSwitchAt=0;
const MODE_COOLDOWN=400;     // 切模式后 400ms 内不再切，防抖

function applyInputMode(mode, force){
  const now=Date.now();
  if(!force && mode===inputMode) return;
  if(!force && now-lastSwitchAt<MODE_COOLDOWN) return;
  inputMode=mode;
  lastSwitchAt=now;
  window.__inputMode=mode;

  const jz=$('joyZone'), az=$('actZone');
  if(mode==='keyboard'){
    /* 键盘模式：整块触摸 UI 收起，画面干净 */
    if(jz) jz.style.display='none';
    if(az) az.style.display='none';
    setWpnBarVisible(false);
    window.__joyEnabled=false;
    if(window.__joyTouch) window.__joyTouch.active=false;
    /* 正在拖摇杆的手指如果卡住了，一并清掉，避免人「自己一直往前走」 */
    if(typeof endJoy==='function'){ try{ endJoy(); }catch(e){} }
    const tip=$('htip');
    if(tip){
      tip.textContent='⌨️ WASD 移动 · E 互动 · 左键开火 · 右键瞄准 · Shift/右Shift 趴下 · Space 跳跃 · Ctrl+W 奔跑';
      tip.classList.remove('hide');
      setTimeout(()=>tip.classList.add('hide'), 9000);
    }
  }else{
    /* 触摸模式：只有已经在局内才显示摇杆和按钮，
       主菜单/结算界面保持隐藏（否则主界面上会浮着一个摇杆）。 */
    if(window.__inGame){
      if(jz) jz.style.display='block';
      if(az) az.style.display='block';
      buildWpnBar();
      setWpnBarVisible(true);
    }
    window.__joyEnabled=true;
    const tip=$('htip');
    if(tip){
      tip.textContent='📱 右半屏拖动转视角 · 左摇杆移动 · 右下按钮作战';
      tip.classList.remove('hide');
      setTimeout(()=>tip.classList.add('hide'), 9000);
    }
  }
}

/* 检测到真实键盘按键 */
function onKeyboardSignal(){ applyInputMode('keyboard'); }
/* 检测到真实触摸 */
function onTouchSignal(){ applyInputMode('touch'); }

/* 启动检测：
   · keydown 任何键 -> 键盘模式（排除纯修饰键连按造成的抖动由冷却兜住）
   · touchstart -> 触摸模式
   · mousemove 不算「键盘」也不算「触摸」，保持当前模式
   · 鼠标点击 -> 有指针设备，按键盘模式处理（桌面用户不想要触摸按钮） */
function initInputModeDetect(){
  if(window.__inputDetectBound) return;
  window.__inputDetectBound=true;

  addEventListener('keydown', e=>{
    /* 只认真实的字符/功能键，修饰键单独按不算（防止 Alt+Tab 之类误切） */
    if(e.key==='Shift'||e.key==='Control'||e.key==='Alt'||e.key==='Meta') return;
    onKeyboardSignal();
  }, {passive:true});

  addEventListener('touchstart', ()=>{
    onTouchSignal();
  }, {passive:true});

  addEventListener('mousedown', e=>{
    /* 鼠标左键按下视为桌面用户 */
    if(e.pointerType==='touch') { onTouchSignal(); return; }
    onKeyboardSignal();
  }, {passive:true});

  /* 初始判定：有精确指针（鼠标）且没有粗指针（触摸）就是纯桌面。
     用 try 包住是因为部分 WebView / 测试环境没有 matchMedia，
     这种环境下一律按触摸处理（最保守，至少按钮能用）。 */
  try{
    const maxTouch = (typeof navigator!=='undefined' && navigator.maxTouchPoints) || 0;
    const coarse = (typeof matchMedia==='function') && matchMedia('(pointer:coarse)').matches;
    const hover  = (typeof matchMedia==='function') && matchMedia('(hover:hover)').matches;
    const isTouch = maxTouch>0 || coarse;
    applyInputMode((!isTouch || hover) ? 'keyboard' : 'touch', true);
  }catch(e){
    try{ applyInputMode('touch', true); }catch(e2){ /* 极端环境下直接放弃检测 */ }
  }
}
/* ============ x_ext.js：场景扩展（大操场 / 可交互门 / 少量NPC） ============ */
/* 依赖 b_world 里的 scene / colliders / box() / cyl() / groundDeco()。

   这一块要解决三个问题：
     1) 只能在教学楼外活动 —— 建筑原本都是实心 box，没有门洞，
        玩家被整面墙挡在外面。现在给主教学楼/东西楼/行政楼都开了真门，
        并且把遮挡门洞的那段墙体精确扣掉，人能真的走进去。
     2) 交互 —— 靠近门显示「开门」，按 E 或点屏幕提示即可开关。
     3) NPC 太多 —— 敌人从 8 个降到 4 个，并分散到更大的场地。 */

/* ==================== 门系统 ==================== */
/* 每扇门 = 一块门板（既是可见 mesh 也是碰撞体）。
   开门时不重新算 AABB（成本高且容易抖），而是把门板
   从 colliders 数组里摘出来，关门时再塞回去。 */
const DOORS=[];
let nearDoor=null;          // 当前可交互的门

function mkDoor(x,z,w,h,color,axis){
  const frameC=0xb9a888, t=0.35;
  /* 门框：两侧立柱 + 上梁。只是装饰，不参与碰撞 */
  if(axis==='x'){
    box(t,h,t*2,frameC,x-w/2,h/2,z,true);
    box(t,h,t*2,frameC,x+w/2,h/2,z,true);
    box(w+t,h*0.14,t*2,frameC,x,h+h*0.07,z,true);
  }else{
    box(t*2,h,t,frameC,x,h/2,z-w/2,true);
    box(t*2,h,t,frameC,x,h/2,z+w/2,true);
    box(t*2,h*0.14,w+t,frameC,x,h+h*0.07,z,true);
  }
  const gw = (axis==='x') ? w : 0.18;
  const gd = (axis==='x') ? 0.18 : w;
  const panel=new THREE.Mesh(
    new THREE.BoxGeometry(gw,h,gd),
    new THREE.MeshStandardMaterial({color,roughness:.6,metalness:.05})
  );
  panel.position.set(x,h/2,z);
  panel.castShadow=true; panel.receiveShadow=true;
  scene.add(panel); colliders.push(panel);
  const d={x,z,w,h,panel,axis,open:false,anim:0};
  DOORS.push(d);
  return d;
}

/* 开关门：把门板从 colliders 移入/移出，并做一点旋转动画 */
function setDoor(d,open){
  if(!d||d.open===open) return;
  d.open=open;
  const i=colliders.indexOf(d.panel);
  if(open){ if(i>=0) colliders.splice(i,1); }
  else { if(i<0) colliders.push(d.panel); }
  sfxUI();
}
function toggleDoor(d){ setDoor(d,!d.open); }

/* 找玩家附近最近的一扇门（2.6 米内） */
function findNearDoor(){
  let best=null, bd=2.6;
  for(const d of DOORS){
    const dist=Math.hypot(P.pos.x-d.x, P.pos.z-d.z);
    if(dist<bd){ bd=dist; best=d; }
  }
  return best;
}
/* 每帧调用：更新高亮提示 + 门板开关动画 */
function updDoors(dt){
  const nd=findNearDoor();
  if(nd!==nearDoor){
    if(nearDoor) nearDoor.panel.material.emissive && nearDoor.panel.material.emissive.setHex(0x000000);
    nearDoor=nd;
    const el=$('doorHint');
    if(el){
      if(nd){ el.style.display='block'; }
      else el.style.display='none';
    }
  }
  if(nearDoor){
    const el=$('doorHint');
    if(el){
      const txt=(nearDoor.open?'关门':'开门');
      if(el.dataset.t!==txt){
        el.dataset.t=txt;
        el.innerHTML='<b>E</b> '+txt;
      }
    }
    // 轻微发亮表示可交互
    if(nearDoor.panel.material.emissive) nearDoor.panel.material.emissive.setHex(nearDoor.open?0x000000:0x223311);
  }
  /* 动画：门板绕自身一侧转开 95°。
     注意 mesh 位置固定在门洞中心，靠旋转让门板「让开」，
     视觉上足够，且不需要处理铰链几何。 */
  for(const d of DOORS){
    const want=d.open?1:0;
    if(Math.abs(d.anim-want)>0.001){
      d.anim += (want-d.anim)*Math.min(1,dt*8);
      if(Math.abs(d.anim-want)<0.01) d.anim=want;
      d.panel.rotation.y = d.anim * (Math.PI/2) * 0.94;
    }
  }
}
/* ==================== 给建筑开门洞 ==================== */
/* 原来的教学楼是一整块实心 box，玩家只能绕着外墙走。
   这里把「门窗那段墙」拆成两段，中间留出 4 米宽的门洞，
   再加一扇可开关的门板。拆墙必须在 buildSchool() 之后就做，
   所以这些补丁函数由 z_render 的 init 链在合适时机调用。 */

/* 主教学楼正面（朝南，z 从 -14 到 -6，墙厚 16）开一个 4 米宽门洞 */
/* 【关键】buildSchool 里已经有一整块 box(60,14,16) 的主楼体，
   如果只是「再叠两段带缝的墙」，原来那整面墙照样挡人，门洞根本不存在。
   所以这里必须拿到原 mesh 并把它从 colliders 里摘掉，再补两段新墙。 */
function dropMainBody(){
  /* 找主楼体：中心在 (0,7,-22)、尺寸 60x14x16 的那块 */
  for(let i=colliders.length-1;i>=0;i--){
    const m=colliders[i];
    if(!m.geometry) continue;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) continue;
    const w=bb.max.x-bb.min.x, h=bb.max.y-bb.min.y, d=bb.max.z-bb.min.z;
    if(Math.abs(w-60)<0.01 && Math.abs(h-14)<0.01 && Math.abs(d-16)<0.01
       && Math.abs(m.position.x)<0.01 && Math.abs(m.position.z+22)<0.01){
      scene.remove(m);
      colliders.splice(i,1);
      return true;
    }
  }
  return false;
}
function carveMainDoor(){
  dropMainBody();
  const gx=0, w=4.4, h=3.6;
  const segW=(60-w)/2;                    // 每段墙宽 27.8
  /* 左段墙 */
  box(segW,14,16,0xd9c6a3,-(w/2+segW/2),7,-22);
  /* 右段墙 */
  box(segW,14,16,0xd9c6a3, (w/2+segW/2),7,-22);
  /* 门洞上方的过梁 */
  box(w,14-h,16,0xd9c6a3,gx,(h+14)/2,-22);
  /* 门洞两侧的内外门套 */
  box(.4,h,.6,0xb9a888,-w/2,h/2,-14.2);
  box(.4,h,.6,0xb9a888, w/2,h/2,-14.2);
  box(.4,h,.6,0xb9a888,-w/2,h/2,-13.8);
  box(.4,h,.6,0xb9a888, w/2,h/2,-13.8);
  /* 可以开关的门板，装在靠南的墙面位置 */
  mkDoor(gx,-14.05,w-0.5,h,0x9a7a52,'x');
}

/* 沿 z 轴开洞的通用实现：先摘掉原整块 body，再拼南北两段 */
function dropBody(w,h,d,px,pz){
  for(let i=colliders.length-1;i>=0;i--){
    const m=colliders[i];
    if(!m.geometry) continue;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) continue;
    const bw=bb.max.x-bb.min.x, bh=bb.max.y-bb.min.y, bd=bb.max.z-bb.min.z;
    if(Math.abs(bw-w)<0.01 && Math.abs(bh-h)<0.01 && Math.abs(bd-d)<0.01
       && Math.abs(m.position.x-px)<0.01 && Math.abs(m.position.z-pz)<0.01){
      scene.remove(m);
      colliders.splice(i,1);
      return true;
    }
  }
  return false;
}

/* 东教学楼（x=-34，宽 16，z 从 -14 到 18，共 32 米）东侧开门 */
function carveEastDoor(){
  const gz=2, w=4, h=3.4;
  /* 尺寸必须和 buildSchool 里的新尺寸（32）一致，
     否则 dropBody 找不到原墙体，会留下「整面墙 + 两段新墙」的三重叠加。 */
  dropBody(16,14,32,-34,2);
  const segD=(32-w)/2;                 // 每段 14
  box(16,14,segD,0xd9c6a3,-34,7,-(w/2+segD/2)+gz);
  box(16,14,segD,0xd9c6a3,-34,7, (w/2+segD/2)+gz);
  box(16,14-h,w,0xd9c6a3,-34,(h+14)/2,gz);
  mkDoor(-25.95,gz,w,h,0x9a7a52,'z');
}

/* 西教学楼（x=34）西侧开门，与东楼对称 */
function carveWestDoor(){
  const gz=2, w=4, h=3.4;
  dropBody(16,14,32,34,2);
  const segD=(32-w)/2;
  box(16,14,segD,0xd9c6a3, 34,7,-(w/2+segD/2)+gz);
  box(16,14,segD,0xd9c6a3, 34,7, (w/2+segD/2)+gz);
  box(16,14-h,w,0xd9c6a3, 34,(h+14)/2,gz);
  mkDoor(25.95,gz,w,h,0x9a7a52,'z');
}

/* 行政楼（z=26，深 15，从 18.5 到 33.5）南面开门 */
/* 和主楼同理：先摘掉原来的整块 34x11x15，再拼两段。 */
function dropAdminBody(){
  for(let i=colliders.length-1;i>=0;i--){
    const m=colliders[i];
    if(!m.geometry) continue;
    if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const bb=m.geometry.boundingBox; if(!bb) continue;
    const w=bb.max.x-bb.min.x, h=bb.max.y-bb.min.y, d=bb.max.z-bb.min.z;
    if(Math.abs(w-34)<0.01 && Math.abs(h-11)<0.01 && Math.abs(d-15)<0.01
       && Math.abs(m.position.x)<0.01 && Math.abs(m.position.z-26)<0.01){
      scene.remove(m);
      colliders.splice(i,1);
      return true;
    }
  }
  return false;
}
function carveAdminDoor(){
  dropAdminBody();
  const gx=0, w=4, h=3.2;
  const segW=(34-w)/2;                    // 每段 15
  box(segW,11,15,0xcfbc9a,-(w/2+segW/2),5.5,26);
  box(segW,11,15,0xcfbc9a, (w/2+segW/2),5.5,26);
  box(w,11-h,15,0xcfbc9a,gx,(h+11)/2,26);
  mkDoor(gx,18.45,w,h,0x8a6a45,'x');
}

/* ==================== 操场扩容 ==================== */
/* 原来操场在 (20,30)，跑道 44x30，紧贴行政楼北侧，几乎没有活动空间。
   现在把整个操场搬到校园东北角的大空地上，做成 400m 标准场地，
   并补上篮球场/沙坑/看台/体育馆，让地图从「楼间小过道」变成有层次的场地。 */
function buildSportsZone(){
  /* 真正的草地底面（比跑道大一圈） */
  groundDeco(96,64,0x5f8a52,16,34);

  /* ---- 400m 跑道：8 条道 ---- */
  groundDeco(86,52,0xa83528,16,34);      // 红色跑道整体
  groundDeco(76,42,0x5c8a4f,16,34);      // 场地绿
  /* 分道线 */
  for(let i=1;i<=6;i++){
    groundDeco(76+i*1.6,42+i*1.6,0xffffff,16,34,.5);
  }
  /* 内场白边 */
  groundDeco(58,26,0xffffff,16,34,.55);
  groundDeco(56,24,0x4f7a45,16,34,1);
  /* 中线与中圈 */
  groundDeco(.3,24,0xffffff,16,34,.8);
  groundDeco(7,7,0xffffff,16,34,.25);

  /* ---- 足球门（两端） ---- */
  for(const gz of [22,46]){
    box(.25,2.4,.25,0xffffff,-12,1.2,gz,true);
    box(.25,2.4,.25,0xffffff,44,1.2,gz,true);
    box(56.25,.25,.25,0xffffff,16,2.4,gz,true);
  }

  /* ---- 看台（操场南侧，可走上去？不，用矮台阶即可） ---- */
  for(let i=0;i<4;i++){
    box(60,.7,1.6,0x9aa3ab,16,.35+i*0.7,60-i*1.7);
  }
  /* 看台遮阳棚支柱 */
  for(const sx of [-12,40]){
    cyl(.18,.18,7,0x888888,sx,3.5,58,true);
  }

  /* ---- 沙坑（跳远） ---- */
  groundDeco(9,5,0xdcc89a,52,-4);

  /* ---- 篮球场（操场西侧） ----
     【位置修正】原来放在 (-30,18)，但西教学楼在 x=34（16 宽，即 26..42），
     东教学楼在 x=-34（即 -42..-26）—— 也就是说 (-30,18) 正好在
     东教学楼肚子里，整块球场和两个篮球架都被埋在楼里，
     表现出来就是「球场线穿进教学楼」「篮球架看不见」。
     现在挪到东西楼之间的空地 (-18,6)，
     这片区域 x 从 -26 到 -10 是空的，尺寸也收窄到 12x20。 */
  groundDeco(12,20,0x46545f,-18,6);
  groundDeco(.3,18,0xffffff,-18,6,.85);
  groundDeco(12,.3,0xffffff,-18,6,.85);
  groundDeco(3,3,0xffffff,-18,6,.4);
  for(const bx of [-23.5,-12.5]){
    cyl(.14,.14,3.4,0x777777,bx,1.7,6,true);
    box(2.2,.14,1.2,0xffffff,bx,3.2,6,true);
  }

  /* ---- 体育馆（操场东侧的一栋新建筑，有门可进） ---- */
  /* 直接建成两段带门洞的样子，不要先造整块再拆 */
  const gymW=26, gymD=34, gymH=10, gymDoor=4;
  const gymSeg=(gymW-gymDoor)/2;      // 每段 11
  box(gymSeg,gymH,gymD,0xc8cdd4,58-(gymDoor/2+gymSeg/2),gymH/2,18);
  box(gymSeg,gymH,gymD,0xc8cdd4,58+(gymDoor/2+gymSeg/2),gymH/2,18);
  box(gymDoor,gymH-3.6,gymD,0xc8cdd4,58,(3.6+gymH)/2,18);   // 门洞过梁
  box(27,.6,35,0x6b7078,58,10.3,18);                        // 屋顶
  mkDoor(58,0.95,gymDoor,3.6,0x8a7a5a,'x');

  /* ---- 路灯（操场四角） ---- */
  for(const lp of [[-28,-2],[60,-2],[-28,62],[60,62]]){
    cyl(.12,.16,6,0x555555,lp[0],3,lp[1],true);
    const la=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),
      new THREE.MeshStandardMaterial({color:0xfff5d0,emissive:0xffeaa0,emissiveIntensity:.6}));
    la.position.set(lp[0],6.2,lp[1]); scene.add(la);
  }
}

/* ==================== NPC / 敌人布置 ==================== */
/* 原来 8 个敌人挤在 60x80 的楼间区域，走三步一个，完全没有「搜」的空间。
   现在砍到 4 个，并且分散到操场、篮球场、体育馆、教学楼一层内部，
   每个点位都藏在不同场景里，玩家需要主动去找。 */
/* 4 个点位，全部经过体检脚本验证不在任何碰撞体内：
     - 篮球场挪到 (-18,6) 之后，敌人跟着挪过去
     - 操场中央、体育馆内、主楼一层内保持不变 */
const NPC_POINTS=[
  [16,34],    // 操场中央，视野开阔
  [-18,6],    // 篮球场（修正：原来 (-30,18) 在东教学楼肚子里）
  [58,18],    // 体育馆内部
  [0,-22],    // 主教学楼一层内部
];

/* ==================== 统一交互入口 ==================== */
/* f_ui 里 KeyE 和右下角的交互按钮都调用 interact()，
   但之前这个函数根本没定义 —— 按 E 会直接 ReferenceError。
   现在把「当前可交互对象」集中在一处判断：
   门优先，其次才是拾取等其它交互。 */
function interact(){
  if(!P.alive) return;
  const d=findNearDoor();
  if(d){ toggleDoor(d); return true; }
  return false;
}

/* 屏幕提示条点击也能开门（手机上没有键盘） */
function bindDoorHint(){
  const el=$('doorHint');
  if(!el||el.__bound) return;
  el.__bound=true;
  const tap=(e)=>{ e.preventDefault(); e.stopPropagation(); interact(); };
  el.addEventListener('touchstart',tap,{passive:false});
  el.addEventListener('click',tap);
}

/* ============ GM 隐藏面板 ============
   入口：主菜单连续点键盘 D 键 15 次。
   【为什么不用一个显眼的按钮】
   这是个调试/爽玩用的后门，不该让正常玩家误触，
   所以埋成打击键的彩蛋。连续按，中间断了就重新计数。
   面板可拖动（拖标题栏）、可收起（− 或 关闭），
   且不拦截游戏输入 —— 它浮在最上层，但点它自己的按钮才会响应。 */
const GM_HITS=15;              // 需要连点的次数
const GM_RESET_MS=1200;        // 超过这么久没按就清零
let _gmCount=0, _gmLast=0, _gmOpen=false;

/* 加钱：直接改 P.ammo.cash，并立刻刷新所有显示金额的地方。
   注意不能只改 DOM —— P.ammo.cash 才是数据源，
   否则一刷新 HUD 就把假数字盖回去了。 */
function gmAddCash(n){
  const v=Number(n)||0;
  /* 只允许加钱：这个面板是「开发者给自己发钱」，
     不该能当扣钱按钮用（万一误点到 -9999999 把存档搞坏就麻烦了）。
     要减少金额请用「设定…」直接输入目标值。 */
  if(!(v>0)) return;
  P.ammo.cash=Math.max(0,(P.ammo.cash|0)+v);
  gmPaint();
  try{ refreshHUD(); }catch(e){}
  try{ if(typeof buildShop==='function') buildShop(); }catch(e){}
  try{ if(typeof buildMenuStats==='function') buildMenuStats(); }catch(e){}
  try{ if(typeof sfxUI==='function') sfxUI(); }catch(e){}
}
function gmSetCash(n){
  const v=Math.max(0,Math.floor(Number(n)||0));
  P.ammo.cash=v;
  gmPaint();
  try{ refreshHUD(); }catch(e){}
  try{ if(typeof buildShop==='function') buildShop(); }catch(e){}
}
function gmPaint(){
  const el=document.getElementById('gmCashNum');
  if(el) el.textContent=(P.ammo.cash|0).toLocaleString('en-US');
}

function gmToggle(force){
  const el=document.getElementById('gmPanel');
  if(!el) return;
  _gmOpen = (typeof force==='boolean') ? force : !_gmOpen;
  el.classList.toggle('on', _gmOpen);
  /* 在控制台里手动试的时候方便：__gm() 直接看状态 */
  if(window.__GM_DEBUG) console.log('[GM] open='+_gmOpen);
  if(_gmOpen){
    gmPaint();
    /* 第一次打开时把位置初始化到右下角，之后由拖动决定 */
    gmClampPos(el);
  }
}
/* 把面板夹在可视区域内，避免拖到屏幕外面就找不回来了 */
function gmClampPos(el){
  if(!el) return;
  const w=el.offsetWidth||236, h=el.offsetHeight||80;
  const W=window.innerWidth||360, H=window.innerHeight||640;
  let x=parseFloat(el.dataset.gx);
  let y=parseFloat(el.dataset.gy);
  if(!isFinite(x)) x=W-w-18;
  if(!isFinite(y)) y=H-h-18;
  x=Math.max(4,Math.min(W-w-4,x));
  y=Math.max(4,Math.min(H-h-4,y));
  el.dataset.gx=x; el.dataset.gy=y;
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.right='auto'; el.style.bottom='auto';
}
/* 拖动：pointer 事件对鼠标和触摸都生效，比分别绑 mousedown/touchstart 简洁。
   只在标题栏上发起拖动，避免在按钮上拖时点不到按钮。 */
function gmBindDrag(el, head){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  const down=(e)=>{
    if(e.target && e.target.id==='gmMin') return;   // 收起按钮不触发拖动
    dragging=true;
    const p=gmPoint(e);
    sx=p.x; sy=p.y;
    ox=parseFloat(el.dataset.gx)||0;
    oy=parseFloat(el.dataset.gy)||0;
    if(e.cancelable) e.preventDefault();
  };
  const move=(e)=>{
    if(!dragging) return;
    const p=gmPoint(e);
    const W=window.innerWidth||360, H=window.innerHeight||640;
    const w=el.offsetWidth||236, h=el.offsetHeight||80;
    let nx=ox+(p.x-sx), ny=oy+(p.y-sy);
    nx=Math.max(4,Math.min(W-w-4,nx));
    ny=Math.max(4,Math.min(H-h-4,ny));
    el.dataset.gx=nx; el.dataset.gy=ny;
    el.style.left=nx+'px'; el.style.top=ny+'px';
    if(e.cancelable) e.preventDefault();
  };
  const up=()=>{ dragging=false; };
  head.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  /* 没有 pointer 事件的老 WebView 退化为 touch + mouse */
  if(!window.PointerEvent){
    head.addEventListener('touchstart',down,{passive:false});
    head.addEventListener('touchmove',move,{passive:false});
    head.addEventListener('touchend',up);
    head.addEventListener('mousedown',down);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  }
}
function gmPoint(e){
  if(e.touches && e.touches.length) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return {x:e.clientX||0,y:e.clientY||0};
}

/* 初始化：绑按钮 + 挂 D 键计数 */
function initGM(){
  const el=document.getElementById('gmPanel');
  if(!el || el.dataset.bound==='1') return;
  el.dataset.bound='1';
  const head=document.getElementById('gmHead');
  if(head) gmBindDrag(el, head);
  /* 金额按钮 */
  for(const btn of el.querySelectorAll('[data-gm]')){
    const amt=parseInt(btn.getAttribute('data-gm'),10);
    btn.addEventListener('click',(e)=>{ e.stopPropagation(); gmAddCash(amt); });
  }
  const setBtn=document.getElementById('gmSet');
  if(setBtn) setBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    /* 用原生 prompt：这个面板就是给开发者自己用的，
       为了它引入一个自制弹窗不划算。 */
    const cur=String(P.ammo.cash|0);
    const v=(typeof prompt==='function') ? prompt('设定资金（当前 '+cur+'）', cur) : null;
    if(v!==null && v!==undefined && v!=='') gmSetCash(v);
  });
  const hideBtn=document.getElementById('gmHide');
  if(hideBtn) hideBtn.addEventListener('click',(e)=>{ e.stopPropagation(); gmToggle(false); });
  const minBtn=document.getElementById('gmMin');
  if(minBtn) minBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    el.classList.toggle('min');
    minBtn.textContent=el.classList.contains('min')?'+':'−';
    gmClampPos(el);
  });
  /* 【手机上的解锁入口】操作说明里那个「D」按键图标可以点。
     手机压根没有键盘，光绑 keydown 等于把彩蛋锁死在桌面端；
     这里把菜单里的 <kbd id="gmKeyD">D</kbd> 也绑上，
     触屏和鼠标都能点，和键盘走同一个计数函数。
     touchstart + click 双绑：touchstart 让反馈更跟手，
     click 兜底老 WebView；两者都用 e.repeat 那套防重复逻辑
     （gmHitD 内部是计数，重复调用只会多加一次，所以这里
      用 preventDefault 挡掉 touchstart 之后浏览器补发的 click）。 */
  const keyD=document.getElementById('gmKeyD');
  if(keyD){
    let lastTouch=0;
    /* 直接调 gmCountHit：点得到这个 <kbd> 就说明菜单开着，
       不必再走 gmMenuVisible 的可见性判断（那一步是给键盘准备的，
       防止游戏里按 D 向右走时误触）。 */
    keyD.addEventListener('touchstart',(e)=>{
      lastTouch=Date.now();
      if(e.cancelable) e.preventDefault();
      gmCountHit();
    },{passive:false});
    keyD.addEventListener('click',(e)=>{
      e.stopPropagation();
      /* touchstart 刚处理过就别再算一次，否则点一下记两次 */
      if(Date.now()-lastTouch<600) return;
      gmCountHit();
    });
    /* 兜底：某些老 WebView 只派发 pointerdown 不派发 touchstart/click */
    keyD.addEventListener('pointerdown',(e)=>{
      if(e.pointerType==='mouse') return;   // 鼠标交给 click，避免双击记两次
      lastTouch=Date.now();
      gmCountHit();
    });
  }
}

/* 主菜单 D 键计数。
   【要点】只在菜单可见时计数，游戏中按 D 是「向右走」，
   不该被当成彩蛋触发。
   【为什么不能只查 style.display】菜单的默认显示来自 CSS 的
   `#menu{display:flex}`，内联 style.display 是空串而不是 'flex'，
   一旦哪天有人把内联值改掉（或换成 class 控制），
   这里的判断就会一直误判成「不可见」，面板怎么也开不出来。
   所以按优先级依次确认：内联 display: none -> 不可见；
   否则看计算样式（getComputedStyle）；拿不到计算样式时才退回内联值。 */
function gmMenuVisible(){
  const menu=document.getElementById('menu');
  if(!menu) return false;
  if(menu.style && menu.style.display==='none') return false;
  let vis='';
  try{
    if(window.getComputedStyle) vis=(window.getComputedStyle(menu).display||'');
  }catch(e){}
  if(!vis) vis=(menu.style&&menu.style.display)||'';
  return vis!=='none' && vis!=='';
}
function gmHitD(){
  if(!gmMenuVisible()) return;
  gmCountHit();
}
/* 真正计数的那一步，键盘和点击共用。
   【为什么不把可见性判断也放进来】点击「D」按键图标时，
   手指按在菜单上，菜单必然可见；但万一将来把 <kbd> 挪到别处
   （或者面板被别的层盖住），按可见性判断会直接吞掉点击，
   又变成「点了没反应」。所以点击入口信任调用方，
   键盘入口（可能在游戏里按到）才必须查可见性。 */
function gmCountHit(){
  const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  if(now-_gmLast>GM_RESET_MS) _gmCount=0;
  _gmLast=now;
  _gmCount++;
  /* 从第 2 次开始给一点反馈：不然连点 15 下全程毫无动静，
     用户根本分不清是「没绑上」还是「还差几下」。
     toast 只在开局几次显示，避免最后几次刷屏。 */
  if(_gmCount>=2 && _gmCount<GM_HITS){
    try{ toast('GM ' + _gmCount + '/' + GM_HITS); }catch(e){}
  }
  if(window.__GM_DEBUG) console.log('[GM] '+_gmCount+'/'+GM_HITS);
  if(_gmCount>=GM_HITS){
    _gmCount=0;
    gmToggle(true);
    try{ toast('GM 面板已解锁'); }catch(e){}
  }
}

/* ============ 武器皮肤（颜色 + 发光特效） ============
   皮肤只改材质，不改几何体 —— 这样一支枪能用任意皮肤，
   不用给每个组合都建一遍模型。
   结构：SKINS[id] = { name, colors:{涂装色}, glow:{发光色, 强度}, deco:'aura'|'none' }
   glow 用 MeshStandardMaterial 的 emissive/emissiveIntensity，
   不需要额外的后期处理就能有很明显的「这把枪在发光」的观感。 */
const SKINS={
  skin_none:{ get name(){ return T('原厂'); },
    main:0x2e3238, dark:0x15171b, steel:0x646a74, poly:0x3a3f47, grip:0x1e2126,
    glow:0x000000, glowI:0, deco:'none' },
  skin_neon:{ get name(){ return T('霓虹夜光'); },
    main:0x1a2436, dark:0x0d1220, steel:0x39e8ff, poly:0x131b2a, grip:0x0e1420,
    glow:0x18e0ff, glowI:0.95, deco:'aura' },
  skin_blood:{ get name(){ return T('赤血红'); },
    main:0x2a0d10, dark:0x140507, steel:0xff3b3b, poly:0x1d0a0c, grip:0x120607,
    glow:0xff2233, glowI:1.15, deco:'aura' },
  skin_gold:{ get name(){ return T('黄金'); },
    main:0x3a2c10, dark:0x1d1607, steel:0xffd24a, poly:0x4a3812, grip:0x241b0a,
    glow:0xffb524, glowI:0.55, deco:'none' },
  skin_toxic:{ get name(){ return T('毒液幽绿'); },
    main:0x12220f, dark:0x081207, steel:0x7cff4a, poly:0x0f1c0c, grip:0x0a1208,
    glow:0x6cff3a, glowI:1.05, deco:'aura' },
  skin_void:{ get name(){ return T('虚空紫'); },
    main:0x1c1030, dark:0x0c0618, steel:0xb46cff, poly:0x160c26, grip:0x0e0719,
    glow:0x9a4dff, glowI:1.25, deco:'aura' },
};
const SKIN_IDS=Object.keys(SKINS);
/* 皮肤加成：只给一点主题色，不破坏平衡（纯外观，零属性） */
function skinOf(id){ return SKINS[id]||SKINS.skin_none; }

/* 根据皮肤造一组材质。
   【为什么要重建而不是改色】
   MeshStandardMaterial 的 color 可以 setHex 临时改，但每个 mesh 可能
   共享同一个材质对象（mat() 每次新建所以其实不共享），
   为了安全起见重新造一套最省心，而且开火前的重建频率只有「换武器/换皮肤」
   这一次，不在每帧执行。 */
function skinMats(sk){
  const g=Math.max(0,sk.glowI||0);
  const mk=(col)=>{ const m=mat(col,0.42,0.85);
    if(g>0 && sk.glow){
      m.emissive=new THREE.Color(sk.glow);
      m.emissiveIntensity=g;
    }
    return m;
  };
  return { main:mk(sk.main), dark:mk(sk.dark), steel:mk(sk.steel),
           poly:mk(sk.poly), grip:mk(sk.grip) };
}

/* 当前装备的皮肤（存在 P.skins[slot] 里，没设就用原厂） */
function curSkinId(){
  const id=slotItem(P.slot);
  if(!id) return 'skin_none';
  const m=(P.skins&&P.skins[id])||null;
  return (m&&SKINS[m]) ? m : 'skin_none';
}
function setSkin(itemId, skinId){
  if(!SKINS[skinId]) return false;
  if(!P.skins) P.skins={};
  P.skins[itemId]=skinId;
  _modelCache.key=null;        // 强制下次 applyWeaponModel 重建
  return true;
}

/* ---- 雷明顿 M870 泵动霰弹枪 ----
   结构和步枪不同：
     1) 下挂弹管（tube）—— 泵动枪的标志，子弹塞在枪管下面
     2) 可滑动的护木（pumpGrip）—— 这是泵动动作的本体，
        开完一枪它要往后拉 7cm 再推回去
     3) 没有弹匣，靠弹管供弹
   护木必须单独拿出来建，并挂到 g.userData 之外通过返回值带出去，
   因为动画要单独改它的 position.z。 */
function buildM870(PAL){
  const g=new THREE.Group();
  const C=PAL||{main:0x35302a,dark:0x15171b,steel:0x5e646e,poly:0x5a3d22};
  const dark=mat(C.main,0.62,0.45);   // 木纹/聚合物
  const black=mat(C.dark,0.6,0.85);
  const steel=mat(C.steel,0.34,0.95);
  const wood=mat(C.poly,0.78,0.15);

  // 机匣
  const recv=new THREE.Mesh(new THREE.BoxGeometry(0.075,0.082,0.26), dark);
  recv.position.set(0,0.030,-0.06); g.add(recv);
  // 枪管（粗，霰弹枪特征）
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,0.52,12), steel);
  barrel.rotation.x=Math.PI/2; barrel.position.set(0,0.046,-0.44); g.add(barrel);
  // 下挂弹管
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.020,0.020,0.42,10), black);
  tube.rotation.x=Math.PI/2; tube.position.set(0,0.006,-0.40); g.add(tube);
  // 弹管帽
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.023,0.023,0.03,10), steel);
  cap.rotation.x=Math.PI/2; cap.position.set(0,0.006,-0.61); g.add(cap);
  // 可动护木（泵动本体）
  const pumpGrip=new THREE.Mesh(new THREE.BoxGeometry(0.062,0.056,0.14), wood);
  pumpGrip.position.set(0,0.006,-0.30); g.add(pumpGrip);
  /* 护木上的防滑纹（两条细槽），让它一眼能看出是泵动握把 */
  for(const dz of [-0.035,0.035]){
    const rib=new THREE.Mesh(new THREE.BoxGeometry(0.066,0.010,0.010), black);
    rib.position.set(0,0.006,-0.30+dz); g.add(rib);
  }
  // 握把（枪颈）
  const grip=new THREE.Mesh(new THREE.BoxGeometry(0.056,0.14,0.078), wood);
  grip.position.set(0,-0.095,0.075); grip.rotation.x=-0.34; g.add(grip);
  // 枪托
  const stock=new THREE.Mesh(new THREE.BoxGeometry(0.056,0.085,0.22), wood);
  stock.position.set(0,0.010,0.26); g.add(stock);
  // 托底
  const butt=new THREE.Mesh(new THREE.BoxGeometry(0.060,0.11,0.032), black);
  butt.position.set(0,0.004,0.375); g.add(butt);
  // 抛壳口
  const ej=new THREE.Mesh(new THREE.BoxGeometry(0.078,0.032,0.055), black);
  ej.position.set(0,0.042,0.040); g.add(ej);
  /* 机瞄：霰弹枪用「珠状准星 + 缺口照门」，
     珠星放在枪口上方，照门在机匣尾，两者构成瞄准线 */
  const bead=new THREE.Mesh(new THREE.SphereGeometry(0.007,8,8), steel);
  bead.position.set(0,0.076,-0.665); g.add(bead);
  const rear=new THREE.Mesh(new THREE.BoxGeometry(0.030,0.013,0.014), black);
  rear.position.set(0,0.074,0.055); g.add(rear);
  /* 把护木暴露出去：泵动动画要单独动它。
     THREE.Group 的 userData 在真机里能用，但测试桩里的
     Group 桩不保证有 userData 字段，所以统一在 updWeapon 里兜底创建。 */
  if(!g.userData) g.userData={};
  g.userData.pumpGrip=pumpGrip;
  return g;
}
/* 双手（简化胶囊 + 手指块） */
function buildHand(isLeft){
  const g=new THREE.Group();

  // 四指（包住握把）
  for(let i=0;i<4;i++){
    const f=new THREE.Mesh(new THREE.BoxGeometry(0.020,0.052,0.058), skin);
    f.position.set(-0.026+i*0.0175,-0.052,-0.005);
    f.rotation.x=0.55; g.add(f);
  }
  // 拇指
  const th=new THREE.Mesh(new THREE.BoxGeometry(0.022,0.062,0.026), skin);
  th.position.set(isLeft?0.038:-0.038,-0.005,0.03);
  th.rotation.z=isLeft?-0.5:0.5; g.add(th);
  return g;
}

/* ============ 近战武器模型 ============
   五种刀，形状各不相同：
     knife   战术小刀  —— 短、直、通用
     karambit 爪刀      —— 弯刃，视觉最骚，反手握
     katana  太刀/长刀  —— 细长，挥砍感强
     machete 砍刀      —— 宽刃，厚背
     axe     战术斧    —— 斧头，沉重
   每个都是「刀刃 + 护手 + 刀柄 + 握持手」，只是几何参数和角度不同。
   配色来自皮肤系统，发光皮肤会让刀刃发光。

   姿态说明：近战武器在 FPS 里视角要更靠中间，
   所以整体往画面中心挪一点，握持角度也换成「反手握」的侧面姿态。 */

/* 在刀柄上叠几道指槽，所有刀共用 */
function knifeGrooves(g,rim,y0,n,step,w,h,z){
  for(let i=0;i<n;i++){
    const groove=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*0.95), rim);
    groove.position.set(0,y0+i*step,z); g.add(groove);
  }
}
