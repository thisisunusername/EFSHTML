/* 刀型分派：物品 id -> 形状 */
const KNIFE_BUILDERS={
  knife:  buildKnifeTypeKnife,
  karambit: buildKnifeTypeKarambit,
  katana: buildKnifeTypeKatana,
  machete: buildKnifeTypeMachete,
  axe:    buildKnifeTypeAxe,
};
/* 根据物品 id 决定用哪个刀型；认不出就当战术小刀 */
function knifeKindOf(itemId){
  const it=(typeof SHOP_ITEMS!=='undefined') && SHOP_ITEMS[itemId];
  const k=it && it.knife;
  return (k && KNIFE_BUILDERS[k]) ? k : 'knife';
}
/* 建刀 + 挂握持手（原来的 buildKnife 保持可用，供旧调用点） */
function buildKnife(kind, PAL){
  const fn=KNIFE_BUILDERS[kind]||KNIFE_BUILDERS.knife;
  const g=fn(PAL);
  const hand=buildHand(false);
  hand.position.set(0,-0.075,0.045);
  hand.rotation.x=-0.15;
  g.add(hand);
  return g;
}
/* 初始化武器（挂在相机上，跟随视角） */
function initWeapon(){
  if(weaponRoot) return;
  weaponRoot=new THREE.Group();
  // 位置：右下方，略微内收（腰射基准位姿，updWeapon 会每帧重算）
  weaponRoot.position.set(0.19,-0.17,-0.38);
  /* 【模型改为按需创建】
     以前这里一次性预建 rifle/pistol/knife 三把模型常驻内存，
     但它们既不支持皮肤也不支持多种刀型。
     现在只建一个空引擎，真的模型交给 applyWeaponModel()
     按「当前物品 id + 皮肤」生成，换枪时重建。 */
  camera.add(weaponRoot);
  if(!scene.children.includes(camera)) scene.add(camera); // 相机必须在场景里才会渲染子物体
  wsk={ activeModel:null, pumpGrip:null };
  applyWeaponModel();
}
/* ===== 手持武器槽：切换与查询 =====
   三个可用槽位，优先级就是数组顺序：
     primary   主武器（步枪/冲锋枪/狙击）—— 耗对应步枪弹
     secondary 手枪                      —— 耗手枪弹
     melee     副武器（小刀/警棍）        —— 永不耗弹，近战

   为什么不再用 P.inv.gun 布尔：
     那个布尔只能表达「有长枪 / 只有手枪」两种情况，
     玩家买了步枪之后就没法切回手枪，也没法掏刀。
     现在改成「当前手持哪一把」，装备槽里有什么就能切什么。 */

const WSLOTS=['primary','secondary','melee'];

/* 这一槽当前装的是哪把武器（item id），没有就是 null */
function slotItem(slot){ return (P.equip && P.equip[slot]) || null; }
/* 这一槽能不能用：装了东西才算 */
function slotUsable(slot){
  const id=slotItem(slot);
  if(!id) return false;
  return !!SHOP_ITEMS[id];
}
/* 当前手持武器是否远程（近战不耗弹、不用换弹） */
function curIsMelee(){ return P.slot==='melee'; }
function curIsPrimary(){ return P.slot==='primary'; }
/* 当前武器用的弹匣字段：near=主武器步枪弹 / secondary=手枪弹 / melee=无 */
function curAmmoKey(){
  if(curIsMelee()) return null;
  return curIsPrimary() ? 'gun' : 'ammo';
}
/* 后备弹字段：按「当前这把枪用什么弹」决定，不能按槽位硬写。
   以前主武器一律返回 'rifle'，装了 M870（吃 shot）就会
   从步枪弹里扣后备，换弹时还会把霰弹位置错扣空。
   ammoType 已经在 SHOP_ITEMS 里登记好（rifle/pistol/sniper/shot），
   这里直接用它；没登记才退回按槽位的老逻辑。 */
function curReserveKey(){
  if(curIsMelee()) return null;
  const it=curItem();
  const at=it&&it.ammoType;
  if(at==='rifle'||at==='pistol'||at==='sniper'||at==='shot') return at;
  return curIsPrimary() ? 'rifle' : 'pistol';
}
/* 当前武器的伤害（数据来自物品表，买更好的枪就更疼） */
function curDamage(){
  /* 近战读物品表的 dmg：小刀 35 / 爪刀 42 / 太刀 56 / 战术斧 95。
     以前这里写死成 40，导致买更贵的刀伤害完全没变（花钱没效果）。 */
  if(curIsMelee()){
    const mit=curMeleeItem();
    return (mit&&mit.dmg) || 40;
  }
  const id=slotItem(P.slot);
  const it=id&&SHOP_ITEMS[id];
  return (it&&it.dmg) || (curIsPrimary()?26:14);
}
/* ---- 射击模式 ----
   auto = 全自动（按住持续开火）
   semi = 半自动（一次扳机一发，射速由 fireCd 限制）
   bolt = 栓动（每发之间要拉枪机，冷却很长）
   pump = 泵动（每发之间要拉护木，见 pumpTime）
   近战不算枪械：单发、无模式。
   数据来自 SHOP_ITEMS[id].fireMode，没写就当 semi —— 这样以后
   新加武器忘了填字段也不会变成突突突。 */
const FIRE_MODES=['auto','semi','bolt','pump'];
function curItem(){
  if(curIsMelee()) return null;
  const id=slotItem(P.slot);
  return (id&&SHOP_ITEMS[id])||null;
}
/* 取当前手持武器的物品数据，近战也算（curItem 对近战返回 null，
   因为枪械逻辑要把刀排除在外，但刀的伤害/间隔/范围需要读表）。 */
function curMeleeItem(){
  const id=slotItem(P.slot);
  return (id&&SHOP_ITEMS[id])||null;
}
function curFireMode(){
  if(curIsMelee()) return 'melee';
  const it=curItem();
  const m=it&&it.fireMode;
  return FIRE_MODES.includes(m) ? m : 'semi';
}
/* 只有全自动才允许「按住不放持续开火」。
   semi/bolt/pump/melee 都得重新按一次。 */
function curIsAuto(){ return curFireMode()==='auto'; }
/* 开火间隔：优先读物品表的 fireCd；
   以前写死成 primary 0.12 / secondary 0.18，导致狙击枪和步枪
   射速一模一样，栓动枪完全没有手感。 */
function curFireCd(){
  /* 近战武器各有自己的挥砍间隔（斧头慢、爪刀快） */
  if(curIsMelee()){
    const mit=curMeleeItem();
    return (mit&&mit.meleeCd) || 0.42;
  }
  const it=curItem();
  if(it && it.fireCd) return it.fireCd;
  return curIsPrimary() ? 0.12 : 0.18;
}
/* 泵动/栓动要额外拉栓的时间（只对 pump 有意义） */
function curPumpTime(){
  const it=curItem();
  const t=it&&it.pumpTime;
  return (typeof t==='number' && t>0) ? t : 0;
}
/* 霰弹枪一次打几颗弹丸；普通枪是 1 */
function curPellets(){
  const it=curItem();
  const n=it&&it.pellets;
  return (typeof n==='number' && n>1) ? (n|0) : 1;
}
/* 后坐力系数：霰弹枪/栓动枪甩得厉害，冲锋枪最稳 */
function curRecoilK(){
  const it=curItem();
  const k=it&&it.recoil;
  return (typeof k==='number' && k>0) ? k : 1;
}
/* 射击模式的 HUD 显示名（走 i18n） */
function fireModeLabel(){
  switch(curFireMode()){
    case 'auto': return T('全自动');
    case 'semi': return T('半自动');
    case 'bolt': return T('栓动');
    case 'pump': return T('泵动');
    default:     return T('近战');
  }
}

/* 切到指定槽位。返回是否切换成功（没装备就切不过去）。 */
function switchSlot(slot, quiet){
  if(!WSLOTS.includes(slot)) return false;
  if(slot===P.slot) return false;
  if(!slotUsable(slot)){
    if(!quiet) toast(slotName(slot)+'槽是空的');
    return false;
  }
  /* 换枪要打断换弹：换弹到一半切成别的枪，
     那颗子弹应该留在原来那把枪里，不能凭空装上。 */
  if(P.reload){ P.reload=false; P.reloadT=0; }
  P.slot=slot;
  P.slotT=0;              // 触发抬枪动画
  P.shootCd=Math.max(P.shootCd, curFireCd()); // 切枪后有个最小间隔，防止瞬间连射
  sfxUI();
  syncWeapon();
  refreshHUD();
  refreshWpnBar();     // 底部切换条同步高亮
  if(!quiet) toast('切到 '+slotName(slot));
  return true;
}

/* 中文名，给 HUD 和提示用 */
function slotName(slot){
  return slot==='primary'?'主武器':slot==='secondary'?'手枪':'副武器';
}
function slotIcon(slot){
  return slot==='primary'?'🔫':slot==='secondary'?'🔫':'🔪';
}

/* 循环切到下一把可用的武器（按主武器 -> 手枪 -> 刀 的顺序）
   给手机上「点一下切枪」这种单键操作准备。 */
function cycleSlot(){
  const cur=WSLOTS.indexOf(P.slot);
  for(let i=1;i<=WSLOTS.length;i++){
    const s=WSLOTS[(cur+i)%WSLOTS.length];
    if(slotUsable(s)) return switchSlot(s);
  }
  toast('没有可切换的武器');
  return false;
}

/* 出门时校正一次：装备槽里空空如也的话，P.slot 可能指向一个空槽，
   这时自动落回第一个可用槽，避免开局拿着空气。 */
function fixSlot(){
  if(slotUsable(P.slot)) return P.slot;
  for(const s of WSLOTS){
    if(slotUsable(s)){ P.slot=s; return s; }
  }
  P.slot='melee';   // 连刀都没有的极端情况，至少别崩
  return P.slot;
}

/* 根据当前武器切换显示。
   模型的生命周期已经交给 applyWeaponModel()，这里只需要
   在切槽时刷新一次即可（它内部会做脏检查，重复调用无代价）。 */
function syncWeapon(){
  if(!weaponRoot) return;
  _modelCache.key=null;     // 强制重建，因为槽位变了
  applyWeaponModel();
  /* 换枪瞬间把武器往下甩一点（P.slotT 控制），
     0 -> 1 表示「放下旧枪又抬上新枪」的过渡。 */
  if(P.slotT!==undefined) P.slotT=Math.min(1,P.slotT);
}
/* ---- 按「物品 id + 皮肤」重建模型 ----
   以前主武器槽只有一个步枪模型，买什么长枪都长一样。
   现在模型 = 物品 id 对应的形状 × 当前皮肤配色，
   换枪/换皮肤都需要重建，所以用 cacheKey 做脏检查。

   【为什么要重建而不是只改材质颜色】
   皮肤会改发光（emissive），而 MeshStandardMaterial 的 emissive
   在一个条链路上套用不上时不好统一改；重建一次只发生在换枪瞬间，
   每帧跑不到，性能上是可接受的。
   旧模型必须从 weaponRoot 里 remove 掉，否则换几次皮肤就会
   在相机前面叠一堆看不见的废模型。 */
const _modelCache={key:null};
function curModelKind(){
  if(P.slot==='melee') return 'knife';
  if(P.slot==='secondary') return 'pistol';
  const it=curItem();
  if(it && (it.pellets>1 || it.ammoType==='shot')) return 'shotgun';
  return 'rifle';
}
/* 把皮肤配色转成各 builder 认识的形式 */
function skinPaletteFor(kind){
  const sk=skinOf(curSkinId());
  if(kind==='knife'){
    return { steel:sk.steel, grip:sk.grip, rim:sk.steel };
  }
  return { main:sk.main, dark:sk.dark, steel:sk.steel,
           poly:sk.poly, grip:sk.grip };
}
function buildWeaponFor(kind){
  const PAL=skinPaletteFor(kind);
  if(kind==='knife'){
    const id=slotItem(P.slot);
    return buildKnife(knifeKindOf(id), PAL);
  }
  if(kind==='pistol') return buildPistol(PAL);
  if(kind==='shotgun') return buildM870(PAL);
  return buildRifle(PAL);
}
function applyWeaponModel(){
  if(!weaponRoot) return;
  const id=slotItem(P.slot)||'__none__';
  const kind=curModelKind();
  const skin=curSkinId();
  const key=id+'|'+kind+'|'+skin;
  if(_modelCache.key===key) return;      // 什么都没变，不碰节点
  _modelCache.key=key;
  /* 旧模型移走：不动 visible 而是直接 remove，避免堆积 */
  const old=wsk.activeModel;
  if(old && weaponRoot.children.indexOf(old)>=0) weaponRoot.remove(old);
  /* 新模型 */
  const m=buildWeaponFor(kind);
  /* 重新挂双手（新模型是新建的 Group，手也得重新加） */
  if(kind==='shotgun'){
    const sR=buildHand(false); sR.position.set(0.012,-0.115,0.10);
    const sL=buildHand(true);  sL.position.set(0.004,-0.078,-0.30);
    m.add(sR); m.add(sL);
  }else if(kind!=='knife'){
    /* 刀自带一只手，不额外加 */
    const rH=buildHand(false); rH.position.set(0.012,-0.115,0.10);
    const lH=buildHand(true);  lH.position.set(0.0,-0.115,0.10);
    m.add(rH); m.add(lH);
  }
  m.visible=true;
  weaponRoot.add(m);
  wsk.activeModel=m;
  /* 霰弹枪的护木引用要跟着换新模型更新，否则泵动动画会去动一个
     已经被 remove 掉的旧节点（表现为护木不动） */
  if(kind==='shotgun' && m.userData && m.userData.pumpGrip){
    wsk.pumpGrip=m.userData.pumpGrip;
  }else{
    wsk.pumpGrip=null;
  }
  /* 换枪时清零泵动进度，避免新枪一出来就在拉护木 */
  wPump=0;
  /* 皮肤带的装饰光环要重挂（因为整个模型换了） */
  attachAura(kind, skin);
}

/* ---- 皮肤装饰：环绕光环（只有 deco==='aura' 的皮肤才有） ----
   用两个半透明环叠在枪身上，配合 emissive 发光，
   看起来像「枪周围有一圈能量」。它们在 updWeapon 里缓缓旋转。 */
let _aura=null;
function attachAura(kind, skinId){
  if(_aura && _aura.parent) _aura.parent.remove(_aura);
  _aura=null;
  const sk=skinOf(skinId);
  if(!sk || sk.deco!=='aura') return;
  const m=wsk&&wsk.activeModel;
  if(!m) return;
  const col=new THREE.Color(sk.glow||sk.steel);
  const g=new THREE.Group();
  const rmat=new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.34,
    side:THREE.DoubleSide });
  const r1=new THREE.Mesh(new THREE.TorusGeometry(0.13,0.006,6,22), rmat);
  r1.rotation.x=Math.PI/2; r1.position.set(0,0.02,-0.18); g.add(r1);
  const r2=new THREE.Mesh(new THREE.TorusGeometry(0.09,0.004,6,18), rmat);
  r2.position.set(0,0.02,-0.10); g.add(r2);
  m.add(g);
  _aura=g;
}

/* ============ 检视武器（Inspect） ============
   按 F（桌面）或点 HUD 上的「检视」按钮，武器会在摄像头前
   转一圈给玩家看 —— 这是让皮肤/刀型能被看见的关键。
   时长 INSPECT_TIME 秒，wInsT 从 1 线性降到 0，
   姿势由 updWeapon 末尾按 sin 曲线叠加，结束时自动归位。
   检视期间不能开火（枪都转过去了），但可以移动。 */
const INSPECT_TIME=1.5;
function startInspect(){
  if(P.reload) return false;
  if(wInsT>0) return false;       // 正在检视就不重来
  wInsT=1;
  wInsDur=INSPECT_TIME;
  if(typeof sfxUI==='function') sfxUI();
  return true;
}
function updInspect(dt){
  if(wInsT<=0) return;
  wInsT=Math.max(0, wInsT - dt/Math.max(0.1,wInsDur));
}
function isInspecting(){ return wInsT>0; }

/* ---- 每帧更新：走路晃动/* ---- 每帧更新：走路晃动 + 后坐力回弹 + 换弹动作 + 奔跑收枪 + 机瞄 ----
   【机瞄位姿】
   开镜（P.aiming）时不能只缩 FOV —— 那样枪还停在屏幕右下方，
   看起来像「把镜头拉近了」而已，根本不像举枪瞄准。
   真正的机瞄要把武器模型平移到屏幕正中、把枪身上的准星/照门
   对齐到视线中点，同时把枪身旋转归零。
   每把枪的机构高度不同（pistol 0.093 / rifle 0.092 / sniper 镜筒 0.125），
   所以用物品表里的 adsZ / adsY / sightY 三个字段描述各自的瞄准位姿：
     adsZ   开镜后武器往镜头方向推多近（越大越近）
     adsY   开镜后整枪左右中心的 Y 偏移（让准星对准屏幕中心）
     sightY 这把枪瞄具的光轴高度，用来算「把光轴抬到 0」需要下移多少
   wAds 就是 0~1 的机瞄插值量，直接跟随 P.aimT（updP 里已经平滑过），
   这样开镜/关镜两边共用同一条曲线，不会一个快一个慢。
   以前 wAds 声明了但从不赋值、也不参与计算，等于死代码。 */
function updWeapon(dt){
  if(!weaponRoot||!wsk) return;
  /* 把当前武器按「物品 id + 刀型 + 皮肤」换成对应模型。
     【注意】以前这里会先比较 wsk.rifle/pistol/knife 三个模型的 visible
     再决定要不要 syncWeapon()，但那种「预建三个模型、靠 visible 切换」
     的做法已经被淘汰了（不支持皮肤和多刀型）。
     现在只有一个 activeModel，检查工作全在 applyWeaponModel() 里
     用 key 做脏检查，不一致才重建，一致就什么都不做。 */
  applyWeaponModel();
  /* 换枪动画：切槽后 P.slotT 从 0 涨到 1，
     这段时间武器整体往下沉，做「放下旧枪、抬起新枪」的观感。 */
  if(P.slotT<1) P.slotT=Math.min(1, P.slotT + dt*3.2);
  const swapDip=(1-P.slotT)*0.22;   // 0 -> 0.22 米的下坠量
  const spd=Math.hypot(P.vel.x,P.vel.z);
  const moving=spd>0.5&&P.onGround;
  const sprinting=P.sprinting&&moving;
  // 平滑过渡系数（避免姿态突变）
  const k=Math.min(1,dt*10);
  wSprint = wSprint+( (sprinting?1:0) - wSprint )*k;
  /* 机瞄插值：直接复用 updP 算好的 P.aimT（0~1）。
     奔跑时禁止机瞄：端着枪跑还开着镜不合逻辑，且会和冲刺姿态打架。
     近战没有机瞄（刀没瞄具），强制归零。 */
  /* 检视时也压掉机瞄：一边转枪一边开镜会互相打架 */
  const adsTarget = (P.aimT||0) * (1-wSprint) * (curIsMelee()?0:1) * (wInsT>0?0:1);
  const adsK = Math.min(1, dt*14);
  wAds += (adsTarget - wAds)*adsK;
  if(wAds<0.0005) wAds=0;
  // ===== 泵动/栓动作动：拉护木 =====
  updPump(dt, wAds);
  // ===== 皮肤光环缓缓旋转 =====
  if(_aura){ _aura.rotation.y += dt*1.35; _aura.rotation.z += dt*0.55; }
  // ===== 检视武器 =====
  updInspect(dt);
  // 走路晃动：冲刺时频率和幅度都加大
  wBobT+=dt*(moving?spd*(sprinting?2.1:1.6):0);
  const bobAmt=moving?Math.min(spd/10,1):0;
  const bobScale=sprinting?1.85:1;
  /* 开镜时晃动幅度大幅衰减（稳定持枪），不然准星一直在跳没法瞄 */
  const bobAds=(1-wAds*0.82);
  const bobX=Math.sin(wBobT)*0.012*bobAmt*bobScale*bobAds;
  const bobY=Math.abs(Math.cos(wBobT))*0.010*bobAmt*bobScale*bobAds;
  // 开火后坐力衰减
  if(wRecoil>0) wRecoil=Math.max(0,wRecoil-dt*6);
  /* 开镜后后坐力的视觉幅度减小：
     抵肩射击时枪身是往后顶的，不该像腰射那样乱甩。 */
  const recoilVis=wRecoil*(1-wAds*0.55);
  // 换弹下沉
  const reloadDip=P.reload?0.09:0;
  const reloadRot=P.reload?0.5:0;
  // ===== 奔跑姿态：枪身放低、向内倾斜、上下颠 =====
  // 右手枪判断（冲刺时把枪压低并向左收）
  const s2=wSprint;
  const bobRun=Math.sin(wBobT*1.0)*0.028*s2;
  /* ---- 枪身基准位姿（腰射） ---- */
  const hipX=0.19, hipY=-0.17, hipZ=-0.38;
  /* ---- 机瞄目标位姿 ----
     读取当前武器在物品表里登记的瞄准参数，
     没有装备数据（比如调试状态）就用步枪的默认值。 */
  const it=curItem();
  const adsZ = (it&&it.adsZ) || 0.62;
  const adsY = (it&&it.adsY) || 0.013;
  const sightY = (it&&it.sightY) || 0.092;
  /* 把光轴抬到屏幕中心：sightY 是瞄具相对枪身原点的高度，
     想让准星落在视线中心，枪身就得下移同样的量。
     再乘 0.55 是因为相机近裁剪和 FOV 会让实际视觉高度小于模型高度，
     全量下移会「瞄具跑到准星下面」，只下移一半左右最自然。 */
  const adsYTarget = adsY - sightY*0.55;
  const adsZTarget = -0.38 + (adsZ-0.62);   // 各枪自己推近，步枪=基准
  const a=wAds;
  /* 位置：腰射位姿 -> 机瞄位姿 线性插值
     X 收到 0（对准屏幕正中），Y 只保留微小偏移，Z 按枪型推近 */
  weaponRoot.position.x = (hipX + bobX*(1-a) - 0.055*s2)*(1-a) + 0.0*a;
  weaponRoot.position.y = ((hipY - bobY - recoilVis*0.03 - reloadDip) - 0.075*s2 + bobRun - swapDip)*(1-a)
                          + (adsYTarget - recoilVis*0.012 - swapDip)*a;
  weaponRoot.position.z = ((-0.38 + recoilVis*0.06) + 0.055*s2)*(1-a)
                          + (adsZTarget + recoilVis*0.035)*a;
  /* 旋转：开镜时全部归零（枪身端正），奔跑时朝左下压 */
  weaponRoot.rotation.x = (recoilVis*0.16 + reloadRot*0.35 + 0.42*s2)*(1-a)
                          + (recoilVis*0.05)*a;
  weaponRoot.rotation.z = (Math.sin(wBobT*0.5)*0.02*bobAmt + reloadRot*0.25 + 0.30*s2)*(1-a);
  weaponRoot.rotation.y = ((P.reload?0.3:0) + 0.22*s2)*(1-a);
  /* ---- 叠加检视姿势（最后一步，直接加到已有位姿上） ----
     用 additive 的方式，这样不用重写前面那一大堆插值公式，
     检视结束后各分量回 0，武器自然回到原来的姿态。 */
  if(wInsT>0){
    const p=wInsT;                      // 1 -> 0
    const swing=Math.sin((1-p)*Math.PI); // 0 -> 1 -> 0 的来回
    weaponRoot.position.x += -0.26*p + Math.sin((1-p)*Math.PI*2)*0.05*p;
    weaponRoot.position.y += 0.10*p;
    weaponRoot.position.z += 0.12*p;
    weaponRoot.rotation.y += 1.15*swing + 0.35*p;
    weaponRoot.rotation.x += -0.28*swing;
    weaponRoot.rotation.z += 0.45*swing;
  }
}
/* 泵动动画：开完一枪后护木往后拉再推回去。
   wPump 在 fire() 里被置为 1，这里每帧衰减。
   用 sin 曲线：0->1 是往后拉，1->0 是往前推，一个来回 = 上膛完毕。
   护木模型的引用存在 wsk.pumpGrip，没有就跳过（手枪/步枪没护木）。 */
function updPump(dt){
  if(wPump<=0) return;
  const t=wPump;
  wPump=Math.max(0, wPump - dt/Math.max(0.05, wPumpDur));
  /* 曲线：先加速拉到底再推回，用 sin 做平滑 */
  const phase=Math.sin((1-t)*Math.PI);
  const g=wsk&&wsk.pumpGrip;
  if(g){
    if(!g.userData) g.userData={};
    if(g.userData.z0===undefined) g.userData.z0=g.position.z;
    /* 护木沿着枪身轴往后（+z）拉约 7cm */
    g.position.z = g.userData.z0 + phase*0.07;
  }
  /* 整枪也跟着泵动的节奏轻颤，增加手感 */
  if(wPump===0 && g){
    if(g.userData.z0!==undefined) g.position.z=g.userData.z0;
  }
}
/* 开火时调用：给模型加后坐 */
function weaponKick(){ wRecoil=Math.min(1.2,wRecoil+0.85); }

/* ============ y_audio.js：Web Audio 合成音效（零素材、零依赖） ============ */
let AC=null, masterGain=null, sfxOn=true, noiseBuf=null;
const VOL={ master:0.55, shot:0.42, reload:0.3, hit:0.35, hurt:0.4, pickup:0.35, step:0.12, ui:0.25, ambient:0.16 };

function audioInit(){
  if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();
    masterGain.gain.value=VOL.master;
    masterGain.connect(AC.destination);
    // 预生成 1 秒白噪声缓冲（枪声/脚步/爆炸复用）
    const len=AC.sampleRate;
    noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    startAmbient();
  }catch(e){ console.warn('audio init failed',e); AC=null; }
  return AC;
}
// 移动端需要用户手势才能解锁音频
function audioResume(){ if(AC&&AC.state==='suspended') AC.resume(); }

/* ---- 基础合成器 ---- */
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||!sfxOn) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.3,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,delay){
  if(!AC||!sfxOn||!noiseBuf) return;
  const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const g=AC.createGain(), f=AC.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(6000,t0);
  f.frequency.exponentialRampToValueAtTime(400,t0+dur);
  g.gain.setValueAtTime(vol||0.3,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t0); s.stop(t0+dur+0.02);
}

/* ---- 具体音效 ---- */
function sfxShoot(){
  if(!AC) return;
  const g=!!(P&&P.inv&&P.inv.gun);
  noise(g?0.09:0.16, VOL.shot*(g?0.75:1));
  tone(g?180:95, g?0.07:0.13, 'square', VOL.shot*0.55, g?60:35);
  tone(g?900:520, 0.03, 'sawtooth', VOL.shot*0.2, 200);
}
function sfxReload(){
  tone(420,0.05,'square',VOL.reload,300,0);
  tone(300,0.05,'square',VOL.reload*0.8,220,0.13);
  tone(520,0.06,'square',VOL.reload,380,0.28);
}
function sfxEmpty(){ tone(1100,0.04,'square',VOL.ui*0.6,700); }
function sfxHit(){ tone(1500,0.06,'sine',VOL.hit,900); noise(0.05,VOL.hit*0.5); }
function sfxHeadshot(){ tone(2200,0.05,'sine',VOL.hit*1.1,1400); tone(3000,0.08,'sine',VOL.hit*0.7,1800,0.04); }
function sfxKill(){ tone(660,0.08,'triangle',VOL.hit,880); tone(990,0.12,'triangle',VOL.hit*0.8,1320,0.07); }
function sfxHurt(){
  noise(0.2,VOL.hurt*0.7); tone(140,0.22,'sawtooth',VOL.hurt*0.5,70);
  tone(90,0.25,'sine',VOL.hurt*0.6,45);
}
function sfxPickup(){
  tone(880,0.06,'sine',VOL.pickup,1320,0);
  tone(1320,0.09,'sine',VOL.pickup*0.8,1760,0.06);
}
function sfxStep(){
  if(!AC||!sfxOn) return;
  noise(0.045, VOL.step*(0.7+Math.random()*0.6));
}
function sfxUI(){ tone(600,0.04,'square',VOL.ui,900); }
function sfxBuy(){ tone(700,0.06,'sine',VOL.ui,1050,0); tone(1050,0.1,'sine',VOL.ui*0.8,1400,0.07); }
function sfxDeny(){ tone(220,0.14,'square',VOL.ui*0.9,140); }
function sfxExfil(){
  [523,659,784,1047].forEach((f,i)=>tone(f,0.22,'sine',VOL.pickup*0.9,f*1.02,i*0.14));
}
function sfxDeath(){
  tone(300,0.5,'sawtooth',VOL.hurt,60); noise(0.6,VOL.hurt*0.6);
  tone(150,0.7,'sine',VOL.hurt*0.7,40,0.1);
}

/* ---- 环境音：低频风噪，营造氛围 ---- */
function startAmbient(){
  if(!AC||!noiseBuf) return;
  try{
    const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320;
    const g=AC.createGain(); g.gain.value=VOL.ambient;
    s.connect(f); f.connect(g); g.connect(masterGain); s.start();
  }catch(e){}
}

/* ---- 脚步节流 ---- */
let stepT=0;
function updAudio(dt){
  if(!AC||!P.alive) return;
  if(!P.onGround) return;
  const sp=Math.hypot(P.vel.x,P.vel.z);
  if(sp>1.2){
    stepT-=dt*(sp/6);
    if(stepT<=0){ sfxStep(); stepT=0.42; }
  }
}

/* ============================================================
   _orient.js —— 3D 版强制横屏

   为什么不用 CSS transform:rotate 把整个游戏转过来？
   因为 3D 版有大量触摸坐标计算（摇杆、右半屏转视角、按钮热区），
   它们全都直接用 clientX/clientY 跟 innerWidth/innerHeight 算。
   一旦给容器加 rotate(90deg)，DOM 坐标和屏幕坐标就整体错位，
   所有触摸判定会全部偏掉 —— 那是比竖屏更难查的 bug。

   所以采用「强制横屏 + 竖屏遮罩」两条路：
   1) 能调 Screen Orientation API 就真的锁成 landscape
      （全屏状态下 Chrome / Android 有效）。
   2) 锁不住的（iOS Safari、非全屏、桌面小窗）就盖一层遮罩，
      提示把设备转过来，并在用户点击时尝试进全屏后再锁。
      竖屏下游戏本身照常渲染，只是被遮住，不会出现半截画面。
   ============================================================ */

/* 竖屏遮罩的 DOM id */
const ORIENT_MASK_ID = 'orientMask';

/* 当前是否处于「应该被遮住」的竖屏状态 */
let orientBlocked = false;

/* 判定竖屏：用 innerWidth/innerHeight。
   注意不能用 screen.orientation.type，部分 WebView 里它是空的。 */
function orientIsPortrait(){
  if(typeof window === 'undefined') return false;
  const w = window.innerWidth || 0;
  const h = window.innerHeight || 0;
  if(w <= 0 || h <= 0) return false;
  return h > w;
}

/* 尝试真正锁定横屏。失败不算错，遮罩会兜底。 */
function orientTryLock(){
  try{
    const so = (typeof screen !== 'undefined') ? screen.orientation : null;
    if(so && typeof so.lock === 'function'){
      const p = so.lock('landscape');
      /* lock() 返回 Promise，被拒时别让控制台报未捕获异常 */
      if(p && typeof p.catch === 'function') p.catch(function(){});
      return true;
    }
  }catch(e){}
  try{
    if(typeof screen !== 'undefined' && screen.lockOrientation){
      screen.lockOrientation('landscape');
      return true;
    }
  }catch(e){}
  return false;
}

/* 解除锁定（桌面宽屏时没必要锁） */
function orientUnlock(){
  try{
    const so = (typeof screen !== 'undefined') ? screen.orientation : null;
    if(so && typeof so.unlock === 'function') so.unlock();
  }catch(e){}
}

/* 创建遮罩 */
function orientBuildMask(){
  if(typeof document === 'undefined') return null;
  let m = document.getElementById(ORIENT_MASK_ID);
  if(m) return m;
  m = document.createElement('div');
  m.id = ORIENT_MASK_ID;
  m.innerHTML = ''
    + '<div class="omBox">'
    +   '<div class="omIcon">\uD83D\uDCF1</div>'
    +   '<div class="omTitle" data-om="title"></div>'
    +   '<div class="omDesc" data-om="desc"></div>'
    +   '<button class="omBtn" data-om="btn" type="button"></button>'
    + '</div>';
  document.body.appendChild(m);
  /* 遮罩本身吃掉所有事件，防止「竖屏时还能点到下面的按钮」 */
  m.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive:false });
  m.addEventListener('touchmove',  function(e){ e.preventDefault(); }, { passive:false });
  const btn = m.querySelector('[data-om="btn"]');
  if(btn){
    btn.onclick = function(ev){
      if(ev) ev.stopPropagation();
      /* 用户手势里先试全屏，再锁方向 —— 顺序不能反，
         非全屏状态下 lock() 基本都被拒。 */
      try{
        const el = document.documentElement;
        const rq = el.requestFullscreen || el.webkitRequestFullscreen;
        if(rq){
          const p = rq.call(el);
          if(p && typeof p.then === 'function'){
            p.then(function(){ orientTryLock(); orientRefresh(); }).catch(function(){ orientTryLock(); orientRefresh(); });
          } else { orientTryLock(); orientRefresh(); }
        } else { orientTryLock(); orientRefresh(); }
      }catch(e){ orientTryLock(); orientRefresh(); }
    };
  }
  return m;
}

/* 刷新遮罩上的文案（语言切换后要跟着变） */
function orientPaintMask(){
  const m = document.getElementById(ORIENT_MASK_ID);
  if(!m) return;
  const t = m.querySelector('[data-om="title"]');
  const d = m.querySelector('[data-om="desc"]');
  const b = m.querySelector('[data-om="btn"]');
  if(t) t.textContent = T('请横屏游玩');
  if(d) d.textContent = T('3D 第一人称需要横屏。把设备转过来，或者点下面的按钮。');
  if(b) b.textContent = T('进入横屏');
}

/* 核心：根据当前朝向决定遮罩显隐 */
function orientRefresh(){
  if(typeof document === 'undefined' || !document.body) return;
  const portrait = orientIsPortrait();
  const mask = orientBuildMask();
  if(!mask) return;
  const wasBlocked = orientBlocked;
  orientBlocked = portrait;
  orientPaintMask();
  if(portrait){
    mask.style.display = 'flex';
  } else {
    mask.style.display = 'none';
    /* 转到横屏了：如果之前正在玩，尝试顺便锁定一下，避免再转回去 */
    if(wasBlocked){ orientTryLock(); }
  }
  /* 通知渲染层重算尺寸。转屏时 innerWidth/Height 在部分机器上
     要晚一帧才更新，所以补一次 rAF。 */
  if(typeof window !== 'undefined' && typeof window.__relayout === 'function'){
    try{ window.__relayout(); }catch(e){}
    try{
      if(typeof requestAnimationFrame === 'function'){
        requestAnimationFrame(function(){ try{ window.__relayout(); }catch(e){} });
      }
    }catch(e){}
  }
}

/* 初始化：绑定事件 + 首次刷新。
   用 matchMedia('(orientation:portrait)') 精确监听，比 resize 稳，
   因为 resize 在转屏时会连发好几次。 */
function orientInit(){
  if(typeof window === 'undefined') return;
  orientBuildMask();
  orientRefresh();
  let mq = null;
  try{ mq = window.matchMedia('(orientation:portrait)'); }catch(e){ mq = null; }
  if(mq){
    const onChange = function(){ orientRefresh(); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }
  window.addEventListener('orientationchange', function(){ orientRefresh(); });
  window.addEventListener('resize', function(){ orientRefresh(); });
  if(typeof document !== 'undefined' && document.addEventListener){
    document.addEventListener('fullscreenchange', function(){ orientRefresh(); });
  }
  /* 桌面端：宽屏不锁，避免影响多窗口使用 */
  if(!orientIsPortrait()){
    const w = window.innerWidth || 0;
    if(w < 900) orientTryLock();
  }
}

/* ============ z_render.js：渲染循环 + 启动 ============ */

/* 安全调用：单个子系统抛错时只记一次日志，不中断整帧 */
const __errOnce={};
function safeCall(fn,arg){
  if(typeof fn!=='function') return;
  try{ fn(arg); }
  catch(e){
    const k=fn.name||'anon';
    /* 把最后一次错误暴露到调试面板上：
       如果 updP 每帧都抛错，玩家当然一动不动，
       而以前这个异常只在控制台里，屏幕上完全看不出来。 */
    window.__lastErr=k+':'+(e&&e.message?e.message.slice(0,40):'?');
    if(!__errOnce[k]){ __errOnce[k]=true; console.error('['+k+'] 出错（后续同类错误已静音）：',e); }
  }
}

/* ---- 相机抖动 / 后坐力（学自 saltline 的衰减双频正弦） ---- */
const shake={ t:0, power:0, active:false };
function addShake(power){ shake.power=Math.max(shake.power, power); shake.t=0; shake.active=true; }
function updShake(dt){
  if(!shake.active) return 0;
  shake.t+=dt;
  if(shake.t>0.9){ shake.active=false; shake.power=0; return 0; }
  // 衰减包络 × 双频正弦叠加（避免机械感）
  return shake.power*Math.exp(-shake.t*5)*(0.55+0.45*Math.sin(shake.t*47)*Math.sin(shake.t*13+1))*0.04;
}

/* ---- 像素预算制分辨率（学自 saltline：锁像素总数而非固定倍率） ---- */
const PIXEL_BUDGET=2300000; // 约 high 档
let curPixelScale=1;
let curW=0, curH=0;   // 记录上次画布尺寸，用于横竖屏切换时强制重建
function applyPixelBudget(){
  if(typeof renderer==='undefined'||!renderer) return;
  const w=Math.max(2,window.innerWidth), h=Math.max(2,window.innerHeight);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const pixels=w*dpr*h*dpr;
  let scale=1;
  if(pixels>PIXEL_BUDGET) scale=Math.sqrt(PIXEL_BUDGET/pixels);
  if(Math.abs(scale-curPixelScale)>0.01 || curW!==w || curH!==h){
    curPixelScale=scale; curW=w; curH=h;
    renderer.setPixelRatio(dpr*scale);
    /* 第 3 个参数必须为 true：要同时更新 canvas 的 CSS 尺寸。
       传 false 只改绘制缓冲区，样式尺寸还是旧的，
       移动端高 DPR 下会被拉伸/错位，严重时看起来像整屏发黑。 */
    renderer.setSize(w,h,true);
  }
  /* 【横屏必做】旋转屏幕后宽高比彻底变了，
     这里必须同步更新相机的 aspect 并重算投影矩阵，
     否则画面会被横向或纵向拉伸成变形（看起来很「错位」）。
     原来只在 resize 里调 applyPixelBudget，从没动过 aspect。 */
  if(typeof camera!=='undefined' && camera){
    const ar=w/h;
    if(Math.abs((camera.aspect||0)-ar) > 0.001){
      camera.aspect=ar;
      camera.updateProjectionMatrix();
    }
  }
}

function safeShake(dt){
  try{ return updShake(dt)||0; }catch(e){ return 0; }
}

function animate(){
  requestAnimationFrame(animate);
  if(!ready) return;
  const dt=Math.min(clock.getDelta(),0.05);
  /* 心跳统计：如果 frames 不涨，说明 animate 根本没在跑
     （WebView 后台、异常中断、或 ready 一直为 false），
     这是「怎么拖都不动」的另一种可能原因，直接显示出来好判断。 */
  window.__frames=(window.__frames||0)+1;
  window.__lastDt=dt;
  window.__fps=Math.round(1/Math.max(dt,0.001));

  /* 每个子系统单独兜底：任何一个抛错都不能拖垮渲染循环，
     否则会出现「场景/枪/人物全黑」这种整屏停摆。 */
  safeCall(updP,dt); safeCall(updFireHold,dt); safeCall(updE,dt); safeCall(updLoot,dt);
  safeCall(updDoors,dt);   // 门：高亮提示 + 开关动画
  safeCall(checkExfil); safeCall(updAudio,dt); safeCall(updWeapon,dt);

  // 相机抖动叠加（基准位置由 updP 写入）
  const sh=safeShake(dt);
  if(sh!==0){
    camera.position.x+=(Math.random()-0.5)*sh;
    camera.position.y+=(Math.random()-0.5)*sh;
  }

  refreshHUD();
  /* 渲染放在 try 里：万一某帧的子步骤抛错，
     用纯场景渲染兜底，绝不让画面停在全黑上等下一帧。 */
  try{
    renderer.render(scene,camera);
  }catch(e){
    if(!window.__renderErrShown){ window.__renderErrShown=true; console.error('render error',e); }
  }
}

/* 窗口尺寸 / 横竖屏变化时统一走这里。
   由 f_ui.js 的 bindUI 注册（window.__relayout），
   它会在 resize 与 orientationchange 里被调用，
   而且旋转后会延迟补调几次，确保拿到最终尺寸。
   这里同时重算相机宽高比，否则横屏画面会被拉伸变扁。 */
window.__relayout=function(){
  try{
    applyPixelBudget();
    if(typeof camera!=='undefined' && camera && window.innerWidth && window.innerHeight){
      const ar=window.innerWidth/window.innerHeight;
      if(Math.abs((camera.aspect||0)-ar)>0.001){
        camera.aspect=ar;
        camera.updateProjectionMatrix();
      }
    }
  }catch(e){}
};
window.addEventListener('resize',()=>{ if(typeof window.__relayout==='function') window.__relayout(); });

/* 【国际化】读语言 + 挂切换按钮 + 首次重绘。
   放在这里是刻意的：必须在所有分块都执行完（各 buildXXX 已定义）
   之后才能跑，否则重绘时函数还不存在。
   包 try 是因为即便国际化挂了，游戏本身也得能跑。 */
try{ if(typeof i18nInitUI==='function') i18nInitUI(); }catch(e){ console.error('i18n init failed', e); }

/* 【强制横屏】建遮罩 + 绑定转屏监听。
   同样放最后：orientRefresh 里会调 window.__relayout，
   那是上面刚定义的，必须已存在。 */
try{ if(typeof orientInit==='function') orientInit(); }catch(e){ console.error('orient init failed', e); }
/* 【GM 面板】绑拖动 + 加钱按钮。
   必须放在这里而不是 f_ui.js 的 bindUI 里：bindUI 在脚本执行到
   f_ui.js 时就跑了（那时文档已 ready），而 initGM 定义在后面的
   x_ext.js —— 那一刻还不存在，typeof 检查会静默跳过，
   结果就是「连点 D 15 次面板也不出来，而且没有任何报错」。
   initGM 内部有 dataset.bound 幂等保护，重复调用无害。 */
try{ if(typeof initGM==='function') initGM(); }catch(e){ console.error('GM init failed', e); }
// 启动：渲染循环立即开始（init 成功后 ready=true 才会真正渲染）
requestAnimationFrame(animate);
</script>
</body>
</html>
